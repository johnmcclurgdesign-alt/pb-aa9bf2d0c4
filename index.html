    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #app { width: 100%; height: 100%; }
      /* Way back to the gallery. Same button, same place, same behaviour as the
         Dripping Pickle's — it is site chrome, so it keeps the site's gold accent
         rather than this scene's teal. */
      #back {
        /* Below #load (20000), exactly as in the Pickle: the button reveals with
           the scene rather than floating over the loading cover. */
        position: fixed; left: 14px; top: 14px; z-index: 60;
        display: inline-flex; align-items: center; gap: 7px;
        padding: 7px 12px 7px 10px; border-radius: 7px;
        background: rgba(12, 15, 22, .72); border: 1px solid #232a38;
        color: #b9c0d0; text-decoration: none; backdrop-filter: blur(6px);
        font: 12px/1 -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em;
      }
      #back:hover { color: #fff; border-color: #c9a227; }
      /* Inside the surf iframe the surf chrome owns the way back (its LOOPS mark)
         — this button would double it, and worse, navigate the FRAME. */
      .framed #back { display: none; }
      /* 2026-09-03: hidden everywhere for now — it sat on top of the FPS counter
         during the phone perf work. Delete this rule to bring it back. */
      #back { display: none; }
      /* Loading cover — the Dripping Pickle's pattern: one opaque cover from
         first paint until the scene is complete plus a few rendered frames,
         so shader compilation happens behind it and the reveal is finished. */
      #load {
        position: fixed; inset: 0; z-index: 20000; background: #000;
        display: flex; align-items: center; justify-content: center;
        transition: opacity .8s ease;
      }
      /* The scene itself behind the bar, dimmed and blurred so the message reads (John 2026-09-29): the stream
         camera's first frame at the default look (tools/_raw/poster.mjs), in the canvas's own centred 16:9 box
         (`contain`), so the fade lands on the live scene where the picture was. */
      #load::before {
        content: ""; position: absolute; inset: 0;
        background: url(/pb-aa9bf2d0c4/loading.webp) center / contain no-repeat;
        filter: blur(12px) brightness(.42);
      }
      /* The header is the static Pirate Beach logo (source\Signboards\SVG\ThePirateBeach_logo.svg, fill set to the
         line's #d8d3c4). The animated one (tools/logo-layers.mjs) is parked for v0.1.13 (John 2026-09-29: "no sense
         in delaying this delivery"): its gull flipbook needed a WebKit-specific fix still unproven on the Mac.
         The line under it is IM Fell English italic, self-hosted (public/fonts, SIL OFL: OFL.txt beside it) and
         preloaded: the shell may not reach Google, and the cover is the first paint. Sizes follow the 16:9 frame
         (--fw): the logo 19% of its width tall, the line 2.3%. */
      @font-face { font-family: 'IM Fell English'; font-style: italic; src: url(/pb-aa9bf2d0c4/fonts/im-fell-english-italic.woff2) format('woff2'); font-display: block; }
      #load { --fw: min(100vw, 177.78vh); }
      #load .inner { position: relative; text-align: center; font: italic clamp(15px, calc(var(--fw) * .023), 28px)/1.5 'IM Fell English', Georgia, serif;
        color: #d8d3c4; text-shadow: 0 1px 4px rgba(0, 0, 0, .7); }
      #loadtxt { transition: opacity .25s; }
      #loadlogo { display: block; height: clamp(120px, calc(var(--fw) * .19), 440px); width: auto; margin: 0 auto .5em;
        filter: drop-shadow(0 1px 4px rgba(0, 0, 0, .7)); }   /* colour and shadow match the loading line */
      /* A plain spinner (v0.1.13; John's rolling waves are parked with the animated logo). It animates only
         `transform`, which the compositor runs even while the main thread is pinned compiling shaders. */
      #loadspin { --s: clamp(26px, calc(var(--fw) * .028), 52px); width: var(--s); height: var(--s); margin: .6em auto 0;
        box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(64, 214, 195, .18); border-top-color: #40d6c3;
        animation: pb-spin .9s linear infinite; will-change: transform; }
      #loadspin.failed { border-color: #e0604f; animation: none; }
      @keyframes pb-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #loadspin { animation-duration: 2.4s; } }
