    // audio graph is still running is heard over the shell's settings panel. And on
    // the way back, the shared clock has to be CAUGHT UP rather than resumed — the
    // scheduler replays what it missed and never resets to "now", which is the whole
    // of DP-W4's determinism. Both were left as TODOs by the DP1 branch and by
    // DP-W7's note; they are one line each and this row is where the branch merged.
    //
    // ★ AND THE TWO POSES ARE TWO DECLARED CAMERAS (Josh, 2026-09-11), not one camera with a
    // scripted push-in. This overturns Gate A §2.2 and PLAN §3's "one declared camera through
    // Beta" deliberately: the shell owns the switcher on every device class, it remembers the
    // viewer's choice per Loop, and a Loop that builds its own switcher builds it for one of
    // four. ⚠ The list MUST match `loop.json` — `tools/build-payload.sh` asserts both halves —
    // and the IDS ARE PERMANENT: the shell restores a remembered camera by id and, when an id
    // has gone, restores nothing rather than guessing at a label. `room` is first, so it is the
    // opening shot.
    const CAMERAS = [
      { id: 'room',    title: 'The Outpost' },
      { id: 'screens', title: 'The Screens' },
    ];
    // The rung we BOOTED, said back to the shell with `ready` (bridge v3). loop.json's `tiers` names
    // phone, tablet, laptop and desktop in this cook; when the shell asked for one of those, that is
    // what booted (laptop runs the desktop ladder, on the same files). Anything else — ultra, max, a
    // name added later, or no shell word at all — booted whatever class the ladder settled on.
    const BOOTED_TIER = !q.get('tier') && ['phone', 'tablet', 'laptop', 'desktop'].includes(SHELL_TIER)
      ? SHELL_TIER : TIER_CLASS;
    clvBridge = attachCollectivus({
      canvas: renderer.domElement,
      cameras: CAMERAS,
      tier: BOOTED_TIER,
      onCamera: (id) => (tvUX ? tvUX.setView(id) : false),
      pause()  {
        renderer.setAnimationLoop(null);
        tvVid?.pause();
        window.__audio?.pause();
      },
      resume() {
        renderer.setAnimationLoop(frameLoop);
        tvVid?.play().catch(() => {});
        window.__audio?.resume();
        events?.resume();
        // The belt integrates frame time, so it has to be told how long the app was away.
        const caught = conveyor?.catchUp?.() ?? 0;
        if (caught) clvBridge?.log?.(`dripping-pickle: resume — belt caught up ${caught.toFixed(1)} s`);
      },
      // Silence without stopping: the frame loop, the shared clock and the video all keep
      // running; only the Web Audio graph goes quiet. The telly's own <video> element is muted
      // by the shell already, but say it here too rather than depend on that.
      setMuted(m, gain) {
        window.__audio?.setMuted?.(m, gain);
        if (tvVid) tvVid.muted = true;   // it has always been muted; this makes it a statement
      },
    });
    // The opening shot is a camera arrival like any other, and the shell wants to hear about
    // it: "including the one you open on".
    reportViewToShell('room');

    // ★ The prepasses only need DEPTH, so they render with a depth-only override —
    // rendering them with full materials ran PCSS + GI + every texture a second
    // (and third) time per frame and threw all of it away: measured 18.8 ms →
    // 11.9 ms at the loop camera from this change alone. Two subtleties:
    // - Anything with depthWrite:false (glass, sky, dust) is HIDDEN for the pass,
    //   not overridden — under an override it would write depth, and a beam seen
    //   through a pane dies at the glass. Checked per frame, not cached: cheap
    //   (hundreds of objects), and it survives materials changing after load.
    // - The override ignores per-material side, so the depth material is
    //   DoubleSide — a wall whose front faces away must still stop the march.
    const walkBasicMat = new THREE.MeshBasicMaterial({ color: 0x808080 });
    const depthOnlyMat = new THREE.MeshDepthMaterial();
    depthOnlyMat.side = THREE.DoubleSide;
    const hiddenForDepth = [];
    function renderDepthOnly(target) {
      scene.traverse((o) => {
        const m = o.material;
        if (!m || !o.visible) return;
        const noWrite = Array.isArray(m) ? m.every((x) => x.depthWrite === false)
                                         : m.depthWrite === false;
        if (noWrite) { o.visible = false; hiddenForDepth.push(o); }
      });
      scene.overrideMaterial = depthOnlyMat;
      const prevTarget = renderer.getRenderTarget();
      renderer.setRenderTarget(target);
      renderer.clear();
      renderer.render(scene, camera);
      renderer.setRenderTarget(prevTarget);
      scene.overrideMaterial = null;
      for (const o of hiddenForDepth) o.visible = true;
      hiddenForDepth.length = 0;
    }

    // One full frame: every prepass plus the composer chain. The animation loop
    // calls it per frame, and the feedback panel calls it for screenshots — so a
    // captured shot carries the same grade, AO, lens and letterbox as the screen.
    let lastFrameT = 0;
    function renderFrame(t = lastFrameT) {
      // Exactly one shadow pass per frame, whichever render happens to come first.
      // (Re-armed here rather than at the end of the frame so a screenshot taken
      // through this same function is never drawn against a stale map.)
      renderer.shadowMap.needsUpdate = true;
      // the MSAA beauty render n8ao composites from (see the AO block up top)
      if (beautyRT && !walkSkipBeauty) {
        renderer.setRenderTarget(beautyRT);
        const ovr = walkBasic ? walkBasicMat : walkOverride;
        if (ovr) scene.overrideMaterial = ovr;
        renderer.render(scene, camera);
        if (ovr) scene.overrideMaterial = null;
        renderer.setRenderTarget(null);
      }
      // props-only depth for the AO's prop channel (props live on layer 1 too)
      if (aoPass && state.props) {
        camera.layers.set(1);
        renderDepthOnly(propsDepthRT);
        camera.layers.set(0);
      }
      // depth prepass for the shafts — needs its OWN target, sampling the buffer you
      // are drawing into is a feedback loop
      if (volPass.enabled && depthRT) {
        renderDepthOnly(depthRT);
      }
      looks.render(t);
    }

    // One function owns every size-dependent target, because the render scale
    // can now change at runtime (adaptive AA below) as well as on resize.
    function applyRenderScale(f) {
      renderScale = f;
      // The grain is sampled at the RENDER buffer's resolution, so a reduced scale magnifies
      // every fleck when the browser upscales. Compensate here, where the scale is known —
      // this is the fix for what got rung 5 refused on 2026-09-10. No-op at f = 1.
      lens.setRenderScale(f);
      const pr = Math.min(devicePixelRatio, 2) * f;
      renderer.setPixelRatio(pr);
      renderer.setSize(innerWidth, innerHeight);
      applyFov();
      looks.composer.setPixelRatio(pr);
      looks.setSize(innerWidth, innerHeight);
      if (aoPass) aoPass.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
      lens.setAspect(innerWidth / innerHeight);
      // the return control is sized against the real canvas so its glyphs are
      // never stretched by the window's aspect
      lens.setPromptCanvas(innerWidth, innerHeight, Math.min(devicePixelRatio, 2));
      if (depthRT) depthRT.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
      propsDepthRT.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
      if (beautyRT) beautyRT.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
    }
    // ★ A RESIZE RESETS THE SSAA LADDER (2026-08-19). The old listener carried
    // renderScale through the resize, and adaptAA only ever measures ONCE —
    // so 1.25x earned in a small window (easily under 10.5 ms now) survived a
    // maximise to 4K: 1.56x of 8.3 MP, 30+ ms frames, and a GPU-saturated tab
    // drags the whole browser's compositing with it. Reported as "it gets
    // worse over time" — the "over time" was the window getting bigger after
    // the one-shot measurement. Drop to 1x on any resize and re-earn at the
    // size actually on screen.
    addEventListener('resize', () => {
      if (!SSAA_FORCED && renderScale !== tierRenderScale) renderScale = tierRenderScale;
      aa.settled = false; aa.acc = [];
      applyRenderScale(renderScale);
    });

    // ── a lost GL context (#88, PLT-013) ──────────────────────────────────
    // ★ A DEGRADED PICTURE IS THE FAILURE THE HOST CANNOT SEE. Josh, twice on the iPad Pro:
    // the room's indirect lighting went out — walls, floor and props near-black while the
    // skylight, the three tellies, the lamp and the cat stayed lit — and later the picture
    // went fully black and came back on its own. The shell's picture census still says "drew
    // something", and a dark room is indistinguishable from an intended night grade, so
    // nothing anywhere reported a fault. The lead was in the shell's console, not in ours:
    //
    //   TypeError: null is not an object (evaluating 'gl.getShaderInfoLog( glVertexShader ).trim')
    //
    // which is what a program compiled against a LOST context looks like from inside three.
    //
    // ⚠ A clean lose/restore is ALREADY handled by three and needs none of this: measured here
    // with WEBGL_lose_context, the room comes back to lighting mean RGB 18.97,8.42,4.42 ->
    // 18.92,8.30,4.39 and 47.3% -> 47.0% lit, with the GI volume's four Data3DTextures keeping
    // their data. What is NOT handled is everything around it — nobody is told, an exception
    // thrown out of a compile takes the rest of the frame with it, and a program that failed
    // to link leaves its materials unlit for the rest of the session. That is the reported picture.
    // #142: the page's own lifecycle, logged, so a black flash on a device can be told apart
    // from the page being hidden or torn down underneath the Loop.
    for (const ev of ['visibilitychange', 'pagehide', 'pageshow']) {
      addEventListener(ev, () => window.collectivus?.log?.(
        `page ${ev}: ${document.visibilityState} at ${(performance.now() / 1000).toFixed(1)}s`));
    }
    // A hidden tab stops rAF exactly as a paused app does, and the website's player sends no
    // pause/resume at all (loops-docs 10-platform/05-contract.md), so the belt catches up here too.
    document.addEventListener('visibilitychange', () => { if (!document.hidden) conveyor?.catchUp?.(); });
    let ctxLostAt = 0;
    renderer.domElement.addEventListener('webglcontextlost', (e) => {
      // three preventDefaults this too; doing it ourselves removes the dependency on which
      // listener runs first, and without it the context is never restorable at all.
      e.preventDefault();
      ctxLostAt = performance.now();
      renderer.setAnimationLoop(null);
      window.collectivus?.log?.('gl: CONTEXT LOST — frame loop stopped, waiting for a restore');
    }, false);
    renderer.domElement.addEventListener('webglcontextrestored', () => {
      const downMs = Math.round(performance.now() - ctxLostAt);
      try {
        // three has re-initialised its own GL state by now. What it cannot know is which of
        // OUR targets and uploads have to be re-made, so re-make them all: applyRenderScale
        // already owns every size-dependent target (the composer, n8ao's beauty target and its
        // DepthTexture, the props-depth and shafts-depth targets), which is why the rebuild is
        // one call rather than a list that drifts out of date.
        applyRenderScale(renderScale);
        // ★ THE GI VOLUME IS FOUR Data3DTextures AND IT IS THE THING THAT WENT DARK. They keep
        // their `image.data` in JS, so a re-upload is a version bump — but only if something
        // asks for one, and nothing would have.
        for (const t of (gi && gi.textures) || []) t.needsUpdate = true;
        // Every lit material recompiles, so the PCSS and GI patches are re-applied by
        // onBeforeCompile on the way through. A program that failed to link during the loss is
        // exactly the "walls unlit, tellies still lit" picture, and this is what clears it.
        for (const m of litMaterials) m.needsUpdate = true;
        if (renderer.shadowMap) renderer.shadowMap.needsUpdate = true;
        renderer.setAnimationLoop(frameLoop);
        window.collectivus?.log?.('gl: context restored after ' + downMs + ' ms — targets rebuilt, '
          + 'GI re-uploaded, ' + litMaterials.size + ' material(s) queued to recompile');
      } catch (err) {
        window.collectivus?.error?.(err);
        console.warn('gl: rebuild after a context restore failed:', err);
      }
    }, false);

    // ★ AND AN EXCEPTION OUT OF A COMPILE MUST NOT TAKE THE LOOP WITH IT. The Gate B TypeError
    // is thrown from inside `renderer.render()`; uncaught, it escapes the frame callback, and
    // everything after it in that frame — the drift restore, the tier, the watchdogs — simply
    // does not run. Caught and reported ONCE per distinct message per five seconds, because the
    // alternative is either a dead Loop or a device log made useless by one repeated line. It is
    // never swallowed silently: a silent recovery hides the next one.
    const frameErrs = new Map();
    function reportFrameError(err) {
      const key = String((err && err.message) || err);
      const now = performance.now();
      if (now - (frameErrs.get(key) ?? -1e9) < 5000) return;
      frameErrs.set(key, now);
      window.collectivus?.error?.(err);
      console.warn('frame:', err);
    }

    // ── adaptive AA headroom ────────────────────────────────────────────────
    // "Drift is cool but ants ruin the scene" — the residual shimmer under
    // drift wants supersampling, but a flat 1.25x would ruin lesser hardware.
    // So the loop EARNS it: after the scene settles, average 120 frames; step
    // up to 1.25x only under 10.5 ms (1.56x the pixels lands ~15 ms, still
    // 60 fps), and step straight back down if the average ever passes 15.5.
    // ?ssaa=1.5 forces a scale, ?ssaa=1 pins it off.
    const SSAA_FORCED = parseFloat(q.get('ssaa') ?? '0');   // 0 = auto
    const aa = { acc: [], settled: false, lastT: 0 };
    function adaptAA(t, dt) {
      // A device on the ladder is already short of frame time; earning 1.56x the pixels
      // on top of that is the 2026-08-19 "it gets worse over time" bug with a new cause.
      if (TIER_START >= 1 || SSAA_FORCED || aa.settled || t < 6 || !state.props) return;
      aa.acc.push(dt * 1000);
      if (aa.acc.length < 120) return;
      const avg = aa.acc.reduce((a, b) => a + b, 0) / aa.acc.length;
      aa.acc = [];
      if (renderScale === 1 && avg < 10.5) applyRenderScale(1.25);   // earn it, then re-measure
      else if (renderScale > 1 && avg > 15.5) { applyRenderScale(1); aa.settled = true; }
      else aa.settled = true;
    }
    if (SSAA_FORCED && SSAA_FORCED !== 1) applyRenderScale(SSAA_FORCED);
  </script>
</body>
</html>
