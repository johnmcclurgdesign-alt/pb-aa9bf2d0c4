        const oneLitMat = new THREE.MeshStandardMaterial({ color: 0x9a8f80, roughness: 0.8 });
        const normalMat = new THREE.MeshNormalMaterial();
        const proxyRoot = () => scene.children.find((o) => o.name === 'RenderProxies');
        const pickRoot = () => scene.children.find((o) => o.name === 'Pickables');
        const hideOne = (o) => { if (o && o.visible) { o.visible = false; scnHidden.push(o); } };
        const fixedStates2 = [
          { id: 'g-null', note: 'control at rung 5', set: f5(() => {}), read: () => 'unchanged' },
          { id: 'g-tiny', note: 'rung 5 content at render scale 0.20 — pixels nearly free',
            set: f5(() => applyRenderScale(0.2)), read: () => renderScale },
          { id: 'g-unlit', note: 'W1\'s f-unlit again, as the anchor', set: f5(() => { walkBasic = true; }), read: () => walkBasic },
          { id: 'g-onelit', note: 'ONE lit standard material for every mesh — one program, shadows on',
            set: f5(() => { walkOverride = oneLitMat; }), read: () => (walkOverride === oneLitMat ? 'onelit' : 'own') },
          { id: 'g-normals', note: 'one normal-map-free program that reads normals, no lighting',
            set: f5(() => { walkOverride = normalMat; }), read: () => (walkOverride === normalMat ? 'normals' : 'own') },
          { id: 'g-noproxies', note: 'the 38 merged proxies hidden — 410k triangles, few draws',
            set: f5(() => hideOne(proxyRoot())), read: () => scnHidden.length },
          { id: 'g-nomeshes', note: 'the unmerged meshes hidden — 298k triangles, ~100 draws',
            set: f5(() => hideOne(pickRoot())), read: () => scnHidden.length },
        ];
        // ── W1c (?perfwalk=5 / CLV_PERF_WALK=5): RANK THE LEVERS THAT ARE LEFT ─────────────
        // ★ W1b (2026-09-22, iPhone 12 Pro) put the fixed cost on the LIT DRAWS: render scale
        //   0.2 buys nothing, 410k triangles hidden buy nothing, ~100 draws hidden buy ~7.7 ms,
        //   and one lit material for everything is barely cheaper than 127 — while the same
        //   draws unlit or normals-only run at 60. A lit program here binds 11-16 samplers and
        //   ~120 uniforms (2 shadowed suns, 4 RectAreaLights with their LTC tables, 6 points,
        //   the GI's four 3D textures). These states price what is left. Only the first is
        //   authorised to ship; the light states are a LOOK change, measured for a Gate C
        //   question, never shipped from here.
        const CUT17 = ["Merged:M_DPW_MetalRust_01:2", "Merged:M_Conduit_Galv_Boxes:2", "cable_box_3way003", "B\u00e9zierCurve048", "Merged:modular_factory_facade_windows_60:6", "Merged:modular_factory_facade_trim_01_60:6", "Merged:M_DPW_Rubber:2", "SM_DPW_Concrete_014002", "Merged:Chair_Office_Dark:2", "Cube", "Prop_Stapler_1", "Prop_Stapler_2", "Prop_Small_Table001_2", "Prop_Weird_Russian_Device001_10", "Rug003", "Cube065_4", "Prop_Vintage_Floor_Lamp_4"];
        const cutObjs = () => { const out = []; scene.traverse((o) => { if (o.isMesh && CUT17.includes(o.name)) out.push(o); }); return out; };
        const lightsOf = (type) => { const out = []; scene.traverse((o) => { if (o.isLight && o.type === type && o.visible) out.push(o); }); return out; };
        const hideAll = (list) => list.forEach(hideOne);
        let recvOff = [];
        const fixedStates3 = [
          { id: 'h-null', note: 'control at rung 5', set: f5(() => {}), read: () => 'unchanged' },
          { id: 'h-cut17', note: 'the 17 draws no loop-camera ray reaches — the licensed phone cut',
            set: f5(() => hideAll(cutObjs())), read: () => scnHidden.length },
          { id: 'h-norect', note: 'LOOK CHANGE, measured only: the four RectAreaLights off',
            set: f5(() => hideAll(lightsOf('RectAreaLight'))), read: () => scnHidden.length, warmMs: 8000 },
          { id: 'h-nopoint', note: 'LOOK CHANGE, measured only: the six point lights off',
            set: f5(() => hideAll(lightsOf('PointLight'))), read: () => scnHidden.length, warmMs: 8000 },
          { id: 'h-norecv', note: 'LOOK CHANGE, measured only: nothing receives a shadow',
            set: f5(() => { scene.traverse((o) => { if (o.isMesh && o.receiveShadow) { o.receiveShadow = false; recvOff.push(o); } }); }),
            read: () => recvOff.length, warmMs: 8000 },
          { id: 'h-cap20', note: 'a frame cap at 20 — every frame held for three refreshes',
            set: f5(() => { frameCapMs = 50; }), read: () => frameCapMs, measureMs: 15000 },
          { id: 'h-cap30', note: 'a frame cap at 30 — two refreshes when the frame allows it',
            set: f5(() => { frameCapMs = 1000 / 30; }), read: () => +frameCapMs.toFixed(1), measureMs: 15000 },
        ];
        // ── W2 (?perfwalk=6 / CLV_PERF_WALK=6): THE CADENCE, SIDE BY SIDE ─────────────────
        // Three 45 s holds for the art director to LOOK at, each with the cat sent (the mouse is
        // put on the floor first, because the hunt refuses without prey — W1's scripted press
        // was refused for exactly that reason). A: the shipping frame with the phone cut,
        // free-running (~24, uneven). B: the same, locked to 20. C: BEYOND AUTHORISATION —
        // the RectAreaLights and the point lights off and a cap at 30, to show what 30 would
        // cost the look. C is a Gate C question, never shipped from here.
        let kickTimer = null, kicks = 0;
        const kickCat = () => {
          clearInterval(kickTimer);
          kicks++;
          window.__events?.fire?.('mouse_errand');
          const t0 = performance.now();
          kickTimer = setInterval(() => {
            if (window.__mouse?.onFloor) {
              const ok = window.__events?.trigger?.('mouse');
              window.collectivus?.log?.(`walk: mouse pressed ${ok ? '— the cat is sent' : '— REFUSED'} ${((performance.now() - t0) / 1000).toFixed(1)} s after the errand`);
              clearInterval(kickTimer);
            } else if (performance.now() - t0 > 15000) {
              window.collectivus?.log?.('walk: ⚠ the mouse never reached the floor — this hold has no cat crossing');
              clearInterval(kickTimer);
            }
          }, 250);
        };
        const HOLD = { warmMs: 2000, measureMs: 45000 };
        const abStates = [
          { id: 'ab-A', note: 'A — free-running, the phone cut in (0:10-0:57)', ...HOLD,
            set: f5(() => kickCat()), read: () => `kicks ${kicks}` },
          { id: 'ab-B', note: 'B — locked to 20 (1:00-1:47)', ...HOLD,
            set: f5(() => { frameCapMs = 50; kickCat(); }), read: () => frameCapMs },
          { id: 'ab-C', note: 'C — BEYOND AUTH: area + point lights off, locked to 30 (1:50-2:37)', ...HOLD,
            set: f5(() => { hideAll(lightsOf('RectAreaLight')); hideAll(lightsOf('PointLight')); frameCapMs = 1000 / 30; kickCat(); }),
            read: () => `${scnHidden.length}/${frameCapMs.toFixed(1)}` },
        ];
        const WALK_MODE = q.get('perfwalk') === '6' || window.__CLV_PERF_WALK === 6 ? 6
                        : q.get('perfwalk') === '5' || window.__CLV_PERF_WALK === 5 ? 5
                        : q.get('perfwalk') === '4' || window.__CLV_PERF_WALK === 4 ? 4
                        : q.get('perfwalk') === '3' || window.__CLV_PERF_WALK === 3 ? 3
                        : q.get('perfwalk') === '2' || window.__CLV_PERF_WALK === 2 ? 2 : 1;
        if (WALK_MODE >= 3) {
          // Marks accumulate per part; the first mark after begin() times from begin().
          let t0 = 0, cur = null;
          walkProf = {
            last: {},
            begin() { cur = {}; t0 = performance.now(); },
            mark(k) { const t = performance.now(); cur[k] = (cur[k] || 0) + (t - t0); t0 = t; if (k === 'render') this.last = cur; },
          };
        }

        perfWalk = createPerfWalk({
          states: WALK_MODE === 6 ? abStates : WALK_MODE === 5 ? fixedStates3 : WALK_MODE === 4 ? fixedStates2 : WALK_MODE === 3 ? fixedStates : WALK_MODE === 2 ? comboStates : states,
          reset: WALK_MODE >= 3 ? fixedReset : resetAll,
          warmMs: 2000, measureMs: WALK_MODE >= 3 ? 8000 : 4000,
          baselineEvery: WALK_MODE === 6 ? 99 : WALK_MODE >= 3 ? 4 : 5,
          // The per-part JavaScript time of the frame that just rendered. ⚠ Read AFTER the render
          // (the walk's tick sits after renderFrame), so it is always a finished frame's figure.
          cpu: walkProf ? () => {
            const c = walkProf.last; if (!c || !('render' in c)) return null;
            const out = {}; let tot = 0;
            for (const k of ['ui', 'cat', 'mouse', 'belt', 'events', 'audio', 'misc', 'render']) {
              const v = c[k] || 0; out[k] = v; tot += v;
            }
            out.total = tot; return out;
          } : null,
          report: (line, data) => {
            console.log(line);
            window.collectivus?.log?.(line);
            if (data?.results) window.__walkResults = data.results;
          },
        });
        window.__walk = perfWalk;
        // For tools/walk-states-check.mjs, which is the thing that proves a state is not a
        // no-op. Exposed rather than duplicated: a second copy of this list would drift.
        window.__walkStates = { states, comboStates, fixedStates: [...fixedStates, ...fixedStates2, ...fixedStates3, ...abStates], reset: () => { resetAll(); clearFixed(); } };
        // ⚠ The ladder and the walk cannot both own the frame: a step-down mid-window
        //   changes the content under a measurement and lands on whichever pass is holding.
        //   A pinned tier is a stopped ladder (perf-tier.js `locked`), so say so loudly
        //   rather than silently measuring a moving room.
        if (!perfTier.locked) {
          const warn = 'perf walk: ⚠ the tier ladder is NOT pinned — add ?tierlevel=0 or the ' +
                       'step-down will move the content under a measurement';
          console.warn(warn); window.collectivus?.log?.(warn);
        }
      }

      window.__rt = {
        rig, sun, skyShadow, skylights, bounce, gi, apertures, buildingBox,
        setRigEnabled, setSunAngles, runBake, volPass,
        // The composited frame, on demand and at a TIME YOU CHOOSE. Any A/B against the
        // picture has to go through this rather than through looks.render(): with the AO
        // on, RenderPass is disabled and the composer reuses a cached beauty target, so a
        // grab taken that way reports zero difference for everything, including a control
        // that is definitely in frame (BUD1, 2026-09-10). Passing a fixed `t` freezes the
        // grain, the flare and the screens, which is what makes a null control read
        // exactly zero instead of "about zero".
        renderFrame: (t) => renderFrame(t),
        // For a desk gate that stops the loop to difference a frozen frame and then has to fly
        // the camera to the other pose (tools/phone-cuts-check.mjs).
        startLoop: () => renderer.setAnimationLoop(frameLoop),
        // The orbit target is half of a camera pose, and tools/flyto.js flies the two poses as a
        // straight lerp of position AND target — so a desk gate that has both can walk the flight
        // exactly instead of sampling it on a wall clock (tools/phone-cuts-check.mjs).
        get controls() { return controls; },
        renderer,
        saveGI: () => {
          const blob = new Blob([gi.serialise()], { type: 'application/octet-stream' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'gi_volume.bin';
          a.click();
        },
      };

      // ── the cat, for scripted checks (DP-W6) ────────────────────────────────
      // The row's gate is a statement about an HOUR of walking, which is neither
      // watchable nor renderable — a hidden browser pane stops rAF outright. So
      // the check is `window.__cat.sim(3600)`: the SHIPPED update(), stepped on a
      // fixed dt in a tight synchronous loop. A synchronous read is the sharpest
      // tool available through automation; anything needing frames to elapse is
      // not.
      window.__cat = {
        get walk() { return catWalk; },
        get ctl() { return catCtl; },
        get stride() { return catStride; },
        get phase() { return catCtl?.phase; },
        get roaming() { return catRoaming; },
        get hunting() { return !!catCtl?.hunting; },
        // The pose graph (NPC-005). `__cat` is a FACADE, and a scripted check that
        // reads a getter nobody added gets `undefined` — which JSON drops entirely,
        // so the row vanishes from the results rather than reading false.
        get idles() { return catIdles; },
        get pose() { return catIdles?.pose ?? null; },
        stats: () => catWalk?.stats(),
        /** INT-004's catch, from where he stands — see catCtl.pounceNow. */
        pounce: () => !!catCtl?.pounceNow(),
        sim: (seconds = 3600, dt = 1 / 30) => catWalk?.sim(seconds, dt),
        // ★ "HE FACES THE ROOM" IS A CLAIM ABOUT AN ANGLE, SO MEASURE IT. The nap
        // yaw carried a comment saying it faced away from the wall, and it faced
        // the brick — nothing in the pipeline minds, and the only reader is a
        // person looking at the picture. Forward is local +Z (the same convention
        // measureAuthoredSpeed assumes, which is why the rigs are authored facing
        // Blender -Y); 0° means he looks straight down the lens.
        facing: () => {
          if (!catObj) return null;
          const fwd = new THREE.Vector3(0, 0, 1)
            .applyQuaternion(new THREE.Quaternion().setFromRotationMatrix(catObj.matrixWorld));
          const pos = new THREE.Vector3().setFromMatrixPosition(catObj.matrixWorld);
          const toCam = camera.position.clone().sub(pos);
          fwd.y = 0; toCam.y = 0; fwd.normalize(); toCam.normalize();
          return {
            toCameraDeg: THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(fwd.dot(toCam), -1, 1))),
            forward: fwd.toArray().map((n) => +n.toFixed(3)),
          };
        },
      };

      writeHud();

      // ?budget=1 — the measurement harness. Deliberately NOT behind DEV: it has to
      // measure the clean app entry, because that is the build that ships. It adds no
      // chrome and no passes; it reads the frame that was going to be drawn anyway.
      // ── audio (DP-W7, AUD-001…004) ───────────────────────────────────────
      // The bed, the drip and the event sink. tools/audio.js holds the slot table, the synthesis
      // and the mix; this block is only about WHERE things are in this room and WHAT the room's
      // own systems have to say. ?audio=0 is silence, ?vol= / ?mixbed= etc. are the mix.
      //
      // ★ THE ENGINE WAS ALREADY WAITING: DP-W4 shipped the audio channel as a RECORDER, so every
      //   cue in every event file has been firing, logging and aligning across devices since then
      //   and making no sound. Registering the sink is the whole of turning it on — no event file
      //   changed for this row, and `verifyVocabulary()` must still come back [].
      //
      // ★ AND A SUSPENDED CONTEXT IS INDISTINGUISHABLE FROM A WIRED ONE IN THE LOG. Browsers
      //   refuse audio until a gesture; window.__audio.unlocked is the thing to read.
      if (q.get('audio') !== '0') {
        try {
          audio = createAudio({ assetBase: '../../assets/dripping-pickle/audio/', query: q });
          if (!audio) throw new Error('this browser has no Web Audio');
          await audio.ready;

          // ── where the sounds are ──
          // ★ MEASURED OFF THE ROOM, NOT TYPED. A panner at a typed coordinate is the transistor
          // radio's failure with no picture to catch it: it would sit inside a wall and simply
          // sound wrong, quietly, forever. Everything here comes from the object's own bounds.
          const centreOf = (o) => new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
          const named = (re) => {
            const hits = [];
            pickables.traverse((o) => { if (o.isMesh && re.test(o.name)) hits.push(o); });
            return hits;
          };

          // ── the belt is a LINE, and a 5 m machine heard as a dot is wrong from every seat ──
          // ★ A POINT EMITTER AT THE CENTRE OF A LONG SOURCE IS AUDIBLY WRONG AT BOTH ENDS: stand
          // under one end of the conveyor and the sound comes from six metres away, over there.
          // The emitter tracks the NEAREST POINT on the belt's own path to the listener, which is
          // what a line source sounds like and costs one walk of a short polyline per update.
          let beltFollow = null, beltPos = null;
          if (conveyor && typeof conveyor.path?.sample === 'function') {
            // The path is a sampler (arc length -> point), not an array — so take a polyline off
            // it once, every 25 cm, and walk that. The belt does not move; only the ear does.
            const pts = [];
            {
              const _p = new THREE.Vector3(), _t = new THREE.Vector3();
              for (let d = 0; d <= conveyor.path.length; d += 0.25) {
                conveyor.path.sample(Math.min(d, conveyor.path.length), _p, _t);
                pts.push(_p.clone());
              }
              const off = conveyor.group.position;
              if (off && (off.x || off.y || off.z)) for (const v of pts) v.add(off);
            }
            const near = new THREE.Vector3(), seg = new THREE.Vector3(), rel = new THREE.Vector3();
            beltFollow = () => {
              const ear = audio.listener;
              let best = Infinity;
              for (let i = 0; i < pts.length - 1; i++) {
                const a = pts[i], b = pts[i + 1];
                seg.subVectors(b, a);
                rel.set(ear.x - a.x, ear.y - a.y, ear.z - a.z);
                const t = THREE.MathUtils.clamp(rel.dot(seg) / Math.max(seg.lengthSq(), 1e-6), 0, 1);
                const px = a.x + seg.x * t, py = a.y + seg.y * t, pz = a.z + seg.z * t;
                const d2 = (px - ear.x) ** 2 + (py - ear.y) ** 2 + (pz - ear.z) ** 2;
                if (d2 < best) { best = d2; near.set(px, py, pz); }
              }
              return near;
            };
            beltPos = centreOf(conveyor.group);
          } else if (conveyor) {
            beltPos = centreOf(conveyor.group);
          }
          if (beltFollow || beltPos) audio.startLoop('belt_run', beltFollow ? { follow: beltFollow } : { position: beltPos });

          const hvacMesh = named(/^Prop_HVAC_Unit$/)[0];
          if (hvacMesh) audio.startLoop('hvac_air', { position: centreOf(hvacMesh) });

          // ── one hum PER SCREEN, not one for the array ──
          // ★ THIS IS THE WHOLE POINT OF THE PUSH-IN. At the ROOM pose the three tubes are a
          // single quiet buzz five metres away; at the SCREEN pose the camera is a metre from
          // them and they should be the loudest thing in the room. One emitter at the array's
          // centre cannot do that — it moves as one object and the two outer devices never
          // arrive. Three emitters at three measured positions do it for free, and starting each
          // at a random buffer offset keeps them from phase-locking into one loud source.
          const screenBox = new THREE.Box3();
          const screenPositions = [];
          if (tvUX) {
            for (const u of tvUX.units) {
              screenBox.expandByObject(u.root);
              screenPositions.push(centreOf(u.root));
            }
            screenPositions.forEach((p, i) => audio.startLoop('crt_hum', { position: p, key: `s${i}` }));
          }

          // ── the plant, through the wall ──
          // It is not ambience-in-general: it comes from OUTSIDE, through the far gable. Placed
          // beyond the room's own bounding box on the far side from the camera, so it arrives
          // from a direction and gets duller as you walk away from that wall like everything else.
          {
            const roomBox = new THREE.Box3().setFromObject(pickables);
            const c = roomBox.getCenter(new THREE.Vector3());
            audio.startLoop('factory_wall', {
              position: new THREE.Vector3(roomBox.max.x + 3, c.y + 1.5, c.z),
            });
          }
          audio.startLoop('room_hum');

          // ── the drip (AUD-002) ──
          // ★ IT LANDS ON THE FLOOR, NOT ON THE PIPE. A drip is heard where it hits, so each
          // point is a pipe overhead raycast DOWN onto whatever is actually under it — which is
          // also what stops a "drip point" ending up inside a crate after a re-dress.
          const dripRay = new THREE.Raycaster();
          const dripFrom = new THREE.Vector3(), DOWN = new THREE.Vector3(0, -1, 0);
          const solid = [];
          pickables.traverse((o) => { if (o.isMesh && o.material && o.material.depthWrite !== false) solid.push(o); });
          const dripPoints = [];
          for (const pipe of named(/pipe/i)) {
            const b = new THREE.Box3().setFromObject(pipe);
            if (b.min.y < 2.0) continue;                 // an overhead run, not a floor pipe
            const c = b.getCenter(new THREE.Vector3());
            dripFrom.set(c.x, b.min.y - 0.02, c.z);
            dripRay.set(dripFrom, DOWN);
            const hit = dripRay.intersectObjects(solid, false).find((h) => h.object !== pipe);
            if (!hit || hit.distance < 0.4) continue;    // nothing to fall onto, or it is resting on something
            if (dripPoints.some((p) => p.distanceTo(hit.point) < 1.2)) continue;   // one per puddle
            dripPoints.push(hit.point.clone().setY(hit.point.y + 0.04));
          }
          // ★ "UNDER A PIPE" IS NOT "IN THE ROOM", AND THE FIRST PASS FOUND 37 POINTS SPREAD OVER
          // 16 m — outside the walls, past the far end, wherever a run of pipe happens to go. The
          // room has already been measured once, by the cat: his grid is flood-filled from where
          // he stands, so an unblocked cell IS the room and everything else is outside it or
          // inside something. Reusing it costs nothing and cannot drift from the room the cat
          // walks. With no cat (?cat=0) the points stand as measured — the bed still works, it is
          // just less discriminating, and that is worth saying out loud rather than silently
          // shipping two different rooms.
          const grid = catWalk?.grid;
          const inRoom = (v) => {
            if (!grid) return true;
            const ix = Math.floor((v.x - grid.min.x) / grid.cell);
            const iz = Math.floor((v.z - grid.min.z) / grid.cell);
            if (ix < 0 || iz < 0 || ix >= grid.nx || iz >= grid.nz) return false;
            return !grid.blocked[iz * grid.nx + ix];
          };
          for (let i = dripPoints.length - 1; i >= 0; i--) if (!inRoom(dripPoints[i])) dripPoints.splice(i, 1);
          // A handful, evenly spread through what is left: the drip is a signature, and a
          // signature written in twenty different places stops being one.
          const DRIP_MAX = 7;
          if (dripPoints.length > DRIP_MAX) {
            const step = dripPoints.length / DRIP_MAX;
            const keep = [];
            for (let i = 0; i < DRIP_MAX; i++) keep.push(dripPoints[Math.floor(i * step)]);
            dripPoints.length = 0;
            dripPoints.push(...keep);
          }
          let dripScheduler = null;
          if (dripPoints.length) {
            // The same manifest the scheduler reads, rebased the same way, so the drip agrees with
            // the world even when ?events=0 has taken the scheduler out entirely. Read through the
            // loader rather than borrowed from the event block: the bed must not depend on the
            // engine, and the loader is memoised, so a manifest the shell hands over reaches both.
            const { manifest: raw } = await loadRunOfShow('../../assets/dripping-pickle');
            let man = rebaseToCurrentWindow(raw, Math.floor(Date.now() / 1000));
            dripScheduler = createDripScheduler({
              audio, points: dripPoints, runSeed: man.runSeed, epoch: man.epoch,
              windowSec: parseFloat(q.get('dripwindow') ?? '22'),
              // Across a run-of-show window edge, the same re-entry the scheduler makes (W9).
              runAt: (s) => {
                if (s >= man.validUntil) man = rebaseToCurrentWindow(raw, Math.floor(s));
                return man;
              },
            });
          }

          // ── the jar clinks (DP-W3 measured them; they were silent until now) ──
          onClinkSink = ({ strength, position }) => {
            // strength runs 0..1 over the jars that ring at all; it is BOTH level and brightness,
            // because a harder knock on glass is not just a louder version of a soft one.
            audio.fire('jar_clink', {
              position,
              gain: 0.45 + strength * 0.85,
              rate: 0.94 + strength * 0.16,
            });
          };

          // ── per frame ──
          // The listener IS the camera, and everything that moves re-places itself against it.
          // The drip is on the SHARED CLOCK in seconds, never on frame time.
          const catPos = new THREE.Vector3();
          let purrOn = false;
          audioTick = (dt) => {
            audio.update(dt, camera);
            if (dripScheduler) dripScheduler.tick(Date.now() / 1000);

            // the belt bed rides the conveyor's own ramp — pitch and level together, so a stall
            // is heard as the motor dying rather than as the sound being switched off
            if (conveyor) {
              const sc = conveyor.state.speedScale ?? 1;
              audio.setLoopRate('belt_run', 0.35 + sc * 0.65);
              audio.setLoopGain('belt_run', 0.25 + sc * 0.75);
            }
            audioWatch();

            // the purr belongs to a resting cat and to WHERE HE IS: he sleeps on the pillow, but
            // he rests in whatever spot an idle left him in, so the emitter follows rather than
            // being placed once.
            const resting = !!catCtl && !catRoaming && !catCtl.hunting && !!catObj;
            if (resting !== purrOn) {
              purrOn = resting;
              if (resting) {
                audio.startLoop('cat_purr', {
                  follow: () => catPos.setFromMatrixPosition(catObj.matrixWorld),
                  fade: 3,
                });
              } else audio.stopLoop('cat_purr', { fade: 1.2 });
            }
          };

          // Everything outside this block that needs a sound fires it through here, by SLOT ID
          // — never by reaching for a file. A caller that arrives before the audio is up gets
          // null and simply makes no sound, which is the correct failure for a paw strike.
          audioFire = (id, opts = {}) => audio.fire(id, opts);

          // ── the event sink ──
          // The id in an event file IS the slot id, which is why no event file changed for this
          // row. A cue naming a slot that does not exist warns ONCE and is dropped: the alternative
          // is a silent miss, and DP-W4's whole point is that a cue you cannot hear still logs.
          const warned = new Set();
          const sinkPos = (target, track = null) => {
            if (/^cat_/.test(target) && catObj) return new THREE.Vector3().setFromMatrixPosition(catObj.matrixWorld);
            if (/^mouse_/.test(target) && mouse) return mouse.position.clone();
            // The knock is heard at the jar that was tapped, and the smash at the spot the jar
            // came off — neither is where the belt is by the time the cue runs.
            if (/^jar_(knock|smash)$/.test(target) && lastJarTap && performance.now() - lastJarTap.at < 1500) return lastJarTap.point;
            if (/^radio|^dial/.test(target) && radioEmitter) return radioEmitter();
            if (/^belt|^jar/.test(target) && beltPos) return beltPos;
            // ★ A SCREEN CUE BELONGS TO ITS SCREEN. The event names which one (left/center/right)
            // and the array is 4.9 m wide, so taking the array's centre puts a takeover's relay
            // click two and a half metres from where the picture changed — audible, and exactly
            // the sort of near-miss that reads as "the audio is a layer on top" rather than as
            // the room. Falls back to the centre only when the cue names no screen.
            if (/^relay|^static/.test(target) && screenPositions.length) {
              const side = String(track?.params?.target ?? track?.params?.screen ?? '').toLowerCase();
              const i = side.startsWith('l') ? 0 : side.startsWith('r') ? screenPositions.length - 1 : -1;
              if (i >= 0) return screenPositions[i];
              return screenBox.isEmpty() ? null : screenBox.getCenter(new THREE.Vector3());
            }
            return null;
          };
          audioSink = (track, ctx) => {
            const id = track.target;
            const params = track.params ?? {};
            if (!audio.slots[id]) {
              if (!warned.has(id)) { warned.add(id); console.warn(`audio: no slot for cue "${id}" (event ${ctx.event})`); }
              return;
            }
            if (track.action === 'stop') { audio.stopLoop(id, {}); return; }
            if (track.action === 'volume') { audio.setLoopGain(id, Number(params.gain ?? 1)); return; }
            // ★ A PARAM MAY ARRIVE AS AN UNSUBSTITUTED STRING — the same trap NPC-004 paid for
            // with `{chase}`. Coerce and fall back rather than passing NaN into an AudioParam,
            // which throws and takes the whole cue with it.
            const g = Number(params.gain);
            const opts = { gain: Number.isFinite(g) ? g : 1, position: sinkPos(id, track) };
            // A cue that arrives late (a resumed device replaying) still plays if it is a bed,
            // but a one-shot fired ten seconds after its beat is worse than silence.
            if (audio.slots[id].kind === 'loop') audio.startLoop(id, opts);
            else if (!(ctx.late > 2)) audio.fire(id, opts);
          };

          // ── the level watchdog (#114) ─────────────────────────────────────
          // ★ A LEVEL DROP NOBODY CAN ATTRIBUTE IS A BUG REPORT WITH NO SECOND HALF. Josh heard
          // the room get quieter twice on the phone, once at ~90 s and once at ~12 s, with the
          // app never backgrounded and the shell's own gain logged exactly once at 1.00. The
          // suspects — a stall that never released, the master fade, iOS lowering the output —
          // are separable by evidence and not by argument, and none of them can be observed
          // from here: a Loop's console.log reaches nothing on a device, and the drop is not
          // reproducible on this Mac.
          //
          // So the Loop says so itself, through the bridge. Every couple of seconds it sums
          // what the emitters are actually being asked for and reports a material change once,
          // with the state that would explain it. The next leg reads a line instead of guessing.
          //
          // ⚠ This is a DIAGNOSTIC, not a fix. The most likely answer is already measured and
          // is not a defect at all: `conveyor_stall` takes the belt bed — the loudest continuous
          // source in the room — to gain 0.40 for about fifteen seconds and a full twenty-five
          // to climb back, which is exactly "quieter but still audible, then it came back".
          // ⚠ Sum the APPLIED gain, not `receivedDb`. The latter is only the distance model's
          // answer and carries neither the per-loop gain an event sets nor the belt's own ramp —
          // which is precisely the quantity that moves. The first cut summed it and reported
          // nothing through a stall that took the belt bed from 1.00 to 0.40.
          const WATCH_MS = 2000, WATCH_DB = 2.5;
          let watchAt = 0, watchDb = null, watchRows = null;
          function audioWatch() {
            const now = performance.now();
            if (now - watchAt < WATCH_MS) return;
            watchAt = now;
            const rows = new Map();
            let sum = 0;
            for (const e of audio.field()) { rows.set(e.key, e.gain ?? 0); sum += e.gain ?? 0; }
            const db = 20 * Math.log10(Math.max(sum, 1e-6));
            const was = watchDb, wasRows = watchRows;
            if (was !== null && Math.abs(db - was) < WATCH_DB) return;
            watchDb = db; watchRows = rows;
            if (was === null) return;               // the first reading is a baseline, not news
            // Name the emitter that moved most — that is the whole point of the line.
            let who = '?', moved = 0;
            for (const [k, g] of rows) {
              const d = Math.abs(g - (wasRows?.get(k) ?? 0));
              if (d > moved) { moved = d; who = k; }
            }
            const sc = conveyor ? (conveyor.state.speedScale ?? 1) : 1;
            window.collectivus?.log?.(
              `audio: level ${was.toFixed(1)} -> ${db.toFixed(1)} dB, mostly ${who}` +
              ` · belt ${sc.toFixed(2)} (${conveyor ? conveyor.state.mode : 'n/a'})` +
              ` · ctx ${audio.contextState} · paused ${audio.paused}` +
              ` · muted ${audio.muted} · gain ${audio.shellGain}`);
          }

          // ★ PAUSED LOOP = SILENT LOOP (PLAN §3). The bridge makes these calls in the app;
          // the page's own visibility is the stand-in OUTSIDE it, and a second caller is
          // harmless — pause() is idempotent and resume() re-arms its own retry.
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) audio.pause(); else audio.resume({ afterHide: true });
          });

          window.__audio = {
            engine: audio,
            get unlocked() { return audio.unlocked; },
            get paused() { return audio.paused; },
            get built() { return audio.built; },
            slots: audio.slots,
            log: audio.log,
            drip: dripScheduler,
            dripPoints,
            fire: (id, o) => audio.fire(id, { position: sinkPos(id), ...(o ?? {}) }),
            report: () => audio.report(),
            // what every live emitter is doing FROM WHERE THE CAMERA IS — distance, applied
            // level, cutoff, send. This is the readout that says whether the space is working.
            field: () => audio.field(),
            received: (id, m) => audio.received(id, m),
            solo: (id) => audio.solo(id),
            unsolo: () => audio.unsolo(),
            measure: (sec) => audio.measure(sec),
            setVolume: (v) => audio.setVolume(v),
            setBus: (b, v) => audio.setBus(b, v),
            pause: () => audio.pause(),
            resume: () => audio.resume(),
            // ★ READ THESE, NEVER THE LOG (#101). `paused` is what the context actually did,
            // `contextState` is WebKit's own word for it ('running' / 'suspended' /
            // 'interrupted'), and `resumeRetries` is how many times the resume has been
            // refused since the last one that worked — a non-zero value with paused true is
            // the Loop waiting for iOS to let go, not the Loop having given up.
            setMuted: (m, g) => audio.setMuted(m, g),
            get muted() { return audio.muted; },
            get shellGain() { return audio.shellGain; },
            get resumeRetries() { return audio.resumeRetries; },
            get contextState() { return audio.contextState; },
          };
          console.log(`audio: ${audio.built} slots built, ${dripPoints.length} drip point(s)` +
                      (audio.unlocked ? '' : ' — waiting for a gesture to unlock'));
        } catch (e) { console.warn('audio not started:', e); audio = null; }
      }

      // ── the event engine (DP-W4, EVT-001…005) ────────────────────────────
      // WHEN: tools/events/runofshow.js on the shared clock (loops-docs 10-platform/50 + 55).
      // WHAT: assets/dripping-pickle/events/*.json — pure data, docs/EVENTS.md.
      // HOW:  tools/events/runner.js walks the timeline; scene-executors.js touches the room.
      // ?events=0 disables scheduling; ?event=<id> fires one at load (screenshots, art review).
      if (q.get('events') !== '0') {
        try {
          const lib = await loadLibrary('../../assets/dripping-pickle');
          for (const e of lib.errors) console.warn('events:', e);
          const nowSec = () => Math.floor(Date.now() / 1000);
          const sched = new RunOfShow({ manifest: lib.manifest, defs: lib.defs, nowSecond: nowSec() });

          // The screens, by side. A unit is a telly's parent group; its screen materials are the
          // ones in screenMats (static or video, both carry __scr).
          // (props.scene is scoped to its own load block; it lives inside `pickables`.)
          const units = new Map();
          pickables.traverse((o) => {
            if (!o.isMesh) return;
            const mats = (Array.isArray(o.material) ? o.material : [o.material]).filter((m) => m && screenMats.has(m));
            if (!mats.length) return;
            let root = o;
            for (let a = o; a && a !== pickables; a = a.parent) if (/Screen_(Left|Centre|Center|Right)/i.test(a.name)) root = a;
            const side = /Left/i.test(root.name) ? 'left' : /Centre|Center/i.test(root.name) ? 'center' : /Right/i.test(root.name) ? 'right' : null;
            if (!side) return;
            if (!units.has(root)) units.set(root, { side, mats: [] });
            for (const m of mats) if (!units.get(root).mats.includes(m)) units.get(root).mats.push(m);
          });

          // DP-W5: WHAT the screens show. A capability on the existing `screens` channel —
          // no scheduler change, no second executor. The page is drawn only when a line or a
          // plate changes (Gate A §7.2: never per frame), and everything that moves is
          // procedural GLSL. Since TV1 the page is a GL surface (tools/gl-page.js), rendered once
          // per change into a target the shader reads top-down, with no mips — the page canvas
          // had none either. The page and the glyph atlas also go into each material's __scr
          // bag, so the budget rig counts what the screens hold (it never saw the canvases).
          const unitList = [...units.values()];
          const content = createScreenContent({
            units: unitList,
            baseMode: SCREENSAVER ? MODE.SCREENSAVER : MODE.PASSTHROUGH,
            makeSurface: () => glPainter.createSurface(PAGE.w, PAGE.h),
          });
          for (const u of unitList) for (const m of u.mats) if (m.__scr) m.__scr.uScrGlyphs = glyphAtlas;

          const exec = createSceneExecutors({
            screens: { units: unitList, scrTime, content },
            equipment: { targets: equipmentTargets, conveyor },
            // A character is a controller with methods named by action — the executor
            // knows nothing about cats and has learned nothing about mice. Registering
            // one and authoring events against it is the whole of adding a character.
            npc: { cat: catCtl, mouse: mouseCtl },
          });
          const runner = createRunner({
            defs: lib.defs, executors: exec.executors,
            drawsForLocal: (id, s) => sched.drawsFor(id, s),
            log: (l) => { events.log.push(l); if (events.log.length > 400) events.log.shift(); },
          });

          // ── the jar (INT-005) ───────────────────────────────────────────────────
          // Tap a jar -> the `jar_knock` user event, LOCAL: it fires on the viewer who tapped
          // and never touches the shared schedule. DP-W3 built the mechanism and DP-W4 made it
          // an event; this row only re-points it at the hotspot arbiter and adds the knock-off
          // Gate A §8.4 signed. It is deliberately NOT a second implementation — the whole
          // point of the vocabulary is that a new interaction is a new caller, not a new engine.
          if (conveyor && hotspots) {
            hotspots.register({
              id: 'jar',
              objects: () => conveyor.jarMeshes,
              // A jar is only aimable while the belt is drawing jars — during a stall it still
              // is (a stalled belt is full of jars), but with the belt hidden it is not.
              live: () => conveyor.group.visible && conveyor.state.jars > 0,
              // ★ A ROW OF JARS IS NOT ONE TARGET. The default extent is the bounding sphere of
              // what you can raycast, which for the belt is five metres of jars — declared to
              // the shell that way it would swallow the cursor for a third of the screen and
              // aim assist would stop meaning anything. (It also comes back EMPTY: Box3
              // .expandByObject contributes nothing for an InstancedMesh whose bounds have not
              // been computed, so the spot silently vanished from aim() until this was written.)
              // The declaration is the ONE jar nearest the middle of the frame, at its own size.
              extent: () => {
                const m = new THREE.Matrix4(), p = new THREE.Vector3(), ndc = new THREE.Vector3();
                let best = null, bestD = Infinity;
                const im = conveyor.jarMeshes[0];
                for (let i = 0; i < im.count; i++) {
                  im.getMatrixAt(i, m);
                  p.setFromMatrixPosition(m).applyMatrix4(conveyor.group.matrixWorld);
                  ndc.copy(p).project(camera);
                  if (ndc.z > 1) continue;
                  const d = Math.hypot(ndc.x, ndc.y);
                  if (d < bestD) { bestD = d; best = p.clone(); }
                }
                return best ? { centre: best, radius: conveyor.params.jar.radius * 1.6 } : null;
              },
              // #103: a jar had no aim feedback at all. The marker rides the SAME extent the
              // jar declares to the shell — the one jar nearest the middle of the frame — so
              // what lights up is what the assist would pull to.
              press: (hit) => {
                if (!hit || hit.instanceId === undefined) return false;
                const jar = conveyor.jarAtInstance(hit.instanceId);
                if (jar < 0) return false;
                // DP-W7: the knock is heard AT THE JAR. The event carries the jar's index, not
                // its position — the belt has moved by the time the cue runs — so the raycast's
                // own hit point is recorded here and read by the audio sink within its window.
                lastJarTap = { at: performance.now(), point: hit.point.clone() };
                return runner.trigger('jar', { input: { jar } });
              },
            });
          }

          // Gate A §8.4's clean-up beat, fired by the belt itself the moment a jar goes over.
          if (conveyor) {
            onKnockOffSink = (e) => {
              lastJarTap = { at: performance.now(), point: e.position.clone() };
              runner.trigger('jar_offbelt');
            };
          }

          // ── the radio (INT-002) ─────────────────────────────────────────────────
          // ★ THE INTERACTION IS DATA, NOT A HANDLER. Both halves of the toggle are event files
          // (`radio_on` / `radio_off`) on the same channels everything else uses, so what the
          // radio does when you press it — the switch click, the dial warming, the station a
          // beat later — is authored and re-timeable without touching this file. All the scene
          // owns is WHICH of the two to fire, because an event cannot branch on state.
          //
          // ★ THE DIAL IS SHIPPED GEOMETRY NOW, AND THE RUNTIME QUAD IS THE FALLBACK (ART1,
          // 2026-09-11). Until #9 landed, `Prop_Radio_Transistor` was a unit cube scaled
          // 0.095 × 0.24 × 0.15 with one material, so lighting that material lit the whole box
          // like a lamp and the only honest option was to BUILD an emissive quad and fit it to
          // the placeholder. `tools/blender-build-radio.py` now ships
          // `Prop_Radio_Transistor_Dial` carrying `Radio_Dial_Glow`, which is the material the
          // equipment channel already names. The built quad is kept, unchanged, for the one
          // case that must not go dark: a props.glb that predates ART1.
          if (hotspots) {
            const radio = pickables.getObjectByName('Prop_Radio_Transistor');
            if (radio) {
              // The seven parts are SIBLINGS in the glb, not children, so `traverse` from the
              // body finds one mesh and the hotspot would cover the case and nothing else —
              // pressing the grille or a knob would miss. Collect by name.
              const radioMeshes = [];
              pickables.traverse((o) => {
                if (o.isMesh && /^Prop_Radio_Transistor/.test(o.name)) radioMeshes.push(o);
              });

              const namedMat = (o) => {
                const m = Array.isArray(o.material) ? o.material : [o.material];
                return m.find((x) => x && x.name === 'Radio_Dial_Glow') || null;
              };
              let dialMat = null;
              for (const m of radioMeshes) { dialMat = namedMat(m); if (dialMat) break; }

              if (!dialMat) {
                // ── fallback: the pre-ART1 placeholder path, verbatim ──────────────
                // ★ THERE IS NO DIAL TO LIGHT. Measured in the running scene: the shipped
                // `Prop_Radio_Transistor` is ONE mesh with ONE material — a unit cube scaled
                // 0.095 × 0.15 × 0.24 — even though asset-provenance lists seven parts, because
                // the export merged them. Putting the glow on that material lights the whole box
                // like a lamp, which is not "the dial comes on", it is "the radio is a light".
                // So the dial is BUILT: one small emissive quad on the face that looks at the
                // loop camera, original geometry, one draw call while it is on screen.
                console.warn('INT-002: no Radio_Dial_Glow material in props.glb — ' +
                             'falling back to the built quad (a props.glb older than ART1)');
                const rb = new THREE.Box3().setFromObject(radio);
                const rc = rb.getCenter(new THREE.Vector3()), rs = rb.getSize(new THREE.Vector3());
                dialMat = new THREE.MeshStandardMaterial({
                  color: 0x120a04, emissive: new THREE.Color(0xffb35c), emissiveIntensity: 0,
                  roughness: 0.4, metalness: 0,
                });
                dialMat.name = 'Radio_Dial_Glow';
                const dial = new THREE.Mesh(
                  new THREE.PlaneGeometry(Math.min(rs.z, rs.x) * 0.55, rs.y * 0.34), dialMat);
                dial.name = 'Prop_Radio_Dial_Glow';
                // The face the camera can see, and a hair proud of it so it does not z-fight.
                const toCam = new THREE.Vector3().subVectors(camera.position, rc).setY(0).normalize();
                dial.position.copy(rc)
                  .addScaledVector(toCam, Math.max(rs.x, rs.z) * 0.5 + 0.002)
                  .setY(rc.y + rs.y * 0.16);
                dial.lookAt(camera.position.x, dial.position.y, camera.position.z);
                dial.castShadow = false; dial.receiveShadow = false;
                dial.userData.noMove = true;    // its transform is fitted to the prop, not a suggestion
                pickables.add(dial);
                radioMeshes.push(dial);
              }

              // ★ THE ASSET SHIPS THE GLOW ON, AND THE SCENE OWNS WHETHER IT IS LIT. Blender
              // exports the amber at emission strength 1, because a material authored dark is a
              // material an artist cannot see. A radio nobody has pressed must be dark, so the
              // intensity is zeroed HERE, at load, before the first frame — not in the .blend,
              // where the next re-export would quietly undo it.
              dialMat.emissiveIntensity = 0;

              // The equipment channel drives ANY object with the named property, and a
              // Material is such an object — so the dial's glow is a pendant-style tween
              // rather than a second mechanism. equipmentTargets is what an event names.
              equipmentTargets.set('radio_dial', dialMat);
              let radioOn = false;
              const radioGlow = (on) => {
                if (!dialMat) return;
                // Aim feedback is a HINT, never the state: it lifts the dial a little and puts
                // it back exactly where the event left it, so hovering an on radio cannot turn
                // it off and hovering an off one cannot look like it is on.
                dialMat.emissiveIntensity = (radioOn ? 2.4 : 0) + (on ? 0.35 : 0);
              };
              hotspots.register({
                id: 'radio',
                objects: () => radioMeshes,
                hover: (on) => radioGlow(on),
                press: () => {
                  const ok = runner.trigger(radioOn ? 'radio_off' : 'radio_on');
                  // ★ THE STATE FOLLOWS THE EVENT, NOT THE PRESS. Flipping the flag first and
                  // firing second leaves the flag lying about the radio whenever the fire is
                  // refused — and the next press would then try to switch off a set that never
                  // came on.
                  if (ok) radioOn = !radioOn;
                  return ok;
                },
              });
              // The emitter is the CASE's centre, not the object's origin: the built radio's
              // origin is on its base plane, so `getWorldPosition` would put the speaker on the
              // CRT's deck rather than inside the radio.
              radioEmitter = () => new THREE.Box3().setFromObject(radio)
                .getCenter(new THREE.Vector3());
            } else {
              console.warn('INT-002: Prop_Radio_Transistor not found — no radio hotspot');
            }
          }

          // ── the HAM receiver's broadcast glow (ENV-005) ─────────────────────────
          // Not an interaction: canon §4 gives the HAM a warm amber glow WHEN BROADCASTING, so
          // it is an equipment target the mission takeovers drive and nothing a viewer presses.
          // #10 recorded the gap this closes — "that track is one line of JSON whenever the prop
          // lands" — and the vocabulary gains `equipment/ham_glow`.
          {
            let hamMat = null;
            pickables.traverse((o) => {
              if (hamMat || !o.isMesh) return;
              const mats = Array.isArray(o.material) ? o.material : [o.material];
              hamMat = mats.find((m) => m && m.name === 'HAM_Glow') || null;
            });
            if (hamMat) {
              hamMat.emissiveIntensity = 0;     // dark until an event says otherwise
              equipmentTargets.set('ham_glow', hamMat);
            } else {
              console.warn('ENV-005: no HAM_Glow material in props.glb — ' +
                           'the takeovers\' equipment track will find no target');
            }
          }

          // ── the CRT dial (INT-003) ──────────────────────────────────────────────
          // ★ THERE IS NO DIAL MESH, SO THE HOTSPOT IS A REGION AND NOT AN OBJECT. The CRT is a
          // bought prop with a single body; its controls are painted on. So the region has to be
          // measured off the cabinet, and #104 is what happens when it is measured off the wrong
          // thing: the first cut took "everything below the glass", which is the SHELF under the
          // tube — and the knobs on this set are beside the tube, near its top. Measured in the
          // running scene by raycasting the rendered picture, the two knobs are at world
          // (1.4305, 1.580, −0.8955) and (1.4305, 1.3446, −0.8953), while the old declared target
          // sat at (1.400, 0.9775, −1.5027): 80 px below and 81 px left of them at 720p. A press
          // on the knobs resolved to `screen_array` and pushed the camera in. Josh, Gate B:
          // "dial hitbox in wrong location — maps to bottom of TV when 'dials' are on the right top."
          //
          // ★ AND THE FIX IS A DERIVATION, NOT THE MEASURED NUMBERS. Typing those three knob
          // coordinates would be the same defect one re-export later. The control panel is
          // derivable from the cabinet's own vertices: it is the FLANK of the cabinet that lies
          // outside the glass along the wall, and of the two flanks it is the wider one — on this
          // set 8,043 vertices spanning 0.377 m against 1,397 spanning 0.274 m. Within that
          // column the knobs sit ABOVE the speaker grille, so the dial band is the part of the
          // column above the glass's own vertical midpoint. Checked against the measurement: the
          // derived centre projects to (522, 353) at 720p, 7 px from the upper knob.
          //
          // Registered BEFORE the array so that a press on the panel is a dial press and not a
          // push-in: the arbiter takes the nearest hit, and these do not overlap.
          if (hotspots && tvUX) {
            // ★ `tvUX.units` CARRY NO `side` — that field belongs to the screens executor's own
            // unit list, built elsewhere, and reading it here returns undefined for all three
            // (so `find` fell through to units[0], which is the CENTRE LCD). Match the node
            // name, which is what DP-W2 actually named these.
            const left = tvUX.units.find((u) => u.root.name === 'Prop_Screen_Left_CRT')
                      ?? tvUX.units[0];
            if (left) {
              const box = new THREE.Box3().setFromObject(left.screen);
              const body = left.meshes.filter((m) => m !== left.screen);
              let saverOff = false;
              // The cabinet's vertices, in world space, split into the two flanks either side of
              // the glass along the wall. The wall runs in z here, but read the axis from the
              // glass rather than assuming it: the wide axis of the glass IS the wall direction.
              const gs = box.getSize(new THREE.Vector3());
              const axis = gs.z > gs.x ? 'z' : 'x';          // along the wall
              const lo = new THREE.Box3(), hi = new THREE.Box3();
              let nLo = 0, nHi = 0;
              const _p = new THREE.Vector3();
              for (const m of body) {
                const pa = m.geometry?.attributes?.position;
                if (!pa) continue;
                m.updateWorldMatrix(true, false);
                for (let i = 0; i < pa.count; i++) {
                  _p.fromBufferAttribute(pa, i).applyMatrix4(m.matrixWorld);
                  if (_p[axis] < box.min[axis]) { lo.expandByPoint(_p); nLo++; }
                  else if (_p[axis] > box.max[axis]) { hi.expandByPoint(_p); nHi++; }
                }
              }
              // The controls live on the wider flank. A set with no flank at all (a bezel-less
              // panel) leaves both empty, and the spot is simply not registered rather than
              // claiming an arbitrary slab of cabinet.
              const col = nHi >= nLo ? hi : lo;
              const colN = Math.max(nLo, nHi);
              if (colN > 0 && !col.isEmpty()) {
                // the band above the glass's midline: knobs over grille, which is where a set
                // this age puts them.
                const glassMidY = (box.min.y + box.max.y) / 2;
                const dialBox = col.clone();
                dialBox.min.y = Math.max(dialBox.min.y, glassMidY);
                // The aim target sits on the face the viewer is looking at, not inside the box —
                // pick the axis along which the camera is furthest from the band and use that
                // face's centre, so a re-framed shot cannot park the target inside the cabinet.
                const dialCentre = () => {
                  const c = dialBox.getCenter(new THREE.Vector3());
                  const eye = camera.position;
                  const dx = eye.x - c.x, dz = eye.z - c.z;
                  if (Math.abs(dx) >= Math.abs(dz)) c.x = dx < 0 ? dialBox.min.x : dialBox.max.x;
                  else c.z = dz < 0 ? dialBox.min.z : dialBox.max.z;
                  return c;
                };
                const ds = dialBox.getSize(new THREE.Vector3());
                const dialR = Math.max(0.06, Math.min(ds.x, ds.y, ds.z) * 0.6);
                const inDial = (hit) => body.includes(hit.object) && dialBox.containsPoint(hit.point);
                screenArrayExclude = inDial;
                hotspots.register({
                  id: 'crt_dial',
                  objects: () => body,
                  // The cabinet is shared geometry: the same mesh is "a telly to push in on" and
                  // "the controls beside the tube". `accept` is what separates them — a hit
                  // inside the measured dial band is the dial, everything else is the array — and
                  // it is the arbiter's only tie-break that is not distance, because here the
                  // distance is identical.
                  accept: inDial,
                  extent: () => ({ centre: dialCentre(), radius: dialR }),
                  // #103. There is no dial mesh to light, and lifting the cabinet's own
                  // material would light the whole set like a lamp — the same trap the radio
                  // hit. The marker sits on the measured dial band instead.
                  press: () => {
                    const want = saverOff ? 'screensaver' : 'passthrough';
                    const ok = runner.trigger('screens_dial', { input: { mode: want } });
                    if (ok) saverOff = !saverOff;
                    return ok;
                  },
                });
                window.__dialBox = dialBox;   // for the scripted check
              } else {
                console.warn('INT-003: no control flank measured on', left.root.name, '— no dial hotspot');
              }
            }
          }

          // ── the mouse (INT-004) ─────────────────────────────────────────────────
          // ★ HE IS ONLY AIMABLE WHILE HE IS OUT IN THE ROOM, and that is the live query earning
          // its keep rather than a guard. On the belt or inside the wall there is no coherent
          // response to a tap — freezing on a moving jar leaves him hanging in the air as the
          // belt carries it away — so rather than a command that refuses, the hotspot is simply
          // not there and the press gets the "nothing here" beat like any other empty press.
          if (hotspots && mouse) {
            const mouseMeshes = [];
            mouse.model.traverse((o) => { if (o.isMesh) mouseMeshes.push(o); });
            hotspots.register({
              id: 'mouse',
              // The MESHES, not the group: the arbiter's raycast is non-recursive on purpose
              // (a recursive one would re-walk the whole prop tree per spot per frame).
              objects: () => mouseMeshes,
              live: () => mouse.onFloor && !mouse.frozen,
              // #103. Not an emissive lift: he is a live animal and a glowing mouse is a
              // different Loop. The marker rings him where he stands.
              // Returns the runner's own answer, so a refused trigger (the event is
              // exclusive-blocked, or he reached the wall between the aim and the press) shows
              // the viewer the same beat an empty press does instead of nothing at all.
              press: () => runner.trigger('mouse'),
            });
          }

          // ── the evade reflex (NPC-004) ──────────────────────────────────────────
          // ★ PROXIMITY IS LOCAL BY NATURE, SO IT IS A LOCAL TRIGGER — the same
          // shape as the jar tap, and for the same reason. The cat's path is local
          // (see the hunt), so the second at which he closes on the mouse differs
          // per client; routing that through the shared scheduler would make two
          // viewers disagree about the schedule itself. Instead it fires the
          // `mouse_bolt` user event on THIS client, and that event's content is
          // still drawn from the shared seed at the trigger second — local
          // response, non-local content, exactly as DP-W4 has it.
          //
          // The distance is fitted, not guessed: the cat travels at 0.45 m/s and
          // the mouse bolts at ~1.0, so 1.0 m is about a second of warning — long
          // enough that the bolt reads as escaping rather than as teleporting, and
          // short enough that the cat is visibly the cause.
          const EVADE_M = parseFloat(q.get('evade') ?? '1.0');
          let evadeArmedAt = 0;
          npcReflex = () => {
            if (!mouse || !mouse.onFloor || !catCtl || !catCtl.roaming) return;
            // ★ A HELD MOUSE DOES NOT BOLT, AND WITHOUT THIS LINE THE TAP CANCELS ITSELF.
            // The reflex fires at a metre; the pounce commits at half that. So a viewer who
            // taps the mouse (INT-004) watched the cat get most of the way there and the
            // mouse run anyway — the interaction firing its own counter-measure, measured.
            // Freezing him IS the interaction: the whole point is that this once, the cat
            // arrives. The escape still happens, from the release, which is canon's order.
            if (mouse.frozen) return;
            const now = performance.now();
            if (now < evadeArmedAt) return;
            const c = catCtl.position;
            if (!c) return;
            const m = mouse.position;
            if (Math.hypot(c.x - m.x, c.z - m.z) > EVADE_M) return;
            evadeArmedAt = now + 8000;      // one bolt per approach, not per frame
            runner.trigger('cat_near');
          };

          let lastSec = 0;
          events = {
            sched, runner, exec, content, defs: lib.defs, get manifest() { return sched.manifest; }, log: [],
            audio: exec.executors.audio.log,
            setAudioSink: (fn) => exec.executors.audio.setSink(fn),
            /** once per frame: advance the shared clock by whole seconds, run the timelines */
            tick() {
              const s = nowSec();
              if (s !== lastSec) {
                lastSec = s;
                // advanceTo replays every missed second (a hidden tab, a paused app) for STATE
                // and emits only what is in flight or fresh — never reset, never a burst
                for (const f of sched.advanceTo(s)) runner.start(f);
              }
              runner.tick();
              exec.tick();
            },
            /** the bridge's resume hook — the same thing tick does, immediately */
            resume() { for (const f of sched.advanceTo(nowSec())) runner.start(f); },
            /** every vocabulary entry the executors cannot do — [] is the pass */
            verifyVocabulary: async () => exec.verifyVocabulary(await fetch('../../tools/events/vocabulary.json').then((r) => r.json())),
            fire: (id, draws) => runner.fireNow(id, draws ?? sched.drawsFor(id, nowSec())),
            trigger: (target, input) => runner.trigger(target, { input }),
          };
          // DP-W7: the audio channel stops being a recorder. Registered here rather than inside
          // the audio block because the runner is built here; the sink itself was ready first.
          if (audioSink) exec.executors.audio.setSink(audioSink);
          window.__events = events;
          // catch up to now BEFORE the first frame, so an event in flight is already playing
          events.resume();
          const one = q.get('event');
          if (one) events.fire(one);
          const evLine = `events: ${lib.defs.length} loaded, ${sched.order.length} ambient scheduled, window ${sched.manifest.rebasedWindowIndex ?? 0}` +
                         ` · run of show ${lib.manifestSource}` +
                         (lib.errors.length ? ` — ${lib.errors.length} problem(s), see warnings` : '');
          console.log(evLine);
          // A Loop's console.log never reaches a device console; this line is how a device leg
          // tells a seed-driven run from one the shell handed over.
          window.collectivus?.log?.('dripping-pickle: ' + evLine);
        } catch (e) { console.warn('event engine not started:', e); }
      }

      // ── the measured shadow-caster list ─────────────────────────────────────
      // ★ A SHADOW-CASTING LIGHT DRAWS EVERY CASTER INTO ITS MAP, EVERY FRAME, AND MOST OF
      //   THEM PAINT NOTHING. Two lights over 120 static caster units was 240 draws; of
      //   those, 89 units moved ZERO pixels when their shadow was switched off — measured
      //   at both declared poses, with the movers hidden and frozen in frame, and then
      //   confirmed by switching the whole drop set off AT ONCE (a shadow hidden behind
      //   another shadow reads zero on its own and only goes when both go: 0 pixels, max
      //   channel delta 1). The list is DATA, regenerated by ?shadowaudit=1 — see
      //   assets/dripping-pickle/shadow-casters.json for how and when to re-run it.
      // Applied BEFORE the merge, on the source meshes, so the proxy buckets inherit it:
      // castShadow is part of the merge key, and setting it afterwards would either be
      // ignored or split a bucket in two.
      // ⚠ It is keyed on node NAMES, which a re-export can change. A name that no longer
      // exists simply keeps casting — safe in the picture, visible in the draw count — so
      // the match rate is logged and a bad one warns rather than failing quietly.
      if (q.get('shadowlist') !== '0') {
        try {
          const list = await fetch('../../assets/dripping-pickle/shadow-casters.json').then((r) => r.json());
          const want = new Set(list.noCast);
          let hit = 0;
          pickables.traverse((o) => {
            if ((o.isMesh || o.isInstancedMesh) && want.has(o.name)) { o.castShadow = false; hit++; }
          });
          const rate = want.size ? hit / want.size : 1;
          const msg = `shadow-caster list: ${hit}/${want.size} names matched (${(100 * rate).toFixed(0)}%)`;
          if (rate < 0.9) console.warn(`${msg} — the scene has been re-exported since the list was measured; re-run ?shadowaudit=1`);
          else console.log(msg);
          state.noCast += hit;
        } catch (e) { console.warn('shadow-caster list not applied:', e); }
      }

      // ── transmission: two props were costing a second render of the room ────
      // ★ ONE MATERIAL WITH `transmission > 0` MAKES three RENDER THE WHOLE OPAQUE SCENE A
      //   SECOND TIME, EVERY FRAME. `WebGLRenderer` runs a transmission pass into its own
      //   full-resolution target (plus its mip chain) so a refractive surface can sample
      //   what is behind it — and it does that for the scene, not for the object. Measured
      //   here: exactly two meshes carried it, `Prop_Business_Letter_2` (an envelope) and
      //   `Prop_Vintage_Floor_Lamp_3` (the lamp glass), together 0.09% of the frame at the
      //   room pose — and they cost **127 of 623 draw calls**. Both were authored at
      //   `thickness = 0`, which is transmission with no refraction offset at all, so what
      //   the pass buys at this size is nothing you can see.
      //   The fix is to zero the transmission and keep whatever transparency the material
      //   already declared: the lamp glass stays alpha 0.18, the envelope goes back to
      //   being paper. Measured three ways at 5x on the letter — transmissive, alpha 0.45
      //   and opaque all read as a sheet of paper, and opaque is the closest to the
      //   original. ?transmission=1 restores it for an A/B.
      if (q.get('transmission') !== '1') {
        const zeroed = [];
        const seenMat = new Set();
        pickables.traverse((o) => {
          for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
            if (!m || seenMat.has(m.uuid) || !(m.transmission > 0)) continue;
            seenMat.add(m.uuid);
            m.transmission = 0;
            m.needsUpdate = true;
            zeroed.push(m.name || '(unnamed)');
          }
        });
        if (zeroed.length) console.log(`transmission zeroed on ${zeroed.length} material(s): ${zeroed.join(', ')} — each one costs a full second render of the scene`);
      }

      // ── render proxies: merge to draw, keep the originals to think with ──────
      // ★ THE MERGE IS AT LOAD, NOT IN THE GLB, BECAUSE IN THIS LOOP A MESH IS NOT ONLY A
      //   THING TO DRAW. It is the Blender name a reviewer clicks, the bounding box the
      //   cat's grid measures the room from, the raycast target the hotspot arbiter, the
      //   mouse's route probe and the drip's pipe search all hit, and the `Prop_*` node
      //   `budget-check` reads provenance from. `gltf-transform join` destroys all five.
      //   Here the source meshes stay in `pickables` with `visible = false`, and three's
      //   raycaster has no visibility test — so only the picture changes. See
      //   tools/render-merge.js for the whole argument.
      // Skipped under ?dev=1 / ?review=1: the feedback panel's whole point is dragging a
      // prop to show where it should go, and a dragged source mesh moves nothing once its
      // geometry has been baked into a proxy. Reviewers get the unmerged room; the app
      // entry — the one the budget is measured on and the one that ships — gets the merge.
      // ?merge=0 forces it off for an A/B.
      if (!DEV && q.get('merge') !== '0') {
        try {
          // The conveyor and the corner dressing build their own geometry and toggle their
          // own meshes' visibility (the odd-jar contents, the jar that falls off the belt),
          // so their subtrees own their draws and this must not bake them flat.
          const DYNAMIC = /^(Conveyor|CornerDressing)$/;
          const rp = buildRenderProxies({
            three: THREE, root: pickables, parent: scene,
            exclude: (o) => { for (let a = o; a && a !== pickables; a = a.parent) if (DYNAMIC.test(a.name)) return true; return false; },
          });
          state.merged = rp;
          // ★ THE PHONE CUT (BUD4, PROGRAM decision 16): draws no loop-camera ray reaches,
          //   hidden on the phone and nowhere else. After the proxies, because most of the
          //   names ARE proxies. The evidence for every name is in tools/phone-cuts.js, and
          //   `node tools/phone-cuts-check.mjs` re-proves it. ?phonecut=0|1 overrides for an A/B.
          const PHONE_CUT = q.has('phonecut') ? q.get('phonecut') === '1' : TIER_CLASS === 'phone';
          if (PHONE_CUT) {
            const pc = applyPhoneCuts(scene);
            state.phoneCut = pc;
            const line = `phone cut: ${pc.hidden.length} draws hidden` +
              (pc.missing.length ? ` · ⚠ NOT FOUND (the room changed — re-run tools/phone-cuts-check.mjs): ${pc.missing.join(', ')}` : '');
            console.warn(line);
            window.collectivus?.log?.(line);
          }
          console.log(`render proxies: ${rp.sources} meshes -> ${rp.proxies} draws ` +
                      `(saved ${rp.saved}, ${(rp.bytes / 1048576).toFixed(1)} MB of merged buffers)`);
          // The AO's props channel renders camera layer 1 to its own depth buffer every
          // frame. It overrides the material, so it does not care which material a
          // triangle came from — the whole static prop set collapses into one buffer.
          // Built after the render proxies, so it merges THEM rather than their sources.
          if (aoPass) {
            const dp = buildDepthProxies({ three: THREE, root: scene, parent: scene });
            console.log(`props-depth proxies: ${dp.sources} layer-1 meshes -> ${dp.proxies} draws ` +
                        `(${(dp.bytes / 1048576).toFixed(1)} MB, position only)`);
          }
        } catch (e) { console.warn('render proxies not built:', e); }
      }

      // The shadow-caster audit (BUD2). Gated so it never loads in the shipping entry;
      // it exists to REGENERATE the non-caster list below after a re-dress.
      if (q.get('shadowaudit') === '1') {
        import('../../tools/shadow-audit.js').then(({ createShadowAudit }) => {
          window.__shadowAudit = createShadowAudit({ three: THREE, renderer, scene, rt: window.__rt, camera });
          console.log('shadow audit ready — window.__shadowAudit.run()');
        });
      }

      if (q.get('budget') === '1') {
        Promise.all([
          import('../../tools/budget-rig.js'),
          fetch('../../budgets.json').then((r) => r.json()),
        ]).then(([{ createBudgetRig }, budgets]) => {
          const rig = createBudgetRig({ renderer, scene, budgets, three: THREE, query: q });
          // Auto-run once the page has actually painted for a while, and stash the verdict —
          // a harness (or a person) then reads window.__budget.result rather than having to
          // time a call between frames. window.__budget.run() re-measures on demand.
          rig.autorun();
          console.log('budget rig armed — window.__budget.result, or await window.__budget.run()');
        });
      }

      // ★ DYNAMIC AND GATED: under the app entry this module is never fetched at all.
      //   It used to load unconditionally — 1,295 lines plus TransformControls — because
      //   the telly travel rode on its flyTo(). That dependency is gone (tools/flyto.js),
      //   so the panel is now exactly what its own header always claimed it was: dev only.
      if (DEV) {
        import('../../tools/feedback.js').then(({ initFeedback }) => {
          // initFeedback applies ?cam=/?tgt=/?sel= itself — and does it AFTER capturing
          // home, so "reset view" returns to the framing rather than to whichever shot
          // someone deep-linked you. Restoring it out here would silently invert that.
          initFeedback({ scene, camera, renderer, controls,
                         pickRoot: pickables, loop: 'dripping-pickle',
                         renderFrame: () => renderFrame(),
                         flyer });
        });
      }
    }, (ev) => {
      if (ev.total) {
        hud.textContent = `loading ${(100 * ev.loaded / ev.total).toFixed(0)}%`;
        loadUI.set('loading the room…', 0.7 * ev.loaded / ev.total);
      }
    }, (e) => { hud.textContent = 'GLB FAILED: ' + e; loadUI.fail('the room failed to load'); });

    function writeHud(extra = '') {
      hud.textContent =
        `meshes ${state.meshes}  tris ${Math.round(state.tris).toLocaleString()}  non-casters ${state.noCast}\n` +
        `camera ${state.cam}  exposure ${renderer.toneMappingExposure}\n` +
        `apertures ${apertures.panes.length} (${apertures.roof.length} roof)  gi ${state.gi}\n` +
        (fly ? fly.hint : '') + extra;
    }

    // ── frame loop ──────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    const gateFwd = new THREE.Vector3(), gateSun = new THREE.Vector3();
    const sunProj = new THREE.Vector3();
    let last = 0;
    // Named, not inline: the Collectivus bridge stops it on pause and restarts it on resume.
    function frameLoop() {
      if (frameCapMs) {
        // ★ HOLD THE FRAME FOR WHOLE REFRESHES. 4 ms of slack, or a vsync that arrives a hair
        //   early (they jitter by ~1 ms) would be skipped and a 20 cap would read as 15.
        const now = performance.now();
        if (now - lastRenderedAt < frameCapMs - 4) return;
        lastRenderedAt = now;
      }
      const prof = walkProf;
      prof?.begin();
      const t = clock.getElapsedTime();
      const dt = Math.min(t - last, 0.1);
      last = t;
      if (fly) fly.update(dt);
      if (controls) controls.update();
      if (tvTick) tvTick(t);
      if (tvUX) tvUX.tick(dt);
      if (hotspots) hotspots.tick();
      prof?.mark('ui');
      if (!walkFreeze) {
        if (catTick) catTick();
        if (catWalk && catRoaming) catWalk.update(dt);
        if (catMixer) catMixer.update(dt);
        if (npcReflex) npcReflex();
        prof?.mark('cat');
        if (mouseDrive) mouseDrive();
        if (mouse) mouse.update(dt);
        if (mouseMixer) mouseMixer.update(dt);
        prof?.mark('mouse');
        if (conveyor) conveyor.tick(t);
        if (chalkboard) chalkboard.tick();
        prof?.mark('belt');
      }
      scrTime.value = performance.now() / 1000;
      if (!walkFreeze) {
        if (events) events.tick();
        prof?.mark('events');
        if (audioTick) audioTick(dt);
        prof?.mark('audio');
      }
      tvVidExposure.value = renderer.toneMappingExposure;   // Brightness dial follows
      adaptAA(t, dt);
      if (perfTier) perfTier.tick(dt);
      lens.update(t);
      // Flare only when the camera faces the SUN — a threshold cannot tell the
      // sun from a bright TV (the screens are far brighter than the glazing),
      // so the gate is directional. Fades in over ~17° as the view tilts up
      // toward the skylights; the default level view sits fully gated off.
      camera.getWorldDirection(gateFwd);
      gateSun.copy(sunDirection(sunAz, sunEl)).negate();
      lens.setSunGate(THREE.MathUtils.smoothstep(gateFwd.dot(gateSun), 0.45, 0.75));
      // The flare is ANCHORED at the sun's screen position — every ghost is
      // drawn along the sun→centre axis, nothing is harvested from bright
      // pixels (that harvest is how the TVs ghosted). Project a point far
      // along the sun ray; behind the camera the projection mirrors, so park
      // it far off-frame instead (the shader fades to zero out there).
      if (gateFwd.dot(gateSun) > 0.05) {
        sunProj.copy(camera.position).addScaledVector(gateSun, 1000).project(camera);
        lens.setSunScreen((sunProj.x + 1) / 2, (sunProj.y + 1) / 2);
      } else {
        lens.setSunScreen(0.5, 3.0);
      }
      // focus rides the orbit target — the thing you are looking at is in focus
      if (bokehPass.enabled && controls) {
        bokehPass.uniforms.focus.value =
          camera.position.distanceTo(controls.target);
      }

      // Drift wraps the RENDER only — applied after the controls have settled the
      // real pose, undone before they next read it. The prepasses sit inside
      // the wrapper so the shafts march from the same drifted eye as the frame.
      drift.apply(t);
      prof?.mark('misc');
      // ⚠ The render is the one call that can throw from a lost context (#88), and drift MUST
      // be restored either way — leaving the offset applied hands it to OrbitControls, which
      // re-derives its state from camera.position and turns a closed sway into a slow walk
      // away from the framing.
      if (!walkNoRender) { try { renderFrame(t); } catch (err) { reportFrameError(err); } }
      prof?.mark('render');
      // AFTER the render and BEFORE drift.restore(): the walk's picture probe reads the default
      // framebuffer, which is only readable inside the turn that painted it.
      if (perfWalk) perfWalk.tick();
      drift.restore();
      lastFrameT = t;
    }
    renderer.setAnimationLoop(frameLoop);

    // ── Collectivus app bridge ─────────────────────────────────────────────
    // null outside the app. Pause is not silence: the telly video stops with the loop.
    // ★ PAUSE IS NOT SILENCE (PLAN §3, loops-docs 30-audio §): a paused Loop whose
