            // 8 fps BUD2 measured on the phone, dt clamps 0.125 -> 0.100 and a 1.25 s clip
            // takes 1.56 s of wall clock, so a two-clip route overruns 2 s and the net fires
            // on a cat who is getting up perfectly normally. Measured here through the Browser
            // pane, where frames are scarcer still: a 1.25 s transition advanced 0.585 s in
            // FIVE seconds of wall clock, and the net fired every time while every route
            // completed. That is the same defect family as the return affordance's fade and
            // the conveyor stall's duration, arriving from the other side — those were frame
            // time pretending to be wall clock, this is wall clock judging frame time.
            //
            // The budget is now the route's own length in ANIMATION seconds, read off the
            // clips, counted against the mixer's own clock, plus a margin. It still WARNS,
            // because a silent recovery would hide a real stall for the next row.
            const IDLE_EXIT_MARGIN_S = 1.5;
            const exitIdle = (then) => {
              if (idleExiting) return;
              idleExiting = true;
              catIdles.setEnabled(false);
              let done = false;
              const budget = (catIdles.secondsTo('lie_belly') ?? 0) + IDLE_EXIT_MARGIN_S;
              const deadline = catMixer.time + budget;
              const finish = (viaNet) => {
                if (done) return;
                done = true;
                idleExiting = false;
                idleNetCheck = null;
                // The warn NAMES WHAT IT WAS WAITING FOR, or it is a report with no second
                // half — which is how #96 survived a whole row. Through the bridge too: on a
                // device a console.warn reaches nothing.
                if (viaNet) {
                  const w = catIdles.waitingOn;
                  const msg = 'cat: idle exit overran ' + budget.toFixed(2)
                    + ' s of animation — forcing it (pose ' + catIdles.pose + ', waiting on '
                    + (w ? JSON.stringify(w) : 'nothing') + ')';
                  console.warn(msg);
                  window.collectivus?.log?.(msg);
                }
                then();
              };
              catIdles.to('lie_belly', () => finish(false));
              // Checked from the frame loop against the MIXER's clock, not from a timer:
              // a setTimeout would be the wall clock again by another name.
              idleNetCheck = () => { if (catMixer.time >= deadline) finish(true); };
            };

            const beginRoam = () => {
              if (!catWalk) { phase = 'awake'; until = performance.now() + holdS * 1000; return; }
              phase = 'rising'; play(getUp);
            };
            // ── the pounce (NPC-004 revision) ─────────────────────────────────
            // ★ THE CHASE HAD NO ENDING, AND THAT IS WHY IT READ AS NOTHING. `goTo`
            // simply DROPPED its target on arrival and the wander resumed, so the cat
            // reached the mouse, forgot about him, and strolled off — measured six
            // times in sixty seconds. An arrival has to mean something.
            //
            // The clips are `jump_launch_f` + `jump_land_f`, both in-place, so the
            // steering is stopped for the duration and the last matrix stands. He
            // pounces where the mouse WAS: the evade reflex fires at a metre and the
            // pounce commits at half that, so the ordinary outcome is a near miss with
            // the mouse already going into the crack — which is canon ("he is never
            // caught for keeps") and reads far better than a catch would.
            const beginPounce = () => {
              phase = 'pounce';
              // Two strikes if there is something to strike. Set HERE, at the top of
              // the beat, so a second pounce later in the session starts fresh.
              batsLeft = (mouse && mouse.frozen) ? 2 : 0;
              pursueUntil = 0;
              catRoaming = false;          // in-place clips: nothing may drive the body
              catWalk.clearTarget();
              catWalk.walkPace();          // so the recovery starts from a walk
              play(pounceUp);
            };

            // ── the bat and the release (INT-004) ─────────────────────────────
            // ★ A BAT IS THE POUNCE AGAIN, SHORTER, AND THAT IS AN ASSET FACT
            // rather than a shortcut: the Fab pack has no bat clip, and inventing
            // one is a rig-and-author job, not a row of code. Replaying the paw
            // strike at pace over a mouse who is already down is what a cat
            // batting something actually looks like, and the mouse being nudged
            // forward each time is what makes it read as contact rather than as
            // the cat swiping at the floor beside him.
            const CATCH_M = parseFloat(q.get('catcatch') ?? '0.42');
            let batsLeft = 0;
            const beginBat = () => {
              phase = 'pounce';
              if (mouse) {
                mouse.bump(0.05 + Math.random() * 0.04);
                if (audioFire) audioFire('mouse_bolt', { position: mouse.position.clone(), gain: 0.5 });
              }
              play(pounceUp);
            };
            const releaseMouse = () => {
              // He lets go, and the mouse does not wait to be asked twice.
              if (mouse) { mouse.thaw(); if (mouseCtl) mouseCtl.flee({ profile: 'bolt' }); }
              // Canon: he licks a paw about it. `perform` is a one-shot from
              // whatever pose he is in and refuses when the deferred idle set has
              // not loaded, so the recovery below is driven on wall clock rather
              // than off that clip's own end — a beat that only happens when an
              // optional asset arrived is not a beat you can build a phase on.
              const licked = !!catIdles && catIdles.perform('lick');
              setTimeout(() => {
                if (phase !== 'pounce') return;     // something else claimed him
                catRoaming = true;
                resetLoco();
                play(walkClip);
                beginHome();
              }, licked ? 1900 : 700);
            };

            const beginHome = () => {
              phase = 'homing';
              // ★ HE HAS TO BE ABLE TO STAND ON HIS OWN BED, AND HE COULD NOT.
              // `Prop_Pillow_2` is 6 cm tall, which put it inside the walkability
              // band, which made the art-directed nap cell BLOCKED — so `goTo`
              // would have sat in 'homing' for the rest of the session with a cat
              // circling his own bed and nothing logged. Fixed in cat-walk.js with
              // a step height (anything under 12 cm is floor to a cat), not by
              // naming the pillow. Asserted here so a re-dress that parks a crate
              // on the rug fails loudly instead of quietly stranding him.
              if (!catWalk.walkable(NAP.x, NAP.z)) {
                console.warn('cat: the nap spot is not walkable — he cannot get home');
              }
              catWalk.goTo(NAP.x, NAP.z, {
                radius: 0.35,
                onArrive: () => {
                  catRoaming = false;
                  // Settle onto the signed pose. He arrives within 35 cm on an
                  // arbitrary heading — a cat cannot converge on a point, it
                  // arrives near one — and the lie-down transition covers the
                  // difference. The alternative is letting him sleep wherever he
                  // stops, which loses the sun pool the spot was chosen for.
                  parkAt(NAP.x, NAP.z, NAP.yaw);
                  phase = 'lying'; play(lieDown);
                },
              });
            };

            catTick = () => {
              const now = performance.now();
              // The exit's net, on the MIXER's clock. Outside the switch because an exit can be
              // issued from several phases and the phase changes the moment it settles.
              if (idleNetCheck) idleNetCheck();
              switch (phase) {
                case 'doze':
                  if (now >= until) { phase = 'awake'; play(dozeOut); until = now + holdS * 1000; holdS = 5; }
                  break;
                case 'awake':
                  if (now < until) break;
                  if (roamsLeft > 0) { roamsLeft--; beginRoam(); }
                  else if (catIdles && !catIdles.busy && Math.random() < CAT_IDLE_P) beginIdle();
                  else { phase = 'doze'; play(dozeIn); until = now + CAT_DOZE_S * 1000; }
                  break;
                case 'idle':
                  // The chooser only acts when a hold expires; the transitions
                  // themselves end on the mixer's `finished`, inside the module.
                  catIdles.tick();
                  if (now >= until && !idleExiting) {
                    exitIdle(() => {
                      if (roamsLeft > 0) { phase = 'awake'; until = performance.now(); }
                      else { phase = 'doze'; play(dozeIn); until = performance.now() + CAT_DOZE_S * 1000; }
                    });
                  }
                  break;
                case 'roam':
                  // ★ RE-AIM, DO NOT RE-PATH. `goTo` is a destination, and the
                  // steering still owns the arc, the wall grid and the turn-rate
                  // cap — every guarantee NPC-001 measured over an hour survives
                  // a hunt because a hunt only moves the destination. Assigning a
                  // heading at the prey instead is the pivot this module exists
                  // to refuse.
                  //
                  // ★★ AND A DESTINATION ALONE IS NOT A CHASE (Josh, 2026-09-06).
                  // The first cut moved the target and nothing else, so the cat
                  // walked at one unvarying pace toward a point and read as
                  // wandering. What makes it a hunt is the PACE LADDER below —
                  // close at a trot, drop to a stalk inside a body length or two,
                  // then commit. Three distinct speeds a viewer can read, in the
                  // order a cat uses them.
                  if (pursueUntil > now) {
                    if (mouse && mouse.onFloor) {
                      const p = mouse.position;
                      const gap = Math.hypot(p.x - catWalk.position.x,
                                             p.z - catWalk.position.z);
                      // The wind-up: he slows as he closes. A cat that arrives at
                      // full trot has no pounce left in it, and the deceleration
                      // is most of what reads as intent.
                      if (gap > STALK_M) catWalk.trotPace();
                      else catWalk.setPace(CAT_STALK_SPEED);
                      if (now >= reaimAt) {
                        reaimAt = now + 250;
                        catWalk.goTo(p.x, p.z, { radius: POUNCE_M, onArrive: beginPounce });
                      }
                    } else {
                      // He is back in the wall or up on the belt. The cat loses
                      // interest rather than homing on a point nothing occupies —
                      // and the roam plays out its remaining time as a plain
                      // wander, which reads as a cat giving up.
                      pursueUntil = 0;
                      catWalk.clearTarget();
                      catWalk.walkPace();
                    }
                  }
                  if (now >= until) beginHome();
                  break;
                case 'pounce':
                  break;      // ends on the mixer's `finished`, never on a poll
                // 'rising', 'homing' and 'lying' all end on something other than a
                // clock: two of them end when a one-shot clip finishes and one ends on
                // arrival. They are driven by the mixer's `finished` event and by
                // goTo's callback below, NOT by polling `action.time` here.
                //
                // ★ POLLING `action.time >= duration - eps` IS WHAT THE FIRST CUT DID,
                // AND IT HUNG THE CAT MID-RISE. Through browser automation the pane
                // composites almost nothing between calls, so the mixer advances a
                // handful of frames an inspection and the poll simply never came true —
                // he stood up and then stood there, with `phase` reading 'rising'
                // forever and no error anywhere. The event fires on the frame the clip
                // actually ends, however few frames that took.
                default:
                  break;
              }
            };

            catMixer.addEventListener('finished', (e) => {
              if (e.action === getUp) {
                // Clear the locomotion crossfade state, or the first gait call tries to
                // fade from whichever clip the LAST roam ended on — which is not playing.
                phase = 'roam'; catRoaming = true; resetLoco(); play(walkClip);
                until = performance.now() + roamFor * 1000;
              } else if (e.action === pounceUp) {
                play(pounceDown);
              } else if (e.action === pounceDown) {
                // ── did he land ON him? (INT-004) ───────────────────────────
                // ★ THE CATCH IS THE INTERACTION'S, NOT THE HUNT'S. Ordinarily
                // he misses BY CONSTRUCTION — the evade reflex bolts the mouse
                // at 1.0 m and the pounce commits at 0.55, so he lands where the
                // mouse was, which is canon ("he is never caught for keeps").
                // A tap-frozen mouse does not bolt, so the pounce arrives and
                // the full choreography canon asks for becomes possible: pounce,
                // bat, release, the mouse away to the hole, and the cat washing
                // a paw about it. The controller owns that SEQUENCE; the event
                // only set up the beat (NPC-004's rule, unchanged).
                const caught = mouse && mouse.frozen && mouse.onFloor
                  && catWalk && mouse.position.distanceTo(catWalk.position) < CATCH_M;
                if (caught && batsLeft > 0) { batsLeft--; beginBat(); }
                else if (caught) { releaseMouse(); }
                else {
                  // Missed. He picks himself up and walks it off — back to the bed,
                  // because a cat that has just lost one does not carry on patrolling.
                  catRoaming = true;
                  resetLoco();
                  play(walkClip);
                  beginHome();
                }
              } else if (e.action === lieDown) {
                // A roam asked for WHILE he was lying down must not wait out a full
                // nap first — he settles, then gets straight back up. Without this
                // a hunt fired in that window plays a cat rising 20 s after the
                // mouse has gone in, which reads as him having no idea why.
                phase = 'doze'; play(doze);
                until = performance.now() + (roamsLeft > 0 ? 0.4 : CAT_DOZE_S) * 1000;
              }
            });

            // ── locomotion: which clip, and how fast it plays ─────────────────
            // The module now names the gait AND hands over a rate derived from MEASURED
            // travel, so this crossfades and sets the rate rather than poking one clip.
            // `current` is deliberately left alone: the nap chain owns it, and locomotion
            // only runs while he is roaming, at which point `current` is already the
            // locomotion clip.
            let locoClip = null;
            catWalkRate = (name, rate) => {
              const next = name === 'trot' ? trotClip : walkClip;
              if (next !== locoClip) {
                if (locoClip) { next.reset(); next.crossFadeFrom(locoClip, 0.25, false); next.play(); }
                locoClip = next;
                current = next;          // keep the nap chain's crossfades honest
              }
              next.setEffectiveTimeScale(rate);
            };
            // A roam always begins at a walk; `beginRoam` plays it and the module's own
            // gait pick takes over from the first frame of travel.
            const resetLoco = () => { locoClip = null; };

            // ★ A PARAM THAT DID NOT SUBSTITUTE MUST NOT BECOME A DEADLINE. `{chase}`
            // arriving as the literal string — a cue with no authored draws, a
            // fireNow from the console, a draw renamed in the JSON and not in the
            // track — makes `seconds - late` NaN, and `NaN < 6` is false, so every
            // guard passes and the deadline is set to NaN. The cat then sits in
            // one phase forever with nothing logged and nothing thrown: the exact
            // shape of the bug the mixer's `finished` event was adopted to avoid.
            // Fall back to the authored default and say so once, rather than
            // computing with a non-number.
            const secs = (v, fallback, what) => {
              const n = typeof v === 'number' ? v : parseFloat(v);
              if (Number.isFinite(n)) return n;
              if (v !== undefined) console.warn(`cat: ${what} got ${JSON.stringify(v)}, using ${fallback}`);
              return fallback;
            };

            // ★ A COMMAND MUST WORK FROM EVERY PHASE, OR IT LIES. `roam` and `hunt`
            // originally handled 'doze' and 'roam' and quietly did nothing from the
            // other four — they set their flags, returned true, and the cat carried
            // on walking back to bed. The scheduler has no idea which phase he is
            // in when it fires, so "the event fired and he ignored it" is not a rare
            // case, it is most of them: 'homing' and 'lying' alone are every fire
            // that lands in the last stretch of a roam.
            //
            // Each phase needs a different nudge, and none of them may assign a
            // heading or a transform — that is the pivot cat-walk.js exists to
            // refuse, and it is why 'homing' turns him round by CLEARING the target
            // rather than by re-parking him.
            const beginRoamFrom = (seconds) => {
              const now = performance.now();
              roamFor = seconds;
              roamsLeft = 1;
              switch (phase) {
                case 'roam':                       // already out: just extend the errand
                  until = now + seconds * 1000;
                  roamsLeft = 0;
                  break;
                case 'homing':                     // turn him round before he reaches the bed
                  catWalk.clearTarget();
                  phase = 'roam';
                  until = now + seconds * 1000;
                  roamsLeft = 0;
                  break;
                case 'doze':
                  phase = 'awake'; play(dozeOut); until = now;
                  break;
                case 'idle':                       // stop idling, get back down, then rise
                  exitIdle(() => { phase = 'awake'; until = performance.now(); });
                  break;
                case 'lying':                      // mid lie-down; the clip's `finished` picks it up
                case 'rising':                     // already on his way up
                case 'awake':                      // the awake case will see roamsLeft
                  break;
              }
            };

            catCtl = {
              /** npc/cat/wake — stir from the doze, hold the awake pose, settle again. */
              wake({ holdSeconds = 5 } = {}, ctx = { late: 0 }) {
                if (phase !== 'doze') return true;   // already up: absorbed, not queued
                if (ctx.late > 2) return true;       // joined too late to see the stir start
                holdS = Math.max(0.5, secs(holdSeconds, 5, 'wake holdSeconds') - ctx.late);
                phase = 'awake'; play(dozeOut); until = performance.now() + holdS * 1000;
                return true;
              },
              /** npc/cat/roam — get up and walk the room for a while, then go back to bed. */
              roam({ seconds = CAT_ROAM_S } = {}, ctx = { late: 0 }) {
                if (!catWalk) return false;
                const left = secs(seconds, CAT_ROAM_S, 'roam seconds') - (ctx.late || 0);
                if (left < 5) return true;           // joined too late for the errand to read
                beginRoamFrom(left);
                return true;
              },
              /**
               * npc/cat/hunt — a roam that CHASES. Same machinery as roam: he
               * gets up, walks, and goes back to bed afterwards; the difference
               * is that for `seconds` his destination is the mouse's live
               * position, re-read four times a second.
               *
               * ★ IT REFUSES WHEN THERE IS NOTHING TO HUNT, rather than playing
               * a cat stalking an empty floor. The chase event pairs it with the
               * mouse's own beat so there IS prey when it fires; a refusal here
               * is logged, which is how that pairing gets checked instead of
               * assumed.
               */
              hunt({ seconds = 40 } = {}, ctx = { late: 0 }) {
                if (!catWalk) return false;
                if (!mouse || !mouse.onFloor) return false;
                const left = secs(seconds, 40, 'hunt seconds') - (ctx.late || 0);
                if (left < 6) return true;           // joined too late for the chase to read
                pursueUntil = performance.now() + left * 1000;
                reaimAt = 0;
                beginRoamFrom(left);
                return true;
              },
              /**
               * npc/cat/idle — wake up and just BE for a while: sit, lie over on his
               * side, groom, stand and look at nothing. The pose graph picks; this
               * only says how long the bout runs.
               *
               * ★ IT REFUSES RATHER THAN LYING when the set has not loaded (the
               * clips are a deferred second wave) or when he is out on the floor.
               * A command that sets a flag, returns true and does nothing is the
               * defect NPC-004 shipped from four of six phases.
               */
              idle({ seconds = CAT_IDLE_S } = {}, ctx = { late: 0 }) {
                if (!catIdles) return false;
                const left = secs(seconds, CAT_IDLE_S, 'idle seconds') - (ctx.late || 0);
                if (left < 4) return true;           // joined too late for the beat to read
                if (phase === 'idle') { until = performance.now() + left * 1000; return true; }
                if (phase === 'doze') { phase = 'awake'; play(dozeOut); }
                if (phase !== 'awake') return false; // out roaming: not a thing he can do here
                until = performance.now();
                beginIdle();
                until = performance.now() + left * 1000;
                return true;
              },
              /** npc/cat/groom — one grooming beat, from whatever pose he is in. */
              groom() {
                if (!catIdles || phase !== 'idle') return false;
                const pose = catIdles.pose;
                const options = { stand: ['lick', 'scratch', 'sharpen'], sit: ['lick'] }[pose] ?? [];
                for (const name of options) if (catIdles.perform(name)) return true;
                return false;                        // lying down: there is no clip for it
              },
              /**
               * npc/cat/stare — the hallucination stare. He holds a standing idle and
               * stops reconsidering. Deliberately NOT a mechanism: no head IK, no
               * look-at target, nothing that could point him at a moving object. The
               * beat is that he is still, facing the room, for an uncomfortably long
               * time; whatever he is looking at is the viewer's problem.
               */
              stare({ seconds = 12 } = {}, ctx = { late: 0 }) {
                if (!catIdles || phase !== 'idle') return false;
                const left = secs(seconds, 12, 'stare seconds') - (ctx.late || 0);
                if (left < 3) return true;
                if (catIdles.pose !== 'stand') { catIdles.to('stand', () => catIdles.stare(left)); return true; }
                return catIdles.stare(left);
              },
              /** npc/cat/rest — abandon whatever he is doing and head back to the nap spot. */
              rest() {
                roamsLeft = 0;
                pursueUntil = 0;
                if (catWalk) catWalk.walkPace();
                if (phase === 'roam') beginHome();
                else if (phase === 'idle') {
                  exitIdle(() => {
                    phase = 'doze'; play(dozeIn);
                    until = performance.now() + CAT_DOZE_S * 1000;
                  });
                }
                return true;
              },
              /**
               * A test seam, not a vocabulary action (it is deliberately absent from
               * vocabulary.json — an event must not be able to make him pounce at
               * nothing). INT-004's catch branch is clip-driven and takes the cat a
               * room's width to reach on its own, which browser automation cannot
               * drive at real time: a hidden pane composites a handful of frames per
               * inspection, so the walk that reads as three seconds to a viewer takes
               * minutes and every clip-timed beat expires first. This lets the branch
               * be exercised where it starts.
               */
              pounceNow() {
                if (!catWalk || phase === 'pounce') return false;
                catRoaming = true;
                beginPounce();
                return true;
              },
              get phase() { return phase; },
              get pose() { return catIdles ? catIdles.pose : null; },
              get roaming() { return catRoaming; },
              get hunting() { return pursueUntil > performance.now(); },
              get position() { return catWalk ? catWalk.position : null; },
            };
          } catch (e) { console.warn('cat not loaded:', e); }
        }
      } catch (e) { console.warn('props.glb not loaded:', e); }

      // ── the conveyor (DP-W3, ENV-006/007/008) ─────────────────────────────
      // Built BEFORE the GI bake for the same reason the props are: 5 m of belt
      // and its hangers hanging over the working plane are a real occluder, and
      // a volume baked without them lights a room that is not the one shipping.
      // ?belt=0 removes it (for an A/B against the DP-W2 baseline).
      if (q.get('belt') !== '0') {
        try {
          const jarData = await fetch('../../assets/dripping-pickle/jar-contents.json')
            .then((r) => r.json());
          const labelMap = await jarLabelSheet;
          conveyor = createConveyor({
            labelMap,                    // baked from jarData.labels by tools/bake-text.mjs
            // Into `pickables`, not the scene: the belt has real names and the
            // art director will want to comment on it. The module locks the
            // group with userData.noMove, so it is selectable but not
            // draggable — its transform is an output, not a suggestion.
            scene: pickables,
            data: jarData,
            structure: gltf.scene,       // hangers raycast the REAL roof
            // DP-W3 measured the seam crossings; DP-W7 makes them audible. Routed through a
            // mutable sink because the belt is built before the audio engine exists, and a jar
            // that crosses a seam in that window should simply be silent, not throw.
            onClink: (e) => { if (onClinkSink) onClinkSink(e); },
            // A jar going over the edge is a BEAT (Gate A §8.4), and the beat is authored in
            // jar_offbelt.json — the module owns the falling jar and knows nothing about
            // screens or sound. Routed through a mutable sink because the belt is built long
            // before the event runner, and a knock-off in that window should be silent, not throw.
            onKnockOff: (e) => { if (onKnockOffSink) onKnockOffSink(e); },
            params: {
              beltY: parseFloat(q.get('belty') ?? DEFAULT_BELT_Y),
              speed: parseFloat(q.get('beltspeed') ?? '0.10'),
              pitch: parseFloat(q.get('jarpitch') ?? '0.32'),
            },
          });
          conveyor.group.traverse((o) => {
            if (!o.isMesh) return;
            // the AO's third channel treats it as a prop, like the set dressing
            o.layers.enable(1);
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            for (const m of mats) if (m && m.isMeshStandardMaterial) litMaterials.add(m);
          });
          window.__conveyor = conveyor;
        } catch (e) { console.warn('conveyor not built:', e); }
      }

      // ── front-corner dressing (ENV-009) ───────────────────────────────────
      // The HVAC unit and the mouse crack. The crates and the pipes the same
      // item asks for are already in the room — see the module header.
      if (q.get('corner') !== '0') {
        const dressing = createCornerDressing({ scene: pickables });

        // ── the cat on the Outpost's grid (DP-W6, NPC-001) ───────────────────
        // ★ BUILT HERE, NOT WITH THE CAT, BECAUSE THE GRID IS MEASURED ONCE AND
        // THE ROOM HAS TO BE FINISHED WHEN IT IS. The belt, its legs, the HVAC
        // and the crates all land after the props load; a grid built inside the
        // cat's own block would be measured against a half-dressed room and
        // would come back CORRECT-LOOKING — right cell count, plausible
        // reachable area — while leaving him free to walk through the dressing
        // that arrived afterwards.
        //
        // The blockers are every root that is actually in the room. The
        // conveyor sits at 2.32 m and is filtered out by the height band on its
        // own, not by being left out here — the band is what makes the floor
        // walkable and the roof irrelevant without naming either, and the belt
        // is the roof's case. Its LEGS, if any reach the band, correctly block.
        //
        // ★ AND IT IS `pickables`, NOT `props.scene` — THIS BLOCK IS OUTSIDE THE
        // PROPS LOAD SCOPE. `props.scene` is local to its own try block; naming
        // it here throws a ReferenceError into the catch, prints one warn, and
        // leaves a perfect-looking room with a cat who walks through the desks.
        // That is the exact failure DP-W4's engine wiring hit. `pickables` holds
        // the shell, the props, the belt, the dressing AND the cat — and the cat
        // is the reason `noBlock` exists.
        if (catObj) {
          try {
            catWalk = createCatWalk({
              model: catObj,
              building: pickables,
              floorY: 0.02,
              speed: parseFloat(q.get('catspeed') ?? '0.45'),
              // ★ THE ARC IS THE DIAL, AND 0.55 IS THE FACTORY'S ANSWER, NOT
              // THIS ROOM'S. Everything derives from it: maxForce = v²/r, turn
              // rate = v/r, lookahead = 2.5r. The Outpost has 17.2 m² of
              // walkable floor against the factory's open bay, so the fit
              // moved. Swept over ten simulated minutes each, arc × personal
              // space, all nine at 0 pivot frames and 0 wall frames:
              //
              //   arc 0.55 → 1,076–1,663 contact frames of 18,000 (6–9 %)
              //   arc 0.40 → 474 (2.6 %) at personal 0.55, 64 cells covered
              //   arc 0.30 → 55–267 (0.3–1.5 %), but only 38–56 cells: he
              //              stops using the room and orbits one corner
              //
              // 0.40 is the pick — it keeps the room covered and cuts scraping
              // by more than half. It is not free: a tighter arc means more
              // foot slide through a corner, because the walk clip has no turn
              // in it and the body yaws underneath a straight-line cycle
              // (measured 0.55 → 3.8 % median slide, 1.5 → 2.1 %). Fixing that
              // properly needs additive turn poses or IK, not a dial.
              turnRadius: parseFloat(q.get('catarc') ?? '0.40'),
              stride: catStride?.used ?? 0.472,
              cell: 0.3,
              // The probe ring stays WIDE while the arc narrows: at 0.30 he
              // scrapes more, not less, because he can turn inside the gap and
              // ends up threading it instead of avoiding it.
              personal: 0.55,
              onClip: (name, rate) => { if (catWalkRate) catWalkRate(name, rate); },
              // Via `catStride`, NOT the local const: the clip setup is in a different try
              // block, and naming its local here throws a ReferenceError into that catch —
              // one console.warn, no cat walk, and a room that looks otherwise perfect.
              // The same trap that has now bitten the engine wiring, the grid and the mouse.
              trotStride: catStride?.trotUsed ?? 0.95,
              trotSpeed: parseFloat(q.get('cattrot') ?? '1.05'),
            });
          } catch (e) { console.warn('cat walk not built:', e); }
        }
        dressing.group.traverse((o) => {
          if (!o.isMesh) return;
          o.layers.enable(1);
          const m = o.material;
          if (m && m.isMeshStandardMaterial) litMaterials.add(m);
        });
        window.__corner = dressing;

        // ── the mouse (DP-W6, NPC-003) ──────────────────────────────────────
        // ★ HE IS LOADED HERE BECAUSE HIS ROUTES ARE MEASURED AGAINST THIS
        // ROOM, INCLUDING THE CRACK THE LINE ABOVE JUST BUILT. And like the
        // grid, this block is OUTSIDE the props load scope — `props.scene` is
        // local to its own try, and naming it here would throw a ReferenceError
        // into that catch, print one warn, and leave a room with no mouse and
        // nothing else wrong. That is DP-W4's engine-wiring failure exactly.
        //
        // The asset is ORIGINAL: tools/blender-build-mouse.py builds mesh, rig
        // and all four clips, and that script IS the authorship recorded in
        // asset-provenance.csv. ?mouse=0 removes him.
        if (q.get('mouse') !== '0') {
          try {
            const mg = await new Promise((res, rej) =>
              gltfLoader.load('../../assets/mouse/mouse.glb', res, undefined, rej));
            const mouseObj = mg.scene;
            mouseObj.name = 'NPC_Mouse_Caper';
            const clips = {};
            for (const c of mg.animations) clips[c.name] = c;
            for (const need of ['scurry', 'freeze', 'sniff', 'squeeze']) {
              if (!clips[need]) throw new Error(`mouse.glb is missing the ${need} clip`);
            }
            mouseMixer = new THREE.AnimationMixer(mouseObj);
            mouse = createMouse({ scene: pickables, model: mouseObj, mixer: mouseMixer, clips });

            // Into `pickables` with everything else, so the feedback panel can
            // select and comment on him. `noMove`/`noBlock` are set by the
            // module — noBlock matters here because the cat's grid is built a
            // few lines below and would otherwise measure the mouse as wall.
            pickables.add(mouseObj);
            mouseObj.traverse((o) => {
              if (!o.isMesh) return;
              o.layers.enable(1);            // the AO's prop channel
              const mats = Array.isArray(o.material) ? o.material : [o.material];
              for (const m of mats) if (m && m.isMeshStandardMaterial) litMaterials.add(m);
            });

            // ★ MEASURED, NOT TYPED — and by the CAT's measurement code, which
            // is the reason the rig is authored facing Blender -Y with claw_*
            // toe bones. Re-run at load so a re-export cannot leave a stale
            // number behind, exactly as the cat's stride is.
            const scurryAction = mouse.actions.scurry;
            const measured = measureAuthoredSpeed({
              model: mouseObj, mixer: mouseMixer, action: scurryAction });
            if (measured) mouse.setAuthoredSpeed(measured);
            mouseStride = { measured, used: mouse.authoredSpeed };

            // ── his life, as events (DP-W6, NPC-004) ─────────────────────────
            // ★ THE PLACEHOLDER CYCLE IS GONE. What replaced it is NOT a better
            // cycle — it is a CONTROLLER with no rhythm of its own at all. When
            // he comes out, how long he stays and which life he is living are
            // EventDefs on the `npc` channel (assets/dripping-pickle/events/
            // mouse_errand, mouse_belt_run, cat_hunts, mouse_bolt), scheduled off
            // the same shared clock as everything else. That is the row's gate:
            // no scheduler change, no second executor, and his beats now align
            // across viewers instead of starting wherever each page happened to
            // load.
            //
            // What the controller still owns is the SEQUENCE inside one beat —
            // out through the crack, the errand, back in — because that is a
            // property of the room's geometry, not of the schedule. An event
            // that had to name three routes in order would be authoring the
            // building, and the next re-dress would break every event file.
            //
            // ★★ TWO LIVES, TWO DOORWAYS (Josh, 2026-09-06). The floor life
            // comes and goes through the wall crack. The belt life comes and
            // goes through the belt's OWN cut-out — he does not climb the wall,
            // because a climb is invisible at the top and was the source of
            // every collision the route check found. On the belt he is either
            // running the camera-side rail (94 % visible) or riding a jar lid
            // (100 %); the belt's top surface is 0 % and is not an option.
            //
            // Every duration here is WALL CLOCK (performance.now()), never
            // accumulated frame dt — the defect measured on the return
            // affordance and on the conveyor stall, and this Loop targets
            // 30 FPS on a phone.
            let queue = [];            // steps still to play in this beat
            let waitUntil = 0;         // wall-clock gate between steps
            let rideUntil = 0;         // a jar ride ends on the clock, not on a route

            // Which routes loop, so a lap count means something to the drive.
            const ROUTES_LOOPING = new Set(
              Object.entries(mouse.ROUTES).filter(([, r]) => r.loop).map(([k]) => k));

            const startStep = (st) => {
              mouse.state.wantLaps = st.laps ?? 1;
              if (st.kind === 'ride') {
                // Board a jar that has just come through the entry cut-out, so he appears
                // from the hole rather than materialising mid-belt.
                // ★ THE COMMENT HAS SAID THIS SINCE NPC-003 AND THE CODE NEVER DID IT. It
                // picked `seed % count` — a slot, at random — and slot order is not path
                // order (the fill wraps), so he boarded wherever that landed, in full view.
                // Measured while fixing the ride: he appeared at z = +1.08, two thirds of the
                // way down a belt whose entry is at z = -2.37. The conveyor answers the real
                // question now.
                mouse.rideJar(conveyor, { jar: conveyor.jarNearestEntry(),
                                          offsetY: JAR_LID_Y - 2.32, still: 'sniff' });
                rideUntil = performance.now() + st.seconds * 1000;
                return;
              }
              mouse.run(st.route, { profile: st.profile, seed: st.seed });
            };

            /** Begin a beat: a list of steps, replacing whatever he was doing. */
            const begin = (steps) => {
              queue = steps.slice();
              waitUntil = 0;
              const first = queue.shift();
              if (first) startStep(first);
              else mouse.hide();
            };

            // ── the per-frame half ───────────────────────────────────────────
            // It advances the queue and nothing else. There is no "what should
            // he do next" in here at all — when the queue empties he goes back
            // in the wall and STAYS there until an event says otherwise, which
            // is what makes the schedule the single author of his rhythm.
            mouseDrive = () => {
              if (mouseDrivePaused) return;
              const now = performance.now();
              if (mouse.state.running) {
                if (mouse.state.mode === 'ride') {
                  if (now < rideUntil) return;
                  mouse.stop();
                } else if (mouse.state.laps >= (mouse.state.wantLaps ?? 1)
                           && ROUTES_LOOPING.has(mouse.state.routeId)) {
                  mouse.stop();
                } else return;
              }
              if (now < waitUntil) return;
              const st = queue.shift();
              if (!st) { if (mouse.state.visible) mouse.hide(); return; }
              waitUntil = now + (st.gapMs || 0);
              startStep(st);
            };

            // ── the npc/mouse commands ───────────────────────────────────────
            // The executor knows nothing about mice: it calls the method named
            // by the track's action. Each returns true when it took the command
            // and false when it could not — a `false` is logged rather than
            // pretended, which is how a track that can never apply gets found.
            let seedN = 1;
            const nextSeed = () => (seedN++ * 2654435761) | 0;
            mouseCtl = {
              /**
               * npc/mouse/scurry — the floor life. Out through the crack, `laps`
               * of a route, back in through the crack. `ctx.late` is honoured the
               * way the cat's wake honours it: a viewer who joined after the beat
               * began does not get a truncated errand played from its start.
               */
              scurry({ route = 'patrol_floor', profile = 'errand', laps = 1 } = {}, ctx = { late: 0 }) {
                if (!mouse) return false;
                if ((ctx.late || 0) > 6) return true;      // too late for the exit to read
                begin([
                  { route: 'hole_exit',  profile: 'wary',  seed: nextSeed(), gapMs: 0 },
                  { route, profile, laps, seed: nextSeed(), gapMs: 250 },
                  { route: 'hole_enter', profile, seed: nextSeed(), gapMs: 250 },
                ]);
                return true;
              },
              /**
               * npc/mouse/belt — the conveyor life, in through the belt's own
               * cut-out. `mode` 'rail' runs the camera-side rail; 'ride' stows
               * away on a jar lid.
               * ★ WHICH ONE IS A SHARED DRAW, NEVER LOCAL MEMORY (W9). It was
               *   'alternate' off a counter that started at every page load, so a
               *   fresh entry always ran the rail first and rode only on its second
               *   belt fire — ~27 minutes in at the observed gap, which is why no
               *   device leg ever saw a ride — and two devices showed different
               *   habits for the same fire (loops-docs 55 §7). mouse_belt_run's
               *   `mode` draw decides it now, identically everywhere.
               */
              belt({ mode = 'rail', seconds = 34 } = {}, ctx = { late: 0 }) {
                if (!mouse) return false;
                if ((ctx.late || 0) > 8) return true;
                const ride = mode === 'ride';
                if (ride && !conveyor) return false;        // no belt, no stowaway
                // Same guard as the cat's: an unsubstituted param must not become a deadline.
                const secsN = typeof seconds === 'number' ? seconds : parseFloat(seconds);
                const dur = Number.isFinite(secsN) ? secsN : 34;
                begin(ride
                  ? [{ kind: 'ride', seconds: Math.max(4, dur - (ctx.late || 0)), seed: nextSeed() }]
                  : [{ route: 'belt_run', profile: 'errand', seed: nextSeed() }]);
                return true;
              },
              /**
               * npc/mouse/flee — drop everything and bolt for the crack.
               * ★ IT REFUSES WHEN HE IS NOT OUT IN THE ROOM, and that refusal is
               * the point: fleeing from inside the wall is a beat nobody can see,
               * and fleeing off a moving jar would teleport him to the floor.
               */
              flee({ profile = 'bolt' } = {}) {
                if (!mouse || !mouse.onFloor) return false;
                begin([{ route: 'hole_enter', profile, seed: nextSeed(), gapMs: 0 }]);
                return true;
              },
              /**
               * npc/mouse/freeze — he stops dead where he is (INT-004).
               *
               * ★ IT REFUSES WHEN HE IS NOT OUT ON THE FLOOR, for the same two
               * reasons `flee` does: freezing inside the wall is a beat nobody
               * can see, and freezing on a moving jar would leave him hanging in
               * the air while the belt carried the jar out from under him. The
               * hotspot only exists while he is on the floor, so a viewer cannot
               * reach this case by tapping — but an event can, and a command that
               * quietly does nothing is the defect NPC-004 shipped.
               */
              freeze({ seconds = 6 } = {}, ctx = { late: 0 }) {
                if (!mouse || !mouse.onFloor) return false;
                const secs = Number(seconds);
                const left = (Number.isFinite(secs) ? secs : 6) - (ctx.late || 0);
                if (left < 1.5) return true;      // joined too late for the hold to read
                return mouse.freeze(left);
              },
              /** npc/mouse/hide — back in the wall, now. The stage direction, not a beat. */
              hide() { if (!mouse) return false; queue = []; mouse.hide(); return true; },
              get onFloor() { return !!mouse && mouse.onFloor; },
              get busy() { return !!mouse && (mouse.state.running || queue.length > 0); },
              get frozen() { return !!mouse && mouse.frozen; },
            };

            // Scripted verification needs to park him in one state — the drive
            // otherwise reclaims him on the next frame, which is what made the
            // jar ride unphotographable.
            mouse.pauseDrive = (v = true) => { mouseDrivePaused = !!v; };
            window.__mouse = mouse;
          } catch (e) { console.warn('mouse not built:', e); }
        }
      }

      // ── the chalkboard (Josh, 2026-09-03) ─────────────────────────────────
      // Part of the structure glb, not props — it is a mounted fixture, not
      // set dressing. ?chalk=0 stops it writing (the reviewer drag tool still
      // selects the mesh either way).
      if (q.get('chalk') !== '0') {
        // pickables, not gltf.scene: the object exists under the structure
        // glb's own hierarchy either way, but pickables is the stable
        // top-level container everything ends up reachable from once the
        // async props/cat loads ahead of this point have all landed.
        const board = pickables.getObjectByName('Cube065');
        if (board) {
          // ⚠ The camera is what decides which side of the board a reader is on, and the
          // solve is why #99 is fixed rather than nudged — without it the module has no way
          // to know which face is the front or which way its uv axes run.
          chalkboard = createChalkboard(board, { camera, painter: glPainter });
          chalkboard.next();
          window.__chalk = chalkboard;
        } else {
          console.warn('chalkboard: Cube065 not found under the structure glb');
        }
      }

      // ── measure, then aim ─────────────────────────────────────────────────
      buildingBox = new THREE.Box3().setFromObject(gltf.scene);
      apertures = measureApertures(gltf.scene, buildingBox);
      aimSun();
      aimSkyShadow();
      PCSS.setSunAngle(RT_SUNANG);

      apertures.roof.forEach((ap, i) => {
        const l = skylights[i];
        if (!l) return;
        l.visible = true;
        l.intensity = RT_SKYL;
        l.width = ap.plane.uSize; l.height = ap.plane.vSize;
        l.position.copy(ap.centre);
        l.lookAt(ap.centre.x + ap.plane.normal.x,
                 ap.centre.y + ap.plane.normal.y,
                 ap.centre.z + ap.plane.normal.z);
      });

      volPass.setLight(sun);
      volPass.uniforms.uMaxDist.value = buildingBox.getSize(new THREE.Vector3()).length();

      // ── GI ────────────────────────────────────────────────────────────────
      const giBounds = buildingBox.clone().expandByScalar(GI_SPACING * 0.5);
      gi = createGIVolume({
        renderer, scene, bounds: giBounds,
        spacing: GI_SPACING, cubeSize: GI_CUBE,
      });
      // "Walls" = the STRUCTURE that faces the whole room — n033–n037 widened
      // it from the masonry to the columns (M_Concrete_Columns + .001, which
      // despite the name is the ceilings), the Wood_60 boards, the two big
      // pitted-rust beams and the facade trim family. The floor and props
      // keep the full volume — the over-lighting is a big-flat-surface
      // problem, not a global one (see RT_GIWALL above).
      const WALL_GI_RE = new RegExp([
        'brick', 'mural', 'plaster',
        '^M_Concrete_Columns',              // columns AND the .001 ceilings
        '^Wood_60$',
        '^M_PittedRust_Beams$',
        '^modular_factory_facade_trim',     // the whole trim family, for consistency
      ].join('|'), 'i');
      for (const m of litMaterials) {
        gi.patch(m, { gain: WALL_GI_RE.test(m.name) ? RT_GIWALL : 1 });
        PCSS.patch(m);
        if (WALL_GI_RE.test(m.name)) wallGiGains.push(m.userData.giGain);
      }
      gi.setIntensity(0);              // dark until the volume holds something
      gi.setNormalBias(RT_GIBIAS);
      gi.setBackWeight(RT_GIVIS);
      gi.setValidThreshold(RT_GIVALID);

      // The shipped opening view — captured live by the art director with the fly
      // camera (2026-08-19), a step in and left of the Blender camera. The glb's
      // own camera still carries the Blender framing; these two constants override
      // it, and ?cam=&tgt= deep links override both (applied by initFeedback, under ?dev/?review).
      // ★ Set target AFTER constructing OrbitControls, then update(): the ctor
      // lookAt()s its default target — the world origin — so any aim read before
      // the target is planted captures a yanked camera, not the framing.
      // Re-aimed live by the art director 2026-08-19 (the previous target's
      // z 0.707 had the whole view swung to the right).
      // ★ ROOM is Gate A 2.1's pose, NOT the 2026-08-19 live-dialled one.
      // Gate A re-decided the eye height with a reason the live dial did not
      // have: canon section 4 puts the camera "mounted low behind an (unseen)
      // workstation monitor", and 1.725 m is standing eye height, not a camera
      // hidden behind a monitor on a desk. 1.30 m sits just above a desk-
      // mounted monitor's top edge, which is the in-world story, and it buys
      // frame height for the conveyor that DP-W3 has to fit above the array.
      // ★ THE TARGET IS UNCHANGED, AND THAT IS THE WHOLE POINT — Gate A
      // specifies the EYE only. Carrying the old aim DIRECTION down with the
      // eye was tried first and is wrong: it drops the whole framing, so the
      // shot gains floor and loses ceiling, which is the opposite of Gate A's
      // stated reason for the change ("it also buys frame height for the
      // conveyor"). Holding the target still instead tilts the lens up by
      // ~1.5 degrees as the eye drops, which is both what a camera hidden
      // behind a desk monitor actually does and what leaves room above the
      // array for DP-W3's overhead belt.
      const HOME_POS = new THREE.Vector3(-4.97, 1.30, 0.20);
      const HOME_TGT = new THREE.Vector3(5.03, 1.568, -0.179);
      camera.position.copy(HOME_POS);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.copy(HOME_TGT);
      controls.update();
      // ★ The SCENE owns the camera tween, not the feedback panel. The tellies travel
      //   with it, which is why it had to come out of a dev-only module.
      flyer = createFlyTo({ camera, controls });

      if (DEV) {
        // Dynamic for the same reason as the feedback panel: a static import ships the
        // module into the app payload even though createFlyCam() is never reached there.
        // Everything that touches `fly` already guards on it, so a late arrival is safe.
        import('../../tools/flycam.js').then(({ createFlyCam }) => {
          fly = createFlyCam({ camera, controls });
          window.__fly = fly;
          writeHud();
        });
      } else {
        // The app entry has ONE declared camera (PLAN §3). No orbit, no pan, no zoom,
        // no fly — a telly click is the only travel there is.
        controls.enableRotate = controls.enablePan = controls.enableZoom = false;
      }

      homePose = { pos: HOME_POS, tgt: HOME_TGT };   // the TV toggle flies back here

      async function runBake() {
        bakeUI.style.display = 'block';
        // Overdrive the screens for the bake: a 0.3 m emitter is invisible to a
        // 1.6 m probe grid at display brightness. Restored in the finally.
        for (const m of screenMats) m.emissiveIntensity = TV_GLOW_BAKE;
        try {
        const r = await gi.bake({
          bounces: GI_BOUNCES,
          exclude: [],
          // ⚠ A bake is validity-then-bounces, and the validity pass carries NO
          // bounce/bounces. Interpolating them unconditionally printed
          // "baking light — bounce undefined/undefined" and computed a width of
          // "NaN%", which CSS rejects outright — so the bar sat dead for the whole
          // first pass and the text lied. Read pass/passes, which every phase
          // carries, and let the phase choose the words.
          onProgress: ({ done, total, phase, pass, passes, bounce, bounces }) => {
            const label = phase === 'validity'
              ? 'baking light — finding the walls'
              : `baking light — bounce ${bounce}/${bounces}`;
            const frac = (pass - 1 + done / total) / passes;
            // Never let a missing field reach CSS as "NaN%" again: an invalid width
            // is DISCARDED silently, so the bar simply stops moving and says nothing.
            const pct = Number.isFinite(frac) ? Math.max(0, Math.min(1, frac)) : 0;
            bakeTxt.textContent = label;
            bakeBar.style.width = `${(100 * pct).toFixed(1)}%`;
            loadUI.set(label, 0.85 + 0.15 * pct);
          },
        });
        bakeUI.style.display = 'none';
        gi.setIntensity(rig.visible ? RT_GI : 0);
        state.gi = `${gi.dims.x}x${gi.dims.y}x${gi.dims.z} (${r.probes}) ${r.ms}ms`;
        writeHud();
        } finally {
          for (const m of screenMats) m.emissiveIntensity = TV_GLOW;
        }
      }
      // Ship the volume next to the glb; ?gibake=1 forces a fresh one while dialling.
      async function loadOrBake() {
        loadUI.set('lighting the room…', 0.85);
        if (!GI_FORCE) {
          try {
            const res = await fetch('../../assets/dripping-pickle/gi_volume.bin');
            if (res.ok && gi.load(await res.arrayBuffer())) {
              gi.setIntensity(rig.visible ? RT_GI : 0);
              state.gi = `cached ${gi.dims.x}x${gi.dims.y}x${gi.dims.z}`;
              writeHud();
              return;
            }
          } catch { /* no cache yet — bake */ }
        }
        await runBake();
      }
      await loadOrBake();
      loadUI.set('', 1);
      loadUI.done();

      // ── the live half of the tier ────────────────────────────────────────────
      // Everything below is cheap to change at runtime, so it is the ladder the DEVICE
      // walks down on its own evidence rather than one this machine guesses for it.
      // There is no phone here and the browser pane cannot time a frame — three
      // instruments were tried and all three read nonsense (see the BUD2 handoff) — so a
      // preset signed off here would be a preset nobody measured.
      const VOL_STEPS = parseInt(q.get('volsteps') ?? '48', 10);
      perfTier = createPerfTier({
        forced: TIER_CLASS,   // the shell's word when it gives one (bridge v3), the guess otherwise
        pinned: TIER_PIN,
        start: TIER_START,
        // The console IS the evidence a device leg collects — the app entry draws no chrome
        // and the payload URL carries no query string, so there is nowhere to put a frame
        // counter. Two minutes of lines, then silence.
        // ★ AND A PLAIN console.log IS INVISIBLE ON A DEVICE. The shell's console under
        //   `devicectl --console` carries the NATIVE process's output; the Loop runs in a
        //   separate WebContent process whose console goes nowhere unless it is handed to
        //   the bridge. Measured on the first BUD2 leg: the phone opened, drew and held,
        //   and not one of the twelve fps lines reached the log — which reads as a broken
        //   reporter rather than a reporter shouting into a different room. `clv.log` is
        //   the only route out. Both, so the same line works in a browser and in the app.
        report: (r) => {
          // The cadence is the smoothness figure the gate is judged on (perf-tier.js header):
          // `3v:100%` is a steady 20, a mix of 2v and 3v with many jumps is an uneven ~24.
          const n = r.frames || 1;
          const cad = Object.entries(r.cadence || {}).sort()
            .map(([k, c]) => `${k}v:${+(100 * c / n).toFixed(1)}%`).join(' ');
          const line = `fps: ${r.fps} (p50 ${r.p50} ms, p95 ${r.p95}, worst ${r.worst}) ` +
                       `· cadence ${cad} · hitches ${r.hitches} jumps ${r.jumps} of ${r.frames} ` +
                       `· tier ${r.cls} level ${r.level} · ${r.sinceOpenSec}s in`;
          console.log(line);
          window.collectivus?.log?.(line);
        },
        // #142: a frame gap is logged the moment it happens, so a reported black flash can be
        // matched against the log — a flash with no gap behind it is the compositor's.
        onStall: (s) => {
          const line = `frame stall: ${s.ms} ms at ${s.atSec}s · level ${s.level}`;
          console.warn(line);
          window.collectivus?.log?.(line);
        },
        apply: (level) => {
          // ── the ladder, re-fitted against the device at BUD3 (2026-09-13) ──────────
          // Every number below is measured on the iPhone 12 Pro at the room pose against a
          // 146.8 ms baseline. The reasoning, and what the old rungs were spending a look
          // change for, is in tools/perf-tier.js's header.
          //
          // 1: hard shadows. 46.7 ms — 32% of the frame, the biggest single lever there is,
          //    and on a 693 px-wide frame the penumbra it gives up is close to invisible.
          PCSS.setTaps(level >= 1 ? { hard: 1 } : undefined);
          // 2: the AO at half resolution. 23.5 ms. ⚠ Through setAoHalfRes, never the flag:
          //    n8ao rebuilds its compositer on that change and throws away the room's
          //    floor/wall/prop split (docs/lessons/toggling-n8ao-halfres-destroys-the-composite-patch).
          setAoHalfRes(level >= 2);
          // 3: the shafts stop. 14.9 ms, and it is #4 of what carries the look, which is why
          //    it sits below two rungs that cost less to look at and save more.
          volPass.setSteps(VOL_STEPS);
          tierShafts = level < 3;
          syncVol();
          // ⚠ skyShadow is NOT a rung any more. Alone it is worth 25.6 ms; AFTER rung 1 it is
          //    worth about 2.7 — its shadow-map render, because hard shadows has already taken
          //    the taps for both lights. It flattens the grounding under the props for under 2%
          //    of the frame. The capability stays (a tier hides, it does not delete); it is
          //    simply not on the ladder.
          skyShadow.castShadow = RT_SKYSHADOW > 0;
          // 4-5: pixels. Rung 5 is automatic since 2026-09-13 — the flicker that got it refused
          //    was the film grain magnified by the upscale, fixed in tools/lens.js and signed on
          //    the device by the art director (flicker "gone", softness "acceptable").
          tierRenderScale = level >= 5 ? 0.5 : level >= 4 ? 0.75 : 1;
          if (renderScale !== tierRenderScale) applyRenderScale(tierRenderScale);
          if (level > 0) console.log(`perf tier: ${TIER_CLASS} at level ${level}`);
        },
      });
      window.__tier = perfTier;

      // ── the pass-attribution walk (BUD3) ─────────────────────────────────
      // Off unless asked for. `?perfwalk=1` in a browser; `window.__CLV_PERF_WALK` in a
      // payload, which tools/build-payload.sh injects when CLV_PERF_WALK=1 — because the
      // app entry has no query string and a device leg has nowhere else to put a switch.
      // Everything about WHY this shape is in tools/perf-walk.js's header.
      if (WALK_ON) {
        // ★ THERE IS NO PICTURE PROBE IN HERE, AND THAT IS THE SECOND DESIGN.
        //   The first read the canvas back four times a window so the walk could flag a state
        //   that silently does nothing. Two things killed it, both measured on this desk
        //   before any device saw it: a readback binds a framebuffer three has CACHED, so the
        //   next frame renders into the wrong target (the run went bimodal, p50 3.8 ms against
        //   p95 31.9 on the same window, and every probe came back different); and a
        //   synchronous readback is a GPU stall, which is the one thing a frame-time
        //   instrument must not add to the frame it is timing.
        //   So the question is split where it belongs. WHETHER a state moves the picture is a
        //   deterministic desk job — `node tools/walk-states-check.mjs`, which stops the frame
        //   loop, renders each state at a frozen t and compares pixels exactly. WHAT a state
        //   costs is a device job, and that is all this walk does.
        // Captured before anything touches it, so reset() restores what the art director set
        // rather than a constant typed here.
        const GRAIN_SHIPPED = lens.pass.uniforms.uGrain.value;

        // The full frame, as shipped. Every state is applied FROM this, and this runs
        // before each one — so a state that forgets to undo itself cannot leak forward.
        const resetAll = () => {
          applyRenderScale(1);
          if (aoPass) {
            aoPass.enabled = true;
            aoPass.configuration.denoiseSamples = 16;
            // ⚠ halfRes ALONE DOES NOT RESTORE ANYTHING. n8ao sizes its targets in setSize(),
            //   so putting the flag back leaves the pass on half-resolution buffers and every
            //   frame after it is quietly different — the baseline drifted 0.065 -> 3.40 and
            //   stayed there, which tools/walk-states-check.mjs found by interleaving a
            //   baseline after every state.
            setAoHalfRes(false);
          }
          // ⚠ THIS LINE IS THE ONE THE FIRST HEADLESS RUN WAS MISSING, and the interleaved
          //   baselines are what found it: after `ao+shafts-off` the composer's RenderPass
          //   stayed enabled, so the scene rendered TWICE for the rest of the walk and the
          //   baseline went 29.9 → 47.7 ms and never came back. Every state after it was
          //   priced against a frame that was 60% slower for a reason that had nothing to do
          //   with it. A reset that restores most of the frame is not a reset.
          if (aoPass) looks.renderPass.enabled = false;
          walkSkipBeauty = false;
          tierShafts = true; syncVol();
          volPass.setSteps(VOL_STEPS);
          sun.castShadow = true;
          skyShadow.castShadow = RT_SKYSHADOW > 0;
          PCSS.setTaps();
          gi.setCheap(0);
          gi.setIntensity(rig.visible ? RT_GI : 0);
          lens.pass.enabled = true;
          lens.pass.uniforms.uGrain.value = GRAIN_SHIPPED;
          lens.flarePass.enabled = true;
          smaaPass.enabled = true;
        };

        // Part A is the resolution curve and it goes FIRST — see perf-walk.js's header for
        // why (BUD2's own ladder implies two different per-pixel terms, which cannot both
        // be true). Part B is one pass at a time, subtracted from the full frame.
        const states = [
          // ★ EVERY STATE DECLARES WHAT IT CHANGES (`read`), and tools/walk-states-check.mjs
          //   asserts that value actually moved. The picture alone cannot do this job: the
          //   flare pass is DIRECTIONALLY GATED and contributes nothing at the room pose, so
          //   switching it off moves the picture by exactly 0 while still removing a
          //   full-screen pass from the frame — a legitimate cost probe that a picture test
          //   calls a broken state. Measured, not assumed: `flare-off` read 0.000.
          { id: 'null', note: 'control — changes nothing', set: () => {}, read: () => 'unchanged' },
          { id: 'res085', note: 'render scale 0.85', set: () => applyRenderScale(0.85), read: () => renderScale },
          { id: 'res075', note: 'render scale 0.75', set: () => applyRenderScale(0.75), read: () => renderScale },
          { id: 'res060', note: 'render scale 0.60', set: () => applyRenderScale(0.60), read: () => renderScale },
          { id: 'res050', note: 'render scale 0.50', set: () => applyRenderScale(0.50), read: () => renderScale },
          { id: 'res040', note: 'render scale 0.40', set: () => applyRenderScale(0.40), read: () => renderScale },

          { id: 'ao-half', note: 'n8ao at half resolution', set: () => setAoHalfRes(true),
            read: () => (aoPass ? aoPass.configuration.halfRes : null) },
          { id: 'ao-denoise1', note: 'n8ao denoise 16 -> 1 sample', set: () => { if (aoPass) aoPass.configuration.denoiseSamples = 1; },
            read: () => (aoPass ? aoPass.configuration.denoiseSamples : null) },
          // ⚠ The shafts march the BEAUTY target's depth, so the AO cannot be taken out
          //   without them. This state is therefore both, and the AO's own share is this
          //   number minus `shafts-off` — stated rather than implied, because a subtraction
          //   between two measured states is the only honest way to read it.
          { id: 'ao+shafts-off', note: 'no AO, no shafts (AO alone = this minus shafts-off)',
            set: () => { if (aoPass) aoPass.enabled = false; looks.renderPass.enabled = true;
                         walkSkipBeauty = true; tierShafts = false; syncVol(); },
            read: () => `${aoPass ? aoPass.enabled : null}/${looks.renderPass.enabled}/${walkSkipBeauty}/${volPass.enabled}` },
          { id: 'shafts-off', note: 'the raymarch off', set: () => { tierShafts = false; syncVol(); },
            read: () => volPass.enabled },
          { id: 'shafts-24', note: 'the raymarch at 24 steps', set: () => volPass.setSteps(24),
            read: () => volPass.material.defines.STEPS },

          { id: 'pcss-hard', note: 'hard shadows — no blocker search, no disc', set: () => PCSS.setTaps({ hard: 1 }),
            read: () => PCSS.pcssUniforms.pcssHard.value },
          { id: 'pcss-8-12', note: 'PCSS at 8 blocker / 12 filter taps', set: () => PCSS.setTaps({ blockerTaps: 8, pcfTaps: 12 }),
            read: () => `${PCSS.pcssUniforms.pcssBlockerN.value}/${PCSS.pcssUniforms.pcssPcfN.value}` },
          { id: 'sun-noshadow', note: 'the sun stops casting', set: () => { sun.castShadow = false; },
            read: () => sun.castShadow },
          { id: 'sky-noshadow', note: 'the second shadow light stops casting', set: () => { skyShadow.castShadow = false; },
            read: () => skyShadow.castShadow },

          { id: 'gi-cheap', note: 'GI trilinear — 4 reads a fragment, not 32', set: () => gi.setCheap(1),
            read: () => gi.uniforms.giCheap.value },
          { id: 'gi-off', note: 'GI intensity 0 (the fetches still happen)', set: () => gi.setIntensity(0),
            read: () => gi.uniforms.giIntensity.value },

          { id: 'lens-off', note: 'distortion, fringe, vignette, grain, letterbox', set: () => { lens.pass.enabled = false; },
            read: () => lens.pass.enabled },
          // ⚠ Gated OFF at the room pose (the flare only fires when the camera faces the sun),
          //   so this moves the picture by zero and still removes a full-screen pass.
          { id: 'flare-off', note: 'the flare pass — gated dark at this pose, still a pass', set: () => { lens.flarePass.enabled = false; },
            read: () => lens.flarePass.enabled },
          { id: 'smaa-off', note: 'edge smoothing', set: () => { smaaPass.enabled = false; },
            read: () => smaaPass.enabled },
          // Not a cost probe — the grain is nearly free. It is here because it is the first
          // suspect for the flicker that got rung 5 refused, and tools/flicker-check.mjs
          // drives this same list (BUD2 measured ?grain=0 and cleared it; this reproduces
          // that from inside the build rather than from a URL the payload cannot carry).
          { id: 'grain-off', note: 'film grain only', set: () => { lens.pass.uniforms.uGrain.value = 0; },
            read: () => lens.pass.uniforms.uGrain.value },

          // ── the look, held long enough to be judged ────────────────────────
          // ★ NOT COST PROBES. BUD2 measured rung 4 for about ten seconds in passing on its
          //   way to rung 5, so nobody could say whether 0.75x was shippable — and rung 5 was
          //   refused on a flicker that has since turned out to be the film grain magnified
          //   by the upscale, now compensated. These two hold for 45 seconds each, with the
          //   room LIVE, so the art director can look at them rather than at a number. They
          //   are last so that nothing after them is measured against a tired device.
          { id: 'look-rung4', note: 'THE LOOK: render scale 0.75, held 45 s — watch the picture',
            set: () => applyRenderScale(0.75), read: () => renderScale,
            warmMs: 3000, measureMs: 45000 },
          { id: 'look-rung5', note: 'THE LOOK: render scale 0.50, held 45 s — watch the bricks',
            set: () => applyRenderScale(0.5), read: () => renderScale,
            warmMs: 3000, measureMs: 45000 },
        ];

        // ── the COMBINATION walk (?perfwalk=2 / CLV_PERF_WALK=2) ──────────────
        // ★ WINDOW 1 PRICED EACH PASS ALONE, AND THE PARTS DO NOT ADD. Hard shadows removes
        //   the PCSS taps for BOTH lights, so "the second shadow light off" is worth 25.6 ms
        //   alone and about 2.7 after it; and switching the AO OFF saved 60.6 ms where
        //   half-res AO plus shafts-off add to 38.4, because it also skips a whole scene
        //   render. Arithmetic on window 1's table would have been a guess dressed as a
        //   measurement, so this walk measures the rungs AS THEY STACK, which is the only
        //   form the gate question comes in.
        //   The last three states are beyond what the art director authorised on 2026-09-13.
        //   They are measured, not shipped: they are what a Gate C answer costs.
        const rung = (n) => () => {
          PCSS.setTaps(n >= 1 ? { hard: 1 } : undefined);
          setAoHalfRes(n >= 2);
          tierShafts = n < 3; syncVol();
          applyRenderScale(n >= 5 ? 0.5 : n >= 4 ? 0.75 : 1);
        };
        const rungRead = () => `${PCSS.pcssUniforms.pcssHard.value}/` +
          `${aoPass ? aoPass.configuration.halfRes : null}/${volPass.enabled}/${renderScale}`;
        const comboStates = [
          { id: 'null', note: 'control — changes nothing', set: () => {}, read: () => 'unchanged' },
          { id: 'rung1', note: 'hard shadows', set: rung(1), read: rungRead },
          { id: 'rung2', note: '+ AO at half resolution', set: rung(2), read: rungRead },
          { id: 'rung3', note: '+ shafts off', set: rung(3), read: rungRead },
          { id: 'rung4', note: '+ render scale 0.75', set: rung(4), read: rungRead },
          { id: 'rung5', note: '+ render scale 0.50 — THE SHIPPING FLOOR', set: rung(5), read: rungRead },
          // Beyond the authorisation, for the Gate C question only.
          { id: 'x-gi', note: 'BEYOND AUTH: rung 5 + GI trilinear', 
            set: () => { rung(5)(); gi.setCheap(1); }, read: () => `${rungRead()}/${gi.uniforms.giCheap.value}` },
          { id: 'x-noao', note: 'BEYOND AUTH: rung 5, AO off entirely (skips a scene render)',
            set: () => { rung(5)(); if (aoPass) aoPass.enabled = false; looks.renderPass.enabled = true;
                         walkSkipBeauty = true; tierShafts = false; syncVol(); },
            read: () => `${aoPass ? aoPass.enabled : null}/${walkSkipBeauty}/${renderScale}` },
          { id: 'x-floor', note: 'BEYOND AUTH: everything off at 0.4 — the fixed-cost floor',
            set: () => { rung(5)(); gi.setCheap(1); if (aoPass) aoPass.enabled = false;
                         looks.renderPass.enabled = true; walkSkipBeauty = true;
                         tierShafts = false; syncVol(); sun.castShadow = false;
                         skyShadow.castShadow = false; smaaPass.enabled = false;
                         lens.pass.enabled = false; applyRenderScale(0.4); },
            read: () => `${sun.castShadow}/${smaaPass.enabled}/${renderScale}` },
          // Held long enough to be judged, at the rung the ladder will actually stop on.
          { id: 'look-shipping', note: 'THE LOOK: the full re-fitted ladder at rung 5, held 60 s',
            set: rung(5), read: rungRead, warmMs: 3000, measureMs: 60000 },
        ];

        // ── the FIXED-COST walk (?perfwalk=3 / CLV_PERF_WALK=3) — BUD4 ────────────
        // ★ BUD3 LEFT THE FRAME AT "46 ms FIXED + 101 ms PER-PIXEL" AND NOBODY HAD SPLIT THE
        //   FIXED HALF. It was attributed to "the scene render and the CPU behind it" by
        //   elimination. This walk splits it, FROM THE SHIPPING FLOOR (rung 5 — where the phone
        //   actually lands), in two independent ways:
        //   - every row carries the JavaScript time of each part of the frame loop (walkProf,
        //     below), so CPU and GPU can be read side by side instead of inferred;
        //   - states that take one thing out: the render entirely, the movers, the scene's
        //     contents, the shadow maps, the shading, the moving meshes, some pixels.
        //   W0 (2026-09-22, the shipping build) also showed the frame going ~43 -> ~59 ms p50
        //   once the cat was sent across the room, so the last state sends him and holds.
        const scnHidden = [];
        let walkCatSent = false;
        const hideScene = (keep) => {
          for (const o of scene.children) {
            if (o.isLight || o === camera || o === rig || (keep && keep(o)) || !o.visible) continue;
            o.visible = false; scnHidden.push(o);
          }
        };
        // Undoes every fixed-walk state. Part of EVERY reset the desk gate uses as well, or a
        // hidden scene would leak into the next capture (docs/lessons/
        // a-reset-that-restores-most-of-the-frame-is-not-a-reset).
        const clearFixed = () => {
          walkNoRender = false; walkFreeze = false; walkBasic = false; walkCatSent = false; walkOverride = null;
          frameCapMs = FRAME_CAP_FPS > 0 ? 1000 / FRAME_CAP_FPS : 0;
          kicks = 0; clearInterval(kickTimer);
          for (const o of recvOff) o.receiveShadow = true;
          recvOff.length = 0;
          for (const o of scnHidden) o.visible = true;
          scnHidden.length = 0;
        };
        const fixedReset = () => { resetAll(); clearFixed(); rung(5)(); };
        const f5 = (fn) => () => { rung(5)(); fn(); };
        const fixedStates = [
          { id: 'f-null', note: 'control at rung 5 — changes nothing', set: f5(() => {}), read: () => 'unchanged' },
          { id: 'f-norender', note: 'no render at all — the frame is the CPU and the compositor',
            set: f5(() => { walkNoRender = true; }), read: () => walkNoRender },
          { id: 'f-freeze', note: 'every mover frozen: cat, mouse, belt, chalk, events, audio',
            set: f5(() => { walkFreeze = true; }), read: () => walkFreeze },
          { id: 'f-empty', note: 'the scene emptied — only the post chain draws',
            set: f5(() => hideScene()), read: () => scnHidden.length },
          { id: 'f-noshadowmap', note: 'neither light renders a shadow map',
            set: f5(() => { sun.castShadow = false; skyShadow.castShadow = false; }),
            read: () => `${sun.castShadow}/${skyShadow.castShadow}` },
          { id: 'f-unlit', note: 'the beauty pass with one unlit material — draws and triangles stay',
            set: f5(() => { walkBasic = true; }), read: () => walkBasic },
          { id: 'f-res040', note: 'rung 5 content at render scale 0.40',
            set: f5(() => applyRenderScale(0.4)), read: () => renderScale },
          // Held long, because the cat's crossing is the thing the gate watches and a 4 s window
          // can land on him standing still.
          { id: 'f-cat-sent', note: 'the mouse pressed at the start — the cat sent across the room, held 20 s',
            // ⚠ read() is the TRIGGER'S OWN ANSWER, not "a trigger was attempted": the runner
            //   drops a press while the mouse's channel is held (docs/lessons/
            //   exclusive-drops-rather-than-queues), and a dropped press would price a parked cat.
            set: f5(() => { walkCatSent = !!window.__events?.trigger?.('mouse'); }),
            read: () => (walkCatSent ? 'sent' : 'not sent'), warmMs: 1000, measureMs: 20000 },
        ];
        // ── W1b (?perfwalk=4 / CLV_PERF_WALK=4): WHICH PART OF THE LIT SHADING ────────────
        // ★ W1 (2026-09-22, iPhone 12 Pro) answered the CPU question and opened this one. The
        //   phone's JavaScript is ~9 ms of a ~42 ms frame and the movers under 0.5 ms of it; the
        //   SAME 233 draws and 1.32 M triangles drawn with ONE UNLIT material run at a steady
        //   60 fps; and 0.5 -> 0.4 render scale buys 2.4 ms. So the lit shading is the cost and
        //   most of it does not scale with pixels. Three candidates, one state each:
        //   - per-pixel after all  -> f-tiny (0.2 scale) stays expensive only if it is NOT pixels
        //   - 127 heavy programs   -> f-onelit: ONE lit standard material for every mesh
        //   - vertex work          -> f-normals: one trivial program that still reads normals;
        //                             f-noproxies / f-nomeshes: half the geometry each way
