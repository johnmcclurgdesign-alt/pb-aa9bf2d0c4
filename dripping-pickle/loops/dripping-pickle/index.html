      l.visible = false;
      rig.add(l);
      skylights.push(l);
    }

    // Soft downward contact shadow the rect lights cannot cast. Off by default here —
    // the reference's shadowing is carried by GI + AO.
    const skyShadow = new THREE.DirectionalLight(0xcfe0f2, RT_SKYSHADOW);
    skyShadow.castShadow = RT_SKYSHADOW > 0;
    skyShadow.shadow.mapSize.set(TIER_SHADOW_MAP, TIER_SHADOW_MAP);
    rig.add(skyShadow, skyShadow.target);

    // ★ NO LONGER AN A/B — THIS IS THE COOL COUNTER-FILL, AND IT IS THE DIAL
    //   THAT ANSWERS "EVERYTHING PICKS UP THE RED OF THE BRICK" (2026-09-01).
    //   The room is red brick lit by amber pendants, and the GI volume faithfully
    //   bounces that brick onto everything else — so every surface, the cat
    //   included, drifted toward the same orange and the picture read as one
    //   colour. The fix is not less GI (that is the light that makes the room
    //   feel real); it is a small COOL ambient underneath it, so unlit surfaces
    //   settle at a neutral night blue instead of at brick. Its ground half used
    //   to be warm brown 0x6b5844, which was actively adding red to exactly the
    //   shadows that needed cooling.
    const bounce = new THREE.HemisphereLight(0xbcd2f0, 0x4d5560, RT_BOUNCE);
    rig.add(bounce);

    // IBL from the scene's own sky — for specular (the rusted beams, the glass), not fill.
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    const skyOnly = new THREE.Scene();
    skyOnly.add(new THREE.Mesh(sky.geometry, sky.material));
    // ★ fromScene defaults to far=100 and the dome radius is 400 — size the far plane
    // to the dome or the environment map renders empty and the dial multiplies zero.
    const envRT = pmrem.fromScene(skyOnly, 0.04, 0.1, 800);
    scene.environment = envRT.texture;
    scene.environmentIntensity = RT_ENVI;

    let gi = null;

    function setRigEnabled(on) {
      rig.visible = on;
      scene.environmentIntensity = on ? RT_ENVI : 0;
      if (gi) gi.setIntensity(on ? RT_GI : 0);
    }

    let camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 500);

    // ── the interaction framework (INT-001, DP-W8) ────────────────────────
    // The single arbiter for every press in the Loop; each subsystem registers
    // its own hotspots as it lands. tools/hotspots.js says why it is one module
    // and not four listeners.
    //
    // ★ BUILT HERE, OUTSIDE THE PROPS LOAD SCOPE, ON PURPOSE. `props.scene` is
    // local to its own try block, and this repo has now lost FOUR subsystems to
    // that exact shape — the event wiring, the cat's walkability grid, the mouse
    // and the cat's trot stride each threw a ReferenceError into that catch,
    // printed one warn, and left a room that looked perfect and did nothing.
    // A press is the most visible thing in the Loop; it does not go in there.
    //
    // ★ AND THE CAMERA IS PASSED AS A GETTER, not as the object. The glTF camera
    // REPLACES this placeholder on load (line ~1780), which is the same trap
    // GTAOPass and BokehPass were both caught by: a pass that captured the
    // placeholder computed everything from a camera that never moved.
    hotspots = createHotspots({
      THREE, canvas: renderer.domElement, camera: () => camera,
      // A reviewer dragging a transform gizmo is not aiming at anything.
      blocked: () => !!window.__fbk?.anyDragging?.(),
    });
    window.__hotspots = hotspots;

    // ── the aim marker: REMOVED at W9 (2026-09-24) ─────────────────────────
    // It was the soft ring drawn at a hovered spot's declared extent (INT-007 / #103), and it was
    // the first Canvas 2D call the Apple TV binding dies on. Josh on the device: "a 'glow clue' for
    // what is interactive spoils discovery … No glows on any surface", and "Canvas 2D is not
    // supported. There should be none in the Loop." Hover feedback is gone (tools/hotspots.js
    // setHover), so the ring had nothing left to answer for.

    // AO — n8ao since 2026-08-19 (art director's find). Three attempts at GTAO
    // all failed the same way: broad radii read as soup, tight radii inked
    // halos onto the wall behind every silhouette, and the ring where the
    // effect ends was always visible ("it stops then gets light again").
    // n8ao's accurate falloff feathers to nothing, so the whole GTAO apparatus
    // went with it: the floor split (ao-floor.js — factory loops still use
    // it), the radius/thickness pairing, and the aofrad/aothick/aoamt params.
    // `shade` now scales n8ao's intensity about AO_INTENSITY; `aorad` is the
    // n8ao radius in metres. gammaCorrection stays FALSE — the pass sits
    // mid-chain on linear HDR and OutputPass owns the transfer function;
    // n8ao's default true washes the whole frame out.
    const AO_INTENSITY = 3.0;
    let aoPass = null;
    // Re-applies the AO's floor/wall/prop composite patch. Declared out here because n8ao
    // rebuilds that material whenever halfRes changes, so the patch has to be re-appliable
    // from wherever halfRes is touched — see the ★ at its definition.
    let applyAoSplit = () => {};
    /** The only supported way to change the AO's resolution: the flag alone loses the split. */
    function setAoHalfRes(on) {
      if (!aoPass || aoPass.configuration.halfRes === !!on) return;
      aoPass.configuration.halfRes = !!on;
      applyAoSplit();
      const pr = renderer.getPixelRatio();
      aoPass.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
    }
    let beautyRT = null;   // the MSAA scene target n8ao composites from
    let renderScale = 1;   // adaptive AA supersample factor (see applyRenderScale)
    // The device tier's own render scale. Kept separate so a window resize restores what
    // the TIER chose rather than snapping back to 1 — the resize handler exists to undo
    // adaptAA's earned supersampling, and it must not undo a step-down as well.
    let tierRenderScale = 1;
    if (RT_AO) {
      try {
        aoPass = new N8AOPass(scene, camera, innerWidth, innerHeight);
        aoPass.configuration.aoRadius = parseFloat(q.get('aorad') ?? '1.2');
        // Falloff 4 (was 1.2): at 1.2 a desk slab 0.7 m over the floor pooled
        // hard-edged darkness across its whole footprint — an AO cast that read
        // as a fake shadow. Higher falloff fades distant occluders, so the
        // pool retreats to the contact points and cavities keep their depth.
        aoPass.configuration.distanceFalloff = parseFloat(q.get('aofall') ?? '4');
        aoPass.configuration.intensity = AO_INTENSITY * RT_SHADE;
        // Full-res: halfRes shows its upsample blocks as JAGGIES wherever a
        // bright edge meets a dark one — the TV screens against their bezels
        // were staircased ("the anti-aliasing disappeared"). MSAA was on the
        // whole time; the aliasing was the AO's, not the rasteriser's.
        aoPass.configuration.halfRes = false;
        aoPass.configuration.gammaCorrection = false;

        // ★ THE MARRIAGE: hardware MSAA + n8ao, via the README's own escape
        // hatch ("Using your own render target"). Left to itself the pass
        // renders the scene un-antialiased and no amount of SMAA at the end
        // recovers it ("AA much worse than before the N8AO pass"). Instead:
        // autoRenderBeauty off, and WE render the scene into its
        // beautyRenderTarget — built with 8x samples and a depth texture
        // (three resolves both on read). The frame loop does the render just
        // before the composer runs, inside the drift wrapper so the AO sees
        // the same drifted eye as everything else.
        {
          const pr2 = Math.min(devicePixelRatio, 2);
          const bw = Math.floor(innerWidth * pr2), bh = Math.floor(innerHeight * pr2);
          // 4x, not 8x (2026-08-19): at a 2560-wide window the 8x half-float
          // target's bandwidth was ~7 ms of steady frame cost and fed the
          // frame-pacing spikes alongside the 4096 shadow map. factory-rt
          // measured 4x as the step that fixes the edges; 8x was habit, not a
          // measured need. ?beautysamples= to A/B.
          const bt = new THREE.WebGLRenderTarget(bw, bh, {
            samples: parseInt(q.get('beautysamples') ?? String(TIER_BEAUTY_SAMPLES), 10),
            type: THREE.HalfFloatType });
          bt.depthTexture = new THREE.DepthTexture(bw, bh, THREE.UnsignedIntType);
          bt.depthTexture.format = THREE.DepthFormat;
          aoPass.beautyRenderTarget.dispose();
          aoPass.beautyRenderTarget = bt;
          aoPass.configuration.autoRenderBeauty = false;
          beautyRT = bt;
        }
        // Its blue-noise dither is SCREEN-fixed; under camera drift that grinds
        // against the moving image. A wider denoise erases the structure.
        aoPass.configuration.denoiseSamples = 16;
        aoPass.configuration.denoiseRadius = 12;

        // ── floor / wall split ──────────────────────────────────────────────
        // n8ao has ONE intensity, so the split patches its composite shader —
        // pinned-version territory like pcss.js: exact-string match against
        // n8ao@1.9.4, THROW on a miss, because a split that silently misses is
        // indistinguishable from a dial you have not found yet. The composite
        // reconstructs a NORMAL from depth right there, but its getWorldPos
        // only inverts the projection — the result is VIEW-space despite the
        // name, so up-ness needs the viewMatrixInv rotate (already a uniform).
        // intensity is an EXPONENT here (pow(ao, intensity)); the patch mixes
        // between the wall exponent and an independent floor exponent by
        // world up-ness, feathered over the same 0.70–0.92 band ao-floor used
        // so a ramp never draws a line across itself.
        // ★ THE SPLIT PATCH MUST BE RE-APPLIED WHENEVER halfRes CHANGES, AND NOTHING SAYS SO.
        //   n8ao's `configuration` is a Proxy: setting halfRes calls configureEffectCompositer(),
        //   which REBUILDS the composite material from source and throws this patch away — so the
        //   room silently loses its floor/wall/prop AO split and never gets it back. Measured by
        //   tools/walk-states-check.mjs: the baseline shifted 0.065 -> 3.40 the moment a state
        //   toggled halfRes, and stayed there. This is not only a walk problem — half-resolution
        //   AO is one of the phone-tier levers the art director authorised on 2026-09-13, so a
        //   tier that reached for it would have dropped the split on every phone, quietly.
        //   Hence: a function, called at construction AND after every halfRes change.
        applyAoSplit = () => {
          const splitMat = aoPass.effectCompositerQuad._mesh.material;
          const NEEDLE = 'float finalAo = pow(texel.r, intensity);';
          if (!splitMat.fragmentShader.includes(NEEDLE)) {
            throw new Error('n8ao floor split: composite shader mismatch — version moved, re-pin');
          }
          // Three channels: walls (intensity), up-facing (uFloorInt), and PROPS
          // (uPropInt) — a prop pixel is one whose scene depth matches the
          // props-only depth prepass. Props win over the up-ness mix, so a crate
          // lid answers to the prop dial, not the floor dial. The suggestion and
          // the reason are the art director's (2026-08-19): one dial for walls
          // and props meant grounding the wall junction always muddied the set
          // dressing.
          splitMat.fragmentShader = splitMat.fragmentShader
            .replace('uniform float intensity;',
                     'uniform float intensity;\n    uniform float uFloorInt;\n    uniform float uPropInt;\n    uniform sampler2D uPropsDepth;')
            .replace(NEEDLE,
              `vec3 splitN = computeNormal(getWorldPos(depth, vUv), vUv);
          float splitUp = smoothstep(0.70, 0.92, (viewMatrixInv * vec4(splitN, 0.0)).y);
          float propD = texture2D(uPropsDepth, vUv).x;
          // Compare LINEARISED, in metres. Raw depth is non-linear: a 5e-4 raw
          // epsilon is half a metre at 5 m out, which classified the floor IN
          // FRONT of a prop (prop visible just behind it along the ray) as prop
          // — the reported hard AO cast hugging the desk. 2 cm is a real match.
          float isProp = (propD < 1.0 && abs(linearize_depth(depth, near, far) - linearize_depth(propD, near, far)) < 0.02) ? 1.0 : 0.0;
          float splitEx = mix(mix(intensity, uFloorInt, splitUp), uPropInt, isProp);
          float finalAo = pow(texel.r, splitEx);`);
          splitMat.uniforms.uFloorInt = { value: AO_INTENSITY * RT_SHADEF };
          splitMat.uniforms.uPropInt = { value: AO_INTENSITY * RT_SHADEP };
          splitMat.uniforms.uPropsDepth = { value: propsDepthRT.depthTexture };
          splitMat.needsUpdate = true;
        };
        applyAoSplit();
      } catch (e) { console.warn('n8ao unavailable:', e); aoPass = null; }
    }

    // Raymarched shafts. The reference has NO god-rays, so the default density is a
    // whisper — enough that the air over the pool reads as air, not beams.
    // ?volmode=off still works from the URL; the panel row is gone — the Light rays
    // dial reaching zero says the same thing, and at zero the pass (and its whole
    // depth prepass) is actually switched off rather than marching an empty volume.
    let volMode = q.get('volmode') ?? 'ray';
    // ★ THE BEAUTY RENDER ALREADY WROTE THE DEPTH THE SHAFTS MARCH AGAINST. n8ao's
    //   beauty target carries a DepthTexture (three resolves the MSAA on read, which is
    //   how the AO itself reads it), so the separate depth prepass was re-rendering the
    //   whole room for a buffer that already existed: 207 scene draws on top of the 708
    //   shadow draws it also triggered. The semantics are not merely close, they are
    //   better — the prepass overrode side to DoubleSide, so the march stopped at
    //   back-facing geometry the camera can see straight through, while the beauty depth
    //   stops exactly where the picture stops. depthWrite:false objects (glass, sky,
    //   dust) are excluded by both, for the same reason: a beam must pass the panes.
    //   Fallback kept for ?ao=0, where there is no beauty target to read.
    if (!beautyRT) depthRT = makeDepthRT();
    const shaftDepth = beautyRT ? beautyRT.depthTexture : depthRT.depthTexture;
    const volPass = new VolumetricLightPass({
      depthTexture: shaftDepth,
      getCamera: () => camera,
      steps: parseInt(q.get('volsteps') ?? '48', 10),
      color: 0xfff0d8,
    });
    volPass.uniforms.uDensity.value = parseFloat(q.get('voldens') ?? '0.012');
    volPass.uniforms.uG.value = parseFloat(q.get('volg') ?? '0.72');
    let volsVisible = q.get('vol') !== '0';
    let rayOn = volPass.uniforms.uDensity.value > 0.0004;
    // The device tier can switch the shafts off without touching the dial or the URL, so
    // the panel still reads what the art director set and the tier is a separate gate.
    let tierShafts = true;
    let perfTier = null;
    // BUD3's attribution walk. Null unless ?perfwalk=1 / window.__CLV_PERF_WALK.
    let perfWalk = null;
    // Set only by that walk's `ao+shafts-off` state: with the AO pass disabled the composer's
    // own RenderPass draws the frame, and rendering the beauty target as well would price a
    // SECOND full scene draw as if it were the AO's.
    let walkSkipBeauty = false;
    // BUD4's fixed-cost walk (?perfwalk=3). Each is set by exactly one state and cleared by
    // the walk's reset: skip the render entirely (the frame is then the CPU and nothing
    // else), freeze every mover (the cat, the mouse, the belt, the chalk, the events, the
    // audio), and draw the beauty pass with one unlit material (the geometry and the draw
    // calls stay, the shading goes).
    let walkNoRender = false, walkFreeze = false, walkBasic = false;
    // W1b: the override material the beauty pass draws with, when one is set (null = the
    // scene's own materials). walkBasic stays as the W1 state's flag.
    let walkOverride = null;
    // W1c: a frame cap in ms (0 = none). The frame loop returns early on a vsync that comes
    // sooner than this after the last rendered frame, so the frame is held for whole refreshes.
    let frameCapMs = 0, lastRenderedAt = 0;
    // The SHIPPING cap. ?fpscap=<fps> overrides for an A/B; 0 = free-running.
    const FRAME_CAP_FPS = q.has('fpscap') ? parseFloat(q.get('fpscap')) : 0;
    if (FRAME_CAP_FPS > 0) frameCapMs = 1000 / FRAME_CAP_FPS;
    // The JavaScript time of each part of the frame loop, for the walk's cpu() reader. Null
    // unless a walk is running, so the shipping loop pays for none of the performance.now()s.
    let walkProf = null;
    const syncVol = () => { volPass.enabled = volsVisible && volMode === 'ray' && rayOn && tierShafts; };
    syncVol();
    const volProxy = {
      get visible() { return volsVisible; },
      set visible(on) { volsVisible = !!on; syncVol(); },
    };

    // ── lens ────────────────────────────────────────────────────────────────
    // Camera formats: focal length in real millimetres plus the lens character
    // (distortion, fringe, vignette, grain, letterbox) as one shader pass.
    // `lensHFov` overrides the Blender camera's fov; null = native. Default is
    // the 24 mm preset — the native 19 mm-equivalent read too tight for the room.
    let lensHFov = null;
    const lens = createLens({
      setHFov: (hf) => { lensHFov = hf; applyFov(); },
    });
    lens.setAspect(innerWidth / innerHeight);
    lens.setPromptCanvas(innerWidth, innerHeight, Math.min(devicePixelRatio, 2));

    // One "Lens flare" dial scales the FORMAT's flare/streak pair rather than setting
    // absolute numbers — a Doc 16mm stays streak-free and an Anamorphic stays streaky,
    // whatever the dial says. Re-applied on every format change or the preset wins.
    let formatId = q.get('format') ?? 'wide24';
    let flareMul = RT_FLAREX;
    function applyFlare() {
      const p = lens.formats.find((f) => f.id === formatId) || lens.formats[0];
      lens.setFlare((p.flare ?? 0) * flareMul);
      lens.setStreak((p.streak ?? 0) * flareMul);
    }
    // Apply the format BEFORE the panel exists: the preset writes vignette/grain/flare
    // uniforms, so applying it after createLooks would clobber any values a shared
    // settings URL just replayed through the dials.
    lens.apply(formatId);
    applyFlare();

    // Slow camera sway for the endless loop. Applied pre-render, restored post-render,
    // so OrbitControls and the flycam never see it (see tools/driftcam.js).
    const drift = createDriftCam({ getCamera: () => camera, amount: RT_DRIFT });
    window.__drift = drift;

    // Depth of field. Off until the aperture dial moves — it costs a depth
    // prepass of its own. Focus follows the orbit target every frame, so the
    // thing you are looking at is the thing in focus.
    const bokehPass = new BokehPass(scene, camera, {
      focus: 6, aperture: 0, maxblur: 0.012,
    });
    bokehPass.enabled = false;

    // ── measuring the building ──────────────────────────────────────────────
    // /glas/ not /glass/ — the prop packs name their glass in Dutch ('nyclock -
    // glas', n026), and the shorter stem matches both languages.
    const GLASS_RE  = /glas/i;
    // Glass and decals must not cast — panes acting as lids is what "the lighting is
    // broken" actually looks like, and a dirt decal stops the light the glass let in.
    const NOCAST_RE = /glas|decal/i;

    // A pane's OWN plane, not its bounding box — a pitched sheet's box lies about
    // position, size and aim all at once (this was n017 in the proof of concept).
    function planeOf(mesh, centre) {
      const nrm = mesh.geometry.attributes.normal;
      const n = new THREE.Vector3(), t = new THREE.Vector3();
      for (let i = 0; i < nrm.count; i++) n.add(t.fromBufferAttribute(nrm, i));
      n.applyMatrix3(new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld));
      if (n.lengthSq() < 1e-8) n.set(0, -1, 0);
      n.normalize();
      if (n.y > 0) n.negate();          // a roof light faces the room
      const up = Math.abs(n.y) > 0.999 ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
      const u = new THREE.Vector3().crossVectors(up, n).normalize();
      const v = new THREE.Vector3().crossVectors(n, u).normalize();
      const pos = mesh.geometry.attributes.position, p = new THREE.Vector3();
      let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
      for (let i = 0; i < pos.count; i++) {
        p.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld).sub(centre);
        uMin = Math.min(uMin, p.dot(u)); uMax = Math.max(uMax, p.dot(u));
        vMin = Math.min(vMin, p.dot(v)); vMax = Math.max(vMax, p.dot(v));
      }
      return { normal: n, uSize: uMax - uMin, vSize: vMax - vMin };
    }

    function measureApertures(root, box) {
      const panes = [];
      root.traverse((o) => {
        if (!o.isMesh) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        // Object name too — a roof light textured with a dirt decal has no glass
        // material at all, and missing it leaves that bay unlit.
        const isPane = mats.some((m) => GLASS_RE.test(m?.name || '')) || /WindowPanel/i.test(o.name);
        if (!isPane) return;
        const b = new THREE.Box3().setFromObject(o);
        const centre = b.getCenter(new THREE.Vector3());
        panes.push({ box: b, centre, plane: planeOf(o, centre) });
      });
      // Roof vs wall by HEIGHT — this roof is pitched, so "flat panes are thin in Y"
      // finds nothing. Wall windows feed the room through the GI volume instead.
      const yCut = box.min.y + (box.max.y - box.min.y) * 0.55;
      const roof = panes.filter((p) => p.centre.y > yCut);
      return { panes, roof };
    }

    let buildingBox = null;
    let apertures = { panes: [], roof: [] };

    function sunDirection(azDeg, elDeg) {
      const az = THREE.MathUtils.degToRad(azDeg), el = THREE.MathUtils.degToRad(elDeg);
      return new THREE.Vector3(
        -Math.cos(el) * Math.sin(az), -Math.sin(el), -Math.cos(el) * Math.cos(az)).normalize();
    }
    let sunAz = RT_SUN_AZ, sunEl = RT_SUN_EL;

    function aimSun() {
      if (!buildingBox) return;
      const dir = sunDirection(sunAz, sunEl);
      const c = buildingBox.getCenter(new THREE.Vector3());
      const r = buildingBox.getSize(new THREE.Vector3()).length() / 2;
      sun.position.copy(c).addScaledVector(dir, -r * 1.5);
      sun.target.position.copy(c);
      const cam = sun.shadow.camera;
      cam.left = -r; cam.right = r; cam.top = r; cam.bottom = -r;
      cam.near = 0.1; cam.far = r * 3;
      sun.shadow.bias = -SHADOW_BIAS_M / (cam.far - cam.near);
      cam.updateProjectionMatrix();
      // PCSS turns depth gaps into metres via the frustum box — refit the box,
      // retell the shader, or the penumbra maths is silently wrong.
      PCSS.configureFromLight(sun);
    }
    function setSunAngles(az, el) {
      if (az !== null) sunAz = az;
      if (el !== null) sunEl = el;
      aimSun();
    }
    function aimSkyShadow() {
      if (!buildingBox) return;
      const c = buildingBox.getCenter(new THREE.Vector3());
      const r = buildingBox.getSize(new THREE.Vector3()).length() / 2;
      skyShadow.position.copy(c).add(new THREE.Vector3(0.6, r * 1.5, 0.4));
      skyShadow.target.position.copy(c);
      const cam = skyShadow.shadow.camera;
      cam.left = -r; cam.right = r; cam.top = r; cam.bottom = -r;
      cam.near = 0.1; cam.far = r * 3;
      skyShadow.shadow.bias = -SHADOW_BIAS_M / (cam.far - cam.near);
      skyShadow.shadow.normalBias = sun.shadow.normalBias;
      cam.updateProjectionMatrix();
    }

    // ── looks panel ─────────────────────────────────────────────────────────
    // The panel is consumer-facing since 2026-08-18: five groups, art dials only.
    // Everything that left it was rig CALIBRATION, not art direction — sun angles and
    // size (they invalidate the GI bake and the whole grade), skylight shadow, the AO
    // radii, GI bias / in-room threshold, sky IBL, fringe / distortion (the Lens
    // presets own those). Every one still answers to its URL param at boot, so a
    // calibration session is a link away — the panel just stops offering reviewers
    // dials that break the rig.
    // Held rather than constructed inline: BUD3's attribution walk switches it off for one
    // window to price edge smoothing, and a pass you cannot name is a pass you cannot price.
    const smaaPass = new SMAAPass(innerWidth, innerHeight);
    const looks = createLooks({
      renderer, scene, getCamera: () => camera,
      initial: q.get('look') || 'original',
      // The composer is NOT optional — createLooks owns the post chain, the MSAA
      // target and the SMAA pass. Only its PANEL is dev chrome.
      menu: DEV && q.get('looks') !== '0',
      // ★ n8ao FIRST — it REPLACES the render (the pass draws the scene itself;
      // README: 'N8AOPass replaces RenderPass'). It sat mid-chain after the
      // shafts at first, which threw away both the MSAA'd render AND the
      // composited shafts, and read as 'I don't see any AA'. The RenderPass is
      // disabled below when the AO owns the frame.
      extraPasses: [...(aoPass ? [aoPass] : []), volPass, bokehPass, lens.flarePass, lens.pass],
      // SMAA at the very end, on the tone-mapped image — n8ao's own scene
      // render bypasses hardware MSAA entirely, so with AO on, edge smoothing
      // has to be post (the n8ao README is explicit about exactly this).
      finalPasses: [smaaPass],
      // MSAA only matters when the AO is OFF (then the RenderPass draws the
      // frame and hardware AA works); with n8ao on it is pure wasted bandwidth.
      msaa: parseInt(q.get('msaa') ?? (RT_AO ? '0' : '8'), 10),
      volumetrics: [volProxy],
      volumetricsOn: q.get('vol') !== '0',
      tone: false,   // ACES is the show; ?tone= still works for A/Bs
      exposure: { group: 'light', label: 'Brightness' },
      groups: [
        { id: 'style',  label: 'Style',      icon: 'style' },
        { id: 'light',  label: 'Light',      icon: 'light' },
        { id: 'air',    label: 'Atmosphere', icon: 'atmosphere' },
        { id: 'camera', label: 'Camera',     icon: 'camera' },
        { id: 'finish', label: 'Finish',     icon: 'finish' },
      ],
      dials: [
        // ── Light ──
        { id: 'sun', label: 'Sunlight', group: 'light', min: 0, max: 8, curve: 1.6, value: RT_SUN,
          onInput: (v) => { sun.intensity = v; } },
        // PCSS penumbra — the apparent size of the sun. Back on the panel by
        // request (2026-08-19): softening the pool on the floor is art
        // direction, not calibration. Same id as the old URL key.
        { id: 'sunang', label: 'Sun softness', group: 'light', min: 0.002, max: 0.16, curve: 1.8,
          value: RT_SUNANG, onInput: (v) => PCSS.setSunAngle(v) },
        { id: 'skyl', label: 'Skylight', group: 'light', min: 0, max: 8, curve: 1.6, value: RT_SKYL,
          onInput: (v) => { for (const l of skylights) if (l.visible) l.intensity = v; } },
        { id: 'gi', label: 'Bounce light', group: 'light', min: 0, max: 4, curve: 1.4, value: RT_GI,
          onInput: (v) => { if (gi && rig.visible) gi.setIntensity(v); } },
        // Walls-only share of the bounce (per-material giGain) — the volume
        // over-lights big flat walls against the path-traced reference, and the
        // lift reads as sheen. 1.0 = same as everything else.
        { id: 'giwall', label: 'Bounce walls', group: 'light', min: 0, max: 1.5, value: RT_GIWALL,
          onInput: (v) => { for (const g of wallGiGains) g.value = v; } },
        // ONE dial for the AO pair — scales the wall and floor amounts together about
        // their fitted values. The radii are calibration and stay on URL params.
        // The AO split: walls-and-props vs up-facing surfaces (floor, table
        // tops — "floor" is a world normal, not a list of objects).
        { id: 'shade', label: 'Contact walls', group: 'light', min: 0, max: 2, value: RT_SHADE,
          onInput: (v) => {
            if (aoPass) aoPass.configuration.intensity = AO_INTENSITY * v;
          } },
        { id: 'shadef', label: 'Contact floor', group: 'light', min: 0, max: 2, value: RT_SHADEF,
          onInput: (v) => {
            if (aoPass) aoPass.effectCompositerQuad._mesh.material.uniforms.uFloorInt.value = AO_INTENSITY * v;
          } },
        { id: 'shadep', label: 'Contact props', group: 'light', min: 0, max: 2, value: RT_SHADEP,
          onInput: (v) => {
            if (aoPass) aoPass.effectCompositerQuad._mesh.material.uniforms.uPropInt.value = AO_INTENSITY * v;
          } },
        // ── Atmosphere ──
        { id: 'voldens', label: 'Light rays', group: 'air', volTied: true,
          min: 0, max: 0.4, curve: 2.2, value: volPass.uniforms.uDensity.value,
          onInput: (v) => { volPass.uniforms.uDensity.value = v; rayOn = v > 0.0004; syncVol(); } },
        // ── Camera ──
        { id: 'mm', label: 'Focal length', group: 'camera', min: 12, max: 100, curve: 1.8, value: 24,
          onInput: (v) => lens.setFocal(v) },
        // three's BokehPass aperture works in tiny units; 0 disables the pass
        { id: 'dof', label: 'Focus blur', group: 'camera', min: 0, max: 0.0004, curve: 2.0, value: 0,
          onInput: (v) => {
            bokehPass.enabled = v > 0.000004;
            bokehPass.uniforms.aperture.value = v;
          } },
        { id: 'drift', label: 'Drift', group: 'camera', min: 0, max: 1, value: RT_DRIFT,
          onInput: (v) => drift.setAmount(v) },
        // ── Finish ──
        { id: 'vig', label: 'Vignette', group: 'finish', min: 0, max: 0.6, value: 0.22,
          onInput: (v) => { lens.pass.uniforms.uVignette.value = v; } },
        { id: 'grain', label: 'Film grain', group: 'finish', min: 0, max: 0.15, curve: 1.6, value: 0.035,
          onInput: (v) => { lens.pass.uniforms.uGrain.value = v; } },
        { id: 'flarex', label: 'Lens flare', group: 'finish', min: 0, max: 2, value: RT_FLAREX,
          onInput: (v) => { flareMul = v; applyFlare(); } },
        // ── Sound (DP-W7) ──
        // Master only on the consumer panel — a reviewer needs to be able to turn it down, and
        // nothing else here is an art dial. The four BUS trims are calibration and live under
        // ?dev=1, exactly like the AO radii and the GI bias: a mix note is one number per family,
        // and the settled values belong in the slot table, not in whatever a reviewer left behind.
        { id: 'vol', label: 'Volume', group: 'finish', min: 0, max: 1.5, value: parseFloat(q.get('vol') ?? '1'),
          onInput: (v) => audio?.setVolume(v) },
        ...(DEV ? [{ id: 'reverb', label: 'Room tail', group: 'finish', min: 0, max: 2, value: parseFloat(q.get('reverb') ?? '1'),
                     onInput: (v) => audio?.setReverb(v) }] : []),
        ...(DEV ? Object.keys(BUS_LABELS).map((b) => ({
          id: `mix${b}`, label: BUS_LABELS[b], group: 'finish', min: 0, max: 1.6,
          value: parseFloat(q.get(`mix${b}`) ?? String(AUDIO_BUSES[b])),
          onInput: (v) => audio?.setBus(b, v),
        })) : []),
      ],
      choices: [
        { id: 'format', label: 'Lens', group: 'camera', value: formatId,
          options: lens.formats.map((f) => ({ label: f.label, value: f.id })),
          onChange: (v) => { formatId = v; lens.apply(v); applyFlare(); } },
      ],
    });
    window.__lens = lens;   // scripted checks — flare thresholds cannot be eyeballed
    window.__looks = looks;
    // n8ao owns the frame: the RenderPass would draw the whole scene a second
    // time only to be overwritten. Off when the AO is on.
    if (aoPass) looks.renderPass.enabled = false;
    camera.position.set(-10, 1.5, 4);

    let controls = null, fly = null, flyer = null;
    const state = { meshes: 0, tris: 0, noCast: 0, cam: 'default', gi: 'off' };

    // Preserve the Blender camera's HORIZONTAL fov across canvas shapes.
    let hFov = null;
    function applyFov() {
      camera.aspect = innerWidth / innerHeight;
      const hf = lensHFov ?? hFov;   // lens preset wins; null falls back to the Blender cam
      if (hf) {
        camera.fov = THREE.MathUtils.radToDeg(
          2 * Math.atan(Math.tan(hf / 2) / camera.aspect));
      }
      camera.updateProjectionMatrix();
    }

    // ── load ────────────────────────────────────────────────────────────────
    const hud = document.getElementById('hud');
    const bakeUI = document.getElementById('bake');
    const bakeTxt = document.getElementById('baketxt');
    const bakeBar = document.querySelector('#bakebar > i');
    const litMaterials = new Set();
    const wallGiGains = [];   // the wall materials' per-material GI gain uniforms

    // ── loading screen ────────────────────────────────────────────────────
    // One opaque cover from first paint until the room is COMPLETE — building,
    // props, GI — plus a few rendered frames, so shader compilation happens
    // behind it and the reveal is the finished image. The bar is honest but
    // coarse: 0-70% building download, then props, then lighting.
    const loadEl = document.getElementById('load');
    const loadUI = {
      txt: document.getElementById('loadtxt'),
      bar: document.querySelector('#loadbar > i'),
      set(text, frac) {
        if (text) this.txt.textContent = text;
        if (frac != null) this.bar.style.width = (100 * Math.min(1, frac)).toFixed(1) + '%';
      },
      fail(text) { this.txt.textContent = text; this.bar.style.background = '#e0604f'; },
      done() {
        // two frames through the real frame loop before the fade starts —
        // the first one pays any remaining shader compiles at full cover
        let n = 0;
        const tick = () => {
          if (++n < 3) { requestAnimationFrame(tick); return; }
          loadEl.style.opacity = '0';
          clvBridge?.ready();   // the app is told only now — a finished room, frames presented
          setTimeout(() => loadEl.remove(), 900);
          // TEX1: which compressed formats the Basis textures LANDED as, once, on the device log.
          // The transcoder picks per face — ASTC 4x4 on iOS, BC7 or ETC on the Mac face that ships
          // (which has no ASTC, #145) — and the ETC1 path measures far lower (18.8 dB worst) than
          // BC7, so a device leg has to be able to say which one it saw.
          try {
            const fmt = {}, seen = new Set(), n = {};
            for (const [k, v] of Object.entries(THREE)) if (/_Format$/.test(k) && typeof v === 'number' && !(v in fmt)) fmt[v] = k.slice(0, -7);
            scene.traverse((o) => { for (const m of [o.material].flat()) if (m) for (const t of Object.values(m)) {
              if (t?.isCompressedTexture && !seen.has(t)) { seen.add(t); const k = fmt[t.format] ?? t.format; n[k] = (n[k] || 0) + 1; }
            } });
            const gl = renderer.getContext();
            const line = `textures: ${Object.entries(n).map(([k, c]) => `${k} ×${c}`).join(', ') || 'none compressed'}`
              + ` · astc ${gl.getExtension('WEBGL_compressed_texture_astc') ? 'yes' : 'NO'}`
              + ` · bptc ${gl.getExtension('EXT_texture_compression_bptc') ? 'yes' : 'no'}`
              + ` · etc ${gl.getExtension('WEBGL_compressed_texture_etc') ? 'yes' : 'no'}`;
            console.log(line); window.collectivus?.log?.(line);
          } catch {}
        };
        requestAnimationFrame(tick);
      },
    };

    // ★ NO DRACO, AND THAT IS A PLATFORM CONSTRAINT, NOT A PREFERENCE (BUD1, 2026-09-10).
    // Both glbs used to be Draco-compressed. The Apple TV binding has no `Worker`, no
    // `Blob` and no `WebAssembly`, and three's DRACOLoader decodes in a Worker built
    // from a Blob — so a Draco payload cannot be read there at all. Worse, from three
    // r0.185 `DRACOLoader.js` evaluates `new URL(..., import.meta.url)` at MODULE
    // SCOPE, and the binding has no `URL` global, so merely IMPORTING it kills the
    // entry module before this Loop's own code runs. Our pinned r0.169.0 does not do
    // that yet; the import is gone so a PINS bump cannot quietly reintroduce it.
    // Geometry ships uncompressed (tools/condition-glb.sh asserts it, and the assert is
    // inverted from what it used to be: shipping Draco is now the defect).

    // KTX2. Registered UNCONDITIONALLY, before any asset uses it: a glb
    // carrying KHR_texture_basisu fails to load outright without this loader, and
    // the failure reads as a corrupt asset rather than a missing decoder. It is
    // inert on glbs that do not use the extension, so the two halves can land in
    // either order — but only if this one is never conditional.
    //
    // detectSupport() needs the renderer, which is why this sits here and not at
    // module top: it asks the live context which compressed formats exist, and the
    // Basis (UASTC) textures transcode to that — ASTC 4x4 on an iPhone or iPad, BC7
    // or ETC on the Mac face that ships, BC7 on a desktop — staying compressed in GPU
    // memory instead of decoding to RGBA8, which is the entire point.
    // ⚠ Do NOT assume Apple hardware answers ASTC. The Designed-for-iPad Mac face has
    // none, and the hard-ASTC cook this replaced drew the room unlit there (#145).
    // TEX1 re-cooked it; tools/assert-mac-face.mjs holds it.
    const ktx2 = new KTX2Loader()
      .setTranscoderPath("../../vendor/three/examples/jsm/libs/basis/")
      .detectSupport(renderer);

    const gltfLoader = new GLTFLoader().setKTX2Loader(ktx2);

    // ── the baked text (TV1, 2026-10-06) ─────────────────────────────────────────
    // Text the Loop used to draw into 2D canvases at load is baked offline now by
    // tools/bake-text.mjs (the Apple TV binding has no Canvas 2D): the ZOOM control's two
    // labels and the eight jar labels. Both are ordinary Basis KTX2 through the same loader
    // as every other texture, so the TV cook transcodes them like the rest. A sheet that
    // fails to load costs that text and nothing else — the control stays sized but clear,
    // the labels plain paper — and never the room.
    const loadTextSheet = (file) => ktx2.loadAsync('../../assets/dripping-pickle/text/' + file)
      .catch((e) => { console.warn('text sheet', file, 'did not load:', e?.message ?? e); return null; });
    loadTextSheet('zoom-labels.ktx2').then((t) => lens.setPromptSheet(t));
    const jarLabelSheet = loadTextSheet('jar-labels.ktx2');
    // The one GL text path (tools/gl-text.js, tools/gl-page.js): the screens' pages and the
    // chalkboard's message are drawn with it, once per change, into render targets. The glyph
    // atlas is shared by all of them; until it arrives it is a 1x1 "nothing here", and when it
    // does every page that already drew text draws again, once.
    const glyphAtlas = { value: new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1) };
    glyphAtlas.value.needsUpdate = true;
    const glPainter = createGLPainter({ THREE, renderer, atlas: glyphAtlas });
    loadTextSheet('phosphor-sdf.ktx2').then((t) => {
      if (!t) return;
      glyphAtlas.value = t;
      glPainter.redrawAll();
    });

    gltfLoader.load('../../assets/dripping-pickle/structure.glb', async (gltf) => {
      let tris = 0, meshes = 0, noCast = 0;

      gltf.scene.traverse((o) => {
        if (o.isCamera) {
          camera = o;
          const vfov = THREE.MathUtils.degToRad(camera.fov);
          hFov = 2 * Math.atan(Math.tan(vfov / 2) * (camera.aspect || (16 / 9)));
          camera.near = 0.05; camera.far = 500;
          applyFov();
          state.cam = o.name;
          if (aoPass) aoPass.camera = camera; // extra passes hold their own reference
          bokehPass.camera = camera;          // same trap, same fix
        }
        if (!o.isMesh) return;
        meshes++;
        const idx = o.geometry.index;
        tris += (idx ? idx.count : o.geometry.attributes.position.count) / 3;

        const mats = Array.isArray(o.material) ? o.material : [o.material];
        const blocks = mats.some((m) => m && NOCAST_RE.test(m.name || ''));
        o.castShadow = !blocks;
        o.receiveShadow = true;
        if (blocks) noCast++;

        for (const m of mats) {
          if (!m) continue;
          // Only real glass blends; anything else flagged transparent would sort
          // against itself and punch holes.
          if (m.transparent) {
            if (GLASS_RE.test(m.name || '')) {
              m.depthWrite = false;
              if (m.opacity === 1) m.opacity = 0.22;
            } else {
              m.transparent = false;
              m.depthWrite = true;
            }
          }
          if (/decal/i.test(m.name || '') && m.map) {
            m.transparent = true;
            m.depthWrite = false;
          }
          // The hero (mural) wall carries a BAKED AO map — ray-traced in
          // Blender with the props standing as occluders, on the dedicated
          // non-overlapping MuralUV layer (TEXCOORD_2 → channel 2). External
          // texture, so flipY must be false and the space linear; re-bake it
          // whenever the props against that wall move.
          if (m.name === 'M_Brick_Mural_60' && !m.aoMap) {
            // ★ KTX2, NOT WebP (BUD1, 2026-09-10). At 2048x2048 this one texture decoded to
            //   21.3 MB resident — 22% of the whole budget after the glbs were conditioned, and
            //   the largest single item in the Loop. As ASTC 6x6 it is 2.4 MB at the SAME
            //   resolution. It is loaded through the KTX2Loader the GLTFLoader already carries.
            //   ⚠ AO is DATA: the file is UNORM with a linear transfer function, and the texture
            //   must stay NoColorSpace. An sRGB encode bends the occlusion curve and reads as
            //   the wall being dirtier in the midtones — plausible, and wrong.
            //   ⚠ flipY is ignored for a compressed texture (there is nothing to flip in a block
            //   stream) and KTX2Loader sets it false itself; the bake is already authored for it.
            ktx2.load('../../assets/dripping-pickle/mural_ao.ktx2', (aoTex) => {
              aoTex.colorSpace = THREE.NoColorSpace;
              aoTex.channel = 2;
              aoTex.anisotropy = MAX_ANISOTROPY;
              m.aoMap = aoTex;
              m.aoMapIntensity = parseFloat(q.get('muralao') ?? '1');
              m.needsUpdate = true;
            }, undefined, (e) => console.warn('mural AO failed to load:', e));
          }
          // Inside the room we face the back of every wall.
          m.side = THREE.DoubleSide;
          // ★ KEEP the roughness/metallic/normal maps — this export ships real ones.
          if (m.isMeshStandardMaterial) litMaterials.add(m);
          for (const tex of [m.map, m.normalMap, m.roughnessMap, m.metalnessMap,
                             m.aoMap, m.emissiveMap, m.alphaMap]) {
            if (tex) { tex.anisotropy = MAX_ANISOTROPY; tex.needsUpdate = true; }
          }
          m.needsUpdate = true;
        }
      });

      // Both glTF roots live under ONE group so the feedback panel can pick
      // props as well as the building (pickRoot below). Structure is child 0,
      // props child 1 — stored edits are keyed by node path, so the add order
      // is a contract, not a style choice.
      const pickables = new THREE.Group();
      pickables.name = 'Pickables';
      scene.add(pickables);
      pickables.add(gltf.scene);
      state.meshes = meshes; state.tris = tris; state.noCast = noCast;

      // camera arrives parented; free it so controls own it cleanly
      if (camera.parent && camera.parent !== scene) scene.attach(camera);

      // ── props ─────────────────────────────────────────────────────────────
      // Separate file so set dressing iterates without re-exporting the building.
      // Loaded BEFORE the GI bake: they occlude bounce and sit in it like the walls do.
      loadUI.set('setting the props…', 0.75);
      try {
        const props = await new Promise((res, rej) =>
          gltfLoader.load('../../assets/dripping-pickle/props.glb', res, undefined, rej));
        // One dressing pass, shared by props.glb and any increment glb below.
        const dressProp = (o) => {
          if (!o.isMesh) return;
          // Layer 1 marks "prop" for the AO's third channel — but rugs and
          // carpets lie flat ON the floor and read as floor, so they stay off
          // the layer and answer to the Contact floor dial instead (n030).
          if (!/carpet|rug/i.test(o.name)) o.layers.enable(1);
          o.castShadow = true;
          o.receiveShadow = true;
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of mats) {
            if (!m) continue;
            // The TV screens — live antenna static (see the TV wall block up
            // top). One shared texture: the first screen builds it, the rest
            // point at it, so the whole wall costs one canvas + one upload.
            if (m.name === 'Screen_Glow' && !screenMats.has(m)) {
              if (m.emissiveMap && m.emissiveMap.image) {
                if (!tvStaticTex) tvStaticTex = makeTVStatic(m.emissiveMap);
                m.emissiveMap = tvStaticTex;
              }
              m.emissive.copy(TV_GREEN);
              m.emissiveIntensity = TV_GLOW;
              screenMats.add(m);
              // SCR-002 on the static fallback too — the treatment belongs to
              // the DEVICE, not to what is playing on it, so ?tvvideo=0 must
              // not hand back three identical rectangles. This path samples the
              // shared atlas directly (no texture transform), so it needs the
              // real UV window; the video path passes the identity instead.
              treatStaticScreen(o, m);
            }
            if (GLASS_RE.test(m.name || '')) {
              // Pack glass often loses its transmission on export and lands as
              // an OPAQUE metal-rough disc (the caged clock, n026 — it hid the
              // face and hands entirely). Rebuild it as the house glass.
              m.transparent = true;
              m.opacity = 0.18;
              m.depthWrite = false;
              m.roughness = 0.12;
              m.metalness = 0;
              o.castShadow = false;   // a glass pane acting as a lid, prop-sized
            } else if (m.transparent) {
              // carpet hair cards etc. — cut-outs, not blenders
              m.transparent = false;
              m.alphaTest = m.map ? 0.4 : 0;
              m.depthWrite = true;
            }
            if (m.isMeshStandardMaterial) litMaterials.add(m);
            for (const tex of [m.map, m.normalMap, m.roughnessMap, m.metalnessMap]) {
              if (tex) { tex.anisotropy = MAX_ANISOTROPY; tex.needsUpdate = true; }
            }
            m.needsUpdate = true;
          }
          // after the material pass, so the video clone inherits the finished setup
          if (TV_VIDEO && (TV_VIDEO_MESH === 'all'
              ? mats.some((m) => m && m.name === 'Screen_Glow')
              : o.name === TV_VIDEO_MESH)) playVideoOnScreen(o);
          state.meshes++;
        };
        props.scene.traverse(dressProp);
        pickables.add(props.scene);
        state.props = true;

        // Set-dressing INCREMENTS ship as their own small glbs — adding one
        // prop must never force a re-export of the 69 verified ones.
        // props_lamp.glb: the floor lamp — an ORIGINAL since ART2 (2026-10-06, #75),
        // built by tools/blender-build-floor-lamp.py and exported by
        // tools/blender-export-lamp.py: 5.6k tris, four materials, no textures,
        // 131 KB. It replaced a lamp of unknown origin (the 2026-08-19 one) at the
        // same spot and size. The shade is still found by the material name 'glas'.
        let floorLampShade = null;
        try {
          const extra = await new Promise((res, rej) =>
            gltfLoader.load('../../assets/dripping-pickle/props_lamp.glb', res, undefined, rej));
          extra.scene.traverse(dressProp);
          extra.scene.traverse((c) => {
            if (floorLampShade || !c.isMesh) return;
            const ms = Array.isArray(c.material) ? c.material : [c.material];
            if (ms.some((m) => m && m.name === 'glas')) floorLampShade = c;
          });
          pickables.add(extra.scene);
        } catch (e) { console.warn('props_lamp.glb not loaded:', e); }

        if (TV_FOCUS) tvUX = initTVFocus(props.scene);
        if (tvUX) {
          // Gate A 2.1's SCREEN state, as a hotspot. The behaviour is unchanged:
          // press a telly and the camera pushes in on the whole array; press
          // anything else while pushed in and it returns.
          hotspots.register({
            id: 'screen_array',
            objects: () => tvUX.allMeshes,
            // The panel under a tube belongs to the CRT dial (INT-003), which registers its own
            // spot over the same cabinet meshes. The predicate is installed by that block.
            accept: (hit) => !screenArrayExclude || !screenArrayExclude(hit),
            hover: (on, hit) => tvUX.setHover(on ? (hit ? tvUX.byMesh.get(hit.object) : tvUX.units[1]) : null),
            pulse: (on) => tvUX.glowAll(on),
            // ★ A TELLY ZOOMS IN, AND ONLY ON A DIRECT HIT (Josh, W9 device leg, 2026-09-24):
            //   "Zoom should be via control or camera change in settings or a TV selection (zoom
            //   in) only." Two defects made near misses toggle the view on the phone. (1) The
            //   array's extent is the bounding sphere of all three sets, which the assist turned
            //   into a 184 px capture disc on a 219 px-tall phone frame — every press that missed
            //   a jar was pulled to the array. `assist: false`: the tellies are big enough to hit.
            //   (2) The press toggled in BOTH views, so pressed in, a telly zoomed back out. Out
            //   is the drawn control's job and the shell's Cameras list; pushed in, a telly press
            //   does nothing and falls through to the ordinary miss pulse.
            assist: false,
            press: () => { if (tvUX.focused) return false; tvUX.setView('screens'); return true; },
          });
          // ── the view toggle (Gate A 2.3, amended 2026-09-11) ──────────────
          // ★ AN EMPTY PRESS NO LONGER MOVES THE CAMERA, AT ALL. DP-W8 had already narrowed
          // "tapping anywhere outside the array returns" to "anywhere genuinely clear of a
          // target", because pushed in there are four live targets in frame and every near
          // miss threw the viewer out of the pose they were in. On a phone even the narrowed
          // rule failed completely: the shell hands the Loop a 750x370 frame, so the targets
          // are a few pixels across and the clear band is most of the picture. Josh, BUD2's
          // device leg: "tapping anything just toggles the camera back and forth."
          //
          // The rule is gone rather than re-tuned, because the thing it was standing in for
          // now exists: ROOM and SCREEN are DECLARED CAMERAS (`room`, `screens`), so the view
          // changes three ways and all three are deliberate — the shell's own Cameras list,
          // pressing a telly, and this control, which is on screen in BOTH views and never
          // fades away. An empty press does what every other empty press in this Loop does:
          // it pulses what IS pressable. `hotspots.onMiss` is not registered here any more.
          hotspots.register({
            id: 'view_toggle',
            // Drawn in the lens pass, so it has no geometry — and its rect is READ
            // from that pass rather than typed, because the letterbox band moves
            // with the Format preset and its size with the canvas.
            screen: () => lens.promptRect(),
            // #103. A screen-space control has no world position for the marker, so it
            // answers a hover itself: full opacity plus a lift, which is the difference
            // between "I moved the pointer" and "I am on the button".
            hint: true,   // chrome, not scene: the one spot that still answers a hover (see hotspots.js)
            hover: (on) => { lens.setPromptHot(on ? 1 : 0); tvUX.nudgeToggle(); },
            press: () => { tvUX.setView(tvUX.focused ? 'room' : 'screens'); return true; },
          });
        }
        window.__tv = tvUX;

        // n039 + the floor lamp: a dim warm point light inside each lamp's
        // glass shade. Position is measured from the shade, never typed; the
        // shade gets a touch of warm emissive so the light has a visible
        // source. No shadow — a point shadow is six map renders, and at this
        // dimness the leak cannot read. Lives in the rig so the baked/RT
        // toggle takes it too. ?lamp= dials both, 0 removes them.
        // Day value was 0.4; nudged up for night now that GI is baked dark —
        // the pendants are the key (below), this is still an accent.
        const LAMP_INT = parseFloat(q.get('lamp') ?? '0.95');
        function lightLamp(shade) {
          if (!shade || LAMP_INT <= 0) return;
          const c = new THREE.Box3().setFromObject(shade).getCenter(new THREE.Vector3());
          const l = new THREE.PointLight(0xffd3a6, LAMP_INT, 0, 2);
          l.position.copy(c);
          rig.add(l);
          const lm = Array.isArray(shade.material) ? shade.material[0] : shade.material;
          lm.emissive = new THREE.Color(0xffb066);
          lm.emissiveIntensity = 0.8;
        }
        lightLamp(props.scene.getObjectByName('Prop_Study_Table_Lamp_Metal001_1'));
        lightLamp(floorLampShade);

        // ── overnight KEY: the two suspended pendants (Gate A §5.2.1) ───────
        // Same "measured from the shade, never typed" pattern as lightLamp
        // above, but they carry the frame at night rather than accent it, so
        // they get their own (much higher) intensity and no shadow for the
        // same draw-budget reason (repo CLAUDE.md: the room is already drawn
        // ~5x/frame for the sun + skylight shadow maps — a third and fourth
        // shadow-casting light is not free here). ?pendant= dials both, 0 off.
        const PENDANT_INT = parseFloat(q.get('pendant') ?? '3.0');
        function lightPendant(bulbName, key) {
          const bulb = props.scene.getObjectByName(bulbName);
          if (!bulb || PENDANT_INT <= 0) return;
          const c = new THREE.Box3().setFromObject(bulb).getCenter(new THREE.Vector3());
          const l = new THREE.PointLight(0xffa855, PENDANT_INT, 0, 2);
          l.position.copy(c);
          rig.add(l);
          // an equipment target the event library can name (pendant_flicker)
          equipmentTargets.set(key, l);
        }
        lightPendant('Prop_Pendant_1_Bulb', 'pendant_1');
        lightPendant('Prop_Pendant_2_Bulb', 'pendant_2');

        // ── a second pendant bar, over the desks (Josh, 2026-09-03: "try
        // another set of pendant lights above desks to better light near
        // view") ─────────────────────────────────────────────────────────
        // Cloned from the rig above rather than re-authored, so it reads as
        // the same fixture family. Translated in X only (the desk cluster
        // sits at roughly the same Z as the original bar), which is why
        // ★ THE RODS STILL HAVE TO BE RE-CAST, NOT CARRIED OVER: the roof is
        // pitched, this bar now sits over a different part of it, and the
        // original pair (1.287 m / 2.143 m for the same drop) is the proof
        // that typing a rod length here would be wrong the moment the roof
        // isn't flat under it — which it never is.
        if (q.get('pendant2') !== '0') {
          const DX = -4.328; // 1.428 → -2.9, over Desk_Right / Vintage_Desk
          const partNames = [
            'Prop_Pendant_Conduit', 'Prop_Pendant_Rod_1', 'Prop_Pendant_Rod_2',
            'Prop_Pendant_1_Mount', 'Prop_Pendant_1_Cord', 'Prop_Pendant_1_Shade', 'Prop_Pendant_1_Bulb',
            'Prop_Pendant_2_Mount', 'Prop_Pendant_2_Cord', 'Prop_Pendant_2_Shade', 'Prop_Pendant_2_Bulb',
          ];
          const clones = {};
          let ok = true;
          for (const n of partNames) {
            const src = props.scene.getObjectByName(n);
            if (!src) { ok = false; console.warn('pendant2: missing part', n); continue; }
            const c = src.clone();
            c.position.x += DX;
            c.name = n + '_B';
            pickables.add(c);
            const mats = Array.isArray(c.material) ? c.material : [c.material];
            for (const m of mats) if (m && m.isMeshStandardMaterial) litMaterials.add(m);
            clones[n] = c;
          }
          if (ok) {
            const ray = new THREE.Raycaster();
            const up = new THREE.Vector3(0, 1, 0);
            for (const [rodName, mountName] of [
              ['Prop_Pendant_Rod_1', 'Prop_Pendant_1_Mount'],
              ['Prop_Pendant_Rod_2', 'Prop_Pendant_2_Mount'],
            ]) {
              const rod = clones[rodName], mount = clones[mountName];
              const origLen = new THREE.Box3().setFromObject(props.scene.getObjectByName(rodName))
                .getSize(new THREE.Vector3()).y;
              const from = new THREE.Vector3(rod.position.x, mount.position.y + 0.05, rod.position.z);
              ray.set(from, up);
              const hit = ray.intersectObject(gltf.scene, true).find((h) => h.distance > 0.05);
              if (hit) {
                const roofY = from.y + hit.distance;
                const newLen = roofY - mount.position.y;
                rod.scale.y = newLen / origLen;
                rod.position.y = mount.position.y + newLen / 2;
              } else {
                console.warn('pendant2: no roof hit for', rodName, '— rod length unchanged');
              }
            }
          }
          const lightClonedBulb = (bulbClone, key) => {
            if (!bulbClone || PENDANT_INT <= 0) return;
            const c = new THREE.Box3().setFromObject(bulbClone).getCenter(new THREE.Vector3());
            const l = new THREE.PointLight(0xffa855, PENDANT_INT, 0, 2);
            l.position.copy(c);
            rig.add(l);
            equipmentTargets.set(key, l);
          };
          lightClonedBulb(clones['Prop_Pendant_1_Bulb'], 'pendant_3');
          lightClonedBulb(clones['Prop_Pendant_2_Bulb'], 'pendant_4');
        }

        // ── the cat (chat 2026-08-19): dozing on the carpet in the sun ─────
        // "Lie doze" is the sequencer's label for anim_lie_sleep (looping).
        // Every trap here is documented in CLAUDE.md's cat section: skinned
        // bounds don't follow bones (frustumCulled off), the ORM was stripped
        // so metalness must be zeroed or he renders chrome, and the fur ships
        // OUTSIDE the glb and needs flipY=false + sRGB or it loads mirrored
        // and pale. DP-W6: he WALKS now, so he is no longer draggable — his
        // transform is an output, and the panel's lock (userData.noMove) is
        // below with the reason. He stays selectable and commentable.
        // Spot measured live: the roof aperture's sun pool centres at
        // (-1.6, 0.9) and the persian carpet spans x -2.7..0.1 / z -1.5..0.5;
        // their overlap is the carpet's front-right strip.
        const CAT_ON   = q.get('cat') !== '0';
        const CAT_FUR  = q.get('catfur') ?? 'c6';
        if (CAT_ON) {
          try {
            // The clips this row needs. The nap cycle is DP-W2's signed
            // behaviour and is untouched; `walk` is what DP-W6 adds, and
            // `lie_start` / `lie_end` are the way IN and OUT of the lying pose
            // — without `lie_end` he can lie down and never stand up, which is
            // the rest-chain dead end the engineering log warns about, and it
            // fails as "the cat never roams" rather than as a missing clip.
            // ★ NPC-004 REVISION (Josh, 2026-09-06): `walk` alone cannot carry a chase.
            // A pursuit needs a second gait to change INTO and a beat to end on, and both
            // were already sitting unused in assets/cat/. All three additions are `_IP`
            // (in place) clips — the repo rule — so the body travel comes from the steering
            // and the clip only supplies the pose. A root-motion clip here would double the
            // movement, which reads as the feet being wrong rather than as two systems.
            const CAT_FILES = ['lie_sleep', 'lie_sleep_end', 'lie_sleep_start',
                               'lie_start', 'lie_end', 'walk',
                               'trot', 'jump_launch_f', 'jump_land_f'];
            const [catG, ...catAnims] = await Promise.all([
              new Promise((res, rej) => gltfLoader.load('../../assets/cat/cat.glb', res, undefined, rej)),
              ...CAT_FILES.map((f) => new Promise((res, rej) =>
                gltfLoader.load(`../../assets/cat/anim_${f}.glb`, res, undefined, rej))),
            ]);
            const cat = catG.scene;
            catObj = cat;
            let catMat = null;
            cat.traverse((o) => {
              if (!o.isMesh) return;
              o.castShadow = true;
              o.receiveShadow = true;
              o.frustumCulled = false;
              o.layers.enable(1);            // a prop, to the AO's third channel
              const m = o.material;
              if (o.isSkinnedMesh && !catMat) catMat = m;
              m.metalness = 0;
              if (m.isMeshStandardMaterial) litMaterials.add(m);
            });
            new THREE.TextureLoader().load(`../../assets/cat/fur/${CAT_FUR}.jpg`, (t) => {
              t.flipY = false;
              t.colorSpace = THREE.SRGBColorSpace;
              t.anisotropy = MAX_ANISOTROPY;
              if (catMat) { catMat.map?.dispose(); catMat.map = t; catMat.needsUpdate = true; }
            });
            // Re-derived, not carried over (Josh, 2026-09-03: pillow moves
            // under the centre wall screen, "almost against the wall", and
            // the cat repaths to it). The old marker-on-the-rug spot is gone
            // — Prop_Pillow itself moved to blender (1.6307, -0.3137, 0.0066),
            // and (1.6, 0.35) three is the nearest cat-walk cell to that wall
            // on the pillow's row (x >= 1.7 reads blocked back to the brick,
            // per repo CLAUDE.md's own warning that a wall-adjacent nap spot
            // is exactly the case that can land in a blocked cell).
            //
            // ★ THE YAW IS TURNED 180° FROM WHAT THAT COMMENT CLAIMED (Josh,
            // 2026-09-07: "default the cat 180 degrees so it's facing and napping
            // toward the camera and not at the wall"). The old value was reasoned
            // to face -X and was never measured against the shipped pose; he read
            // as facing the brick. It is measured now — `catFacing()` below reports
            // the angle between his forward axis and the direction to the loop
            // camera, and a re-dress that moves either end will show up there
            // rather than in someone's eyes.
            const NAP = { x: 1.6, z: 0.35, yaw: -Math.PI / 2 };
            const CAT_FLOOR_Y = 0.02;
            cat.position.set(NAP.x, CAT_FLOOR_Y, NAP.z);
            cat.rotation.y = NAP.yaw;
            // ★ HE IS DRIVEN NOW, SO THE PANEL MUST NOT DRAG HIM (repo CLAUDE.md).
            // His transform is an OUTPUT: a dragged pose is not a suggestion, it
            // is a value the steering overwrites next frame. Worse, the picker
            // hits the SkinnedMesh inside this group, so a drag would offset the
            // mesh WITHIN the group while the sim carried on driving the group —
            // and it persists by node path and replays on every load. He stays
            // selectable and commentable, which is the point of the panel.
            // `noBlock` is the other half: he is in `pickables` with the room, and
            // without it the grid measures his own bounding box as wall.
            cat.userData.noMove = true;
            cat.userData.noBlock = true;
            pickables.add(cat);
            catMixer = new THREE.AnimationMixer(cat);
            const [doze, dozeOut, dozeIn, lieDown, getUp, walkClip,
                   trotClip, pounceUp, pounceDown] =
              catAnims.map((g, i) => {
                const a = catMixer.clipAction(g.animations[0]);
                if (i > 0 && i < 5) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
                return a;
              });
            // The pounce halves are one-shots that must hold their last pose, like the
            // rise and the lie-down — and like those, they END ON THE MIXER'S `finished`
            // EVENT, never on a time poll. Through browser automation the mixer advances a
            // handful of frames per inspection and a poll simply never comes true.
            for (const a of [pounceUp, pounceDown]) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }

            // ★ FOOT SLIDE IS ONE NUMBER AND IT IS MEASURED, NOT TYPED. The walk
            // clip's authored travel speed drives the playback rate; assuming it
            // equals the travel speed makes the rate exactly 1.0 and looks
            // deliberate. Re-run at load so a re-export cannot leave a stale
            // number behind — this is the row's "re-run measureAuthoredSpeed
            // after any re-export" instruction, discharged by never storing it.
            const measured = measureAuthoredSpeed({ model: cat, mixer: catMixer, action: walkClip });
            const CAT_STRIDE = measured ?? 0.472;
            // The trot is a SECOND clip with its OWN authored speed, and assuming it shares
            // the walk's is the same mistake the walk's own number was fitted to correct.
            // Measured at load, never stored.
            const measuredTrot = measureAuthoredSpeed({ model: cat, mixer: catMixer, action: trotClip });
            const CAT_TROT_STRIDE = measuredTrot ?? 0.95;
            catStride = { measured, used: CAT_STRIDE, trot: measuredTrot, trotUsed: CAT_TROT_STRIDE };

            const FADE = 0.35;
            const swap = (next, prev) => {
              next.reset(); next.crossFadeFrom(prev, FADE, false); next.play();
            };
            let current = doze;
            // ★ AN ACTION THAT IS ALREADY `current` STILL HAS TO BE PLAYING (#96). `oneShot`
            // sets `running` and then asks for this, and the old guard skipped the whole call
            // when the action was already the current one — which is right for the crossfade
            // (there is nothing to fade from) and wrong for `play()`: `reset()` rewinds an
            // action, it does not schedule one. An action that is current but not in the
            // mixer's active list therefore never advances and never dispatches `finished`,
            // and the idle exit waits on it forever. Cheap to close, and impossible to
            // observe from the picture, which is how it survived DP-W8.
            const play = (next) => {
              if (next === current) { if (!next.isRunning()) next.play(); return; }
              swap(next, current); current = next;
            };

            // ── the idle set (NPC-005) — a SECOND, NON-BLOCKING WAVE ──────────
            // ★ THESE CLIPS MUST NOT JOIN `CAT_FILES`. That array is awaited before
            // first paint AND its destructure below is POSITIONAL, so an insertion
            // anywhere but the end silently rebinds every later clip — the walk
            // becomes the trot, the pounce becomes the rise, and nothing throws.
            // The idle set is keyed BY NAME for the same reason, and it is fetched
            // after the room is already on screen: 2.4 MB of animation that nobody
            // sees in the first twenty seconds has no business delaying the first
            // frame. A slow connection therefore degrades to the nap chain alone,
            // which is exactly the behaviour that shipped before this row.
            //
            // Three of the seven standing idles, not all seven: idle_1/4/6 are
            // 0.9 MB of the 2.1 MB the full set costs, and at the loop camera he is
            // ~5 m away. CLAUDE.md's warning stands — animation is not free.
            const IDLE_FILES = ['sit_start', 'sit_loop', 'sit_end',
                                'trans_sit_belly', 'trans_belly_sit',
                                'trans_sit_side', 'trans_side_sit',
                                'lie_loop', 'lieside_start', 'lieside_loop', 'lieside_end',
                                'lick', 'scratch', 'sharpen',
                                'idle_1', 'idle_4', 'idle_6'];
            if (q.get('catidles') !== '0') {
              Promise.all(IDLE_FILES.map((f) => new Promise((res) =>
                gltfLoader.load(`../../assets/cat/anim_${f}.glb`,
                  (g) => res([f, g]), undefined, () => res(null)))))
                .then((loaded) => {
                  const clips = new Map();
                  for (const entry of loaded) {
                    if (!entry) continue;
                    const [name, g] = entry;
                    if (g.animations[0]) clips.set(name, catMixer.clipAction(g.animations[0]));
                  }
                  // ★ HE IS HANDED OVER MID-CHAIN, LYING ON HIS BELLY. `dozeOut`
                  // (lie_sleep_end) leaves him awake but still down, which is why
                  // the page's own `beginRoam` plays `getUp` next. Telling the
                  // graph he is standing would play a sit_start from a lying body.
                  catIdles = createCatIdles({ mixer: catMixer, clips, play, startPose: 'lie_belly' });
                  console.info(`cat idles: ${clips.size}/${IDLE_FILES.length} clips, poses ${catIdles.poses.join('/')}`);
                })
                .catch((e) => console.warn('cat idles not loaded:', e));
            }

            // ── the transform, and who owns it ────────────────────────────────
            // ★ WHATEVER MOVES HIM HAS TO WRITE BOTH TRANSFORMS, so nothing here
            // writes two. `cat-walk.js` requires matrixAutoUpdate = false and
            // writes `matrix` itself; rather than handing ownership back and
            // forth at every rest↔roam edge (which is exactly the "looks fine
            // until the mode is toggled, then he snaps back" trap), the matrix
            // is the single source of truth ALWAYS. Resting simply means nobody
            // is stepping the steering, so the last matrix written stands.
            cat.matrixAutoUpdate = false;
            // ★ HE RESTS ON A CUSHION, AND THE CUSHION HAS A THICKNESS (Josh,
            // 2026-09-07: "the cat legs and head sinks into the pillow asset it's
            // on top of"). The nap pose was signed at the ROOM FLOOR while the bed
            // is a stack of three pillows — measured, the surface under him runs
            // 0.062 to 0.107 against a park height of 0.020, so his paws sat 4 to
            // 9 cm INSIDE it. It reads as an animation fault and is a placement
            // one; the idle set only made it obvious, because a lying cat hides
            // its own legs and a sitting one does not.
            //
            // ★ AND ONE PROBE IS THE WRONG MEASUREMENT — the same "measure the
            // deck, not a bounding box" rule the transistor radio cost us, one
            // step further in. A puffy cushion has a dip: straight down through
            // the nap point reads 0.062, fifteen centimetres either side reads
            // 0.099 and 0.107. Parking on the dip drops him back into it. Take the
            // MEDIAN over his footprint, which is what four paws actually rest on.
            const CAT_STEP_OVER = 0.12;   // cat-walk's own "this is floor to a cat"
            const surfaceUnder = (x, z, halfX = 0.22, halfZ = 0.13) => {
              const rc = new THREE.Raycaster();
              const down = new THREE.Vector3(0, -1, 0);
              const inCat = (o) => { for (let a = o; a; a = a.parent) if (a === cat) return true; return false; };
              const hits = [];
              for (let i = -2; i <= 2; i++) {
                for (let j = -1; j <= 1; j++) {
                  rc.set(new THREE.Vector3(x + (i / 2) * halfX, CAT_FLOOR_Y + 1.0, z + j * halfZ), down);
                  const h = rc.intersectObject(pickables, true)
                    .find((r) => r.object.isMesh && r.object.visible && !inCat(r.object));
                  // Anything a cat would have to CLIMB is not what he is lying on —
                  // and silently parking him on top of a crate a re-dress left there
                  // is how a prop ends up wearing a cat.
                  if (h && h.point.y <= CAT_FLOOR_Y + CAT_STEP_OVER) hits.push(h.point.y);
                }
              }
              if (!hits.length) return CAT_FLOOR_Y;
              hits.sort((a, b) => a - b);
              return hits[Math.floor(hits.length / 2)];
            };
            let napY = CAT_FLOOR_Y;
            const parkAt = (x, z, yaw) => {
              cat.matrix.compose(
                new THREE.Vector3(x, napY, z),
                new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0)),
                new THREE.Vector3(1, 1, 1));
              cat.matrixWorldNeedsUpdate = true;
            };
            napY = surfaceUnder(NAP.x, NAP.z);
            console.info(`cat: nap surface ${napY.toFixed(3)} m (floor ${CAT_FLOOR_Y})`);
            parkAt(NAP.x, NAP.z, NAP.yaw);

            // ── the rhythm ────────────────────────────────────────────────────
            // ★ EVERY DURATION HERE IS WALL CLOCK. A hold driven by accumulated
            // frame dt stretches exactly when frames are scarce, and this Loop
            // targets 30 FPS on a phone; the same defect was measured on the
            // return affordance's fade and on the conveyor stall. dt drives
            // motion; performance.now() drives time.
            // The pace ladder's two distances, in metres. STALK_M is where the trot
            // becomes a stalk; POUNCE_M is where he commits. POUNCE_M sits INSIDE the
            // mouse's 1.0 m evade radius on purpose — the bolt must get away first.
            const STALK_M = parseFloat(q.get('catstalk') ?? '1.35');
            const POUNCE_M = parseFloat(q.get('catpounce') ?? '0.55');
            const CAT_STALK_SPEED = parseFloat(q.get('catstalkspeed') ?? '0.26');
            const CAT_DOZE_S = parseFloat(q.get('catdoze') ?? '20');
            const CAT_ROAM_S = parseFloat(q.get('catroam') ?? '75');
            // How long a bout of idling lasts, and how often waking turns into one
            // rather than straight back into the nap. Both are art calls, on the URL
            // so they can be argued with: `?catidle=`, `?catidlep=`.
            const CAT_IDLE_S = parseFloat(q.get('catidle') ?? '45');
            const CAT_IDLE_P = parseFloat(q.get('catidlep') ?? '0.7');
            let phase = 'doze';          // doze | awake | idle | rising | roam | homing | lying
            let until = performance.now() + CAT_DOZE_S * 1000;
            let holdS = 5;
            let roamsLeft = 0;           // set by roam(); 0 means "settle after this one"
            let roamFor = CAT_ROAM_S;    // how long THIS roam lasts — the rise ends elsewhere
            // ── the hunt (NPC-004) ────────────────────────────────────────────
            // ★ HE GENUINELY REACTS, AND THE SPLIT IS WHAT KEEPS THE DETERMINISM
            // GATE HONEST (Josh's call, 2026-09-06). The SHARED clock decides
            // that a hunt happens, when, and for how long — that is what fires,
            // logs and aligns across viewers. The PATH is local: he re-aims at
            // wherever the mouse actually is on this client, at this frame. So
            // two viewers see the same hunt begin on the same second and take
            // different lines through the room, exactly as DP-W4's local
            // triggers hold a channel on one client only. Nothing local ever
            // reaches the scheduler, and no roll is drawn from a position.
            let pursueUntil = 0;         // wall clock; while > now, the roam is a hunt
            let reaimAt = 0;             // next re-aim — 4 Hz, not every frame

            // ── the idle set (NPC-005) ────────────────────────────────────────
            // ★ IT IS BRACKETED BY THE POSE HE ARRIVES AND LEAVES IN, AND THAT IS
            // WHAT KEEPS IT OUT OF THE ROAM PATH. He enters from 'awake' (lying on
            // his belly, the nap chain's own halfway house) and every exit routes
            // back to that same pose before handing control on. So `beginRoam`,
            // `getUp`, `beginHome` and the whole hunt ladder are untouched by this
            // row — which matters, because #93 has the locomotion under review and
            // two changes in one phase machine mask each other.
            let idleExiting = false;
            let idleNetCheck = null;      // the exit's safety net, ticked on the mixer's clock
            const beginIdle = () => {
              phase = 'idle';
              idleExiting = false;
              catIdles.setEnabled(true);
              // Varied by construction: a fixed bout length is the same defect as a
              // fixed sit length, one level up.
              until = performance.now() + CAT_IDLE_S * (0.6 + Math.random() * 0.8) * 1000;
            };
            /**
             * Leave the idle set and hand the body back. `then` runs once he is down
             * on his belly again — up to two transitions away if he is lying on his
             * side, which is a second or two of a cat getting up rather than a snap.
             */
            // ★ THE EXIT NEEDS A DEADLINE, BECAUSE ITS CALLBACK CAN NEVER ARRIVE.
            // `catIdles.to()` settles on the mixer's `finished` for the last
            // transition clip, which is right — a time poll is the documented hang
            // — but `finished` does not fire for an action something else has
            // crossfaded away from or re-entered, and this file's `play()` is
            // shared between the idle set and the nap/locomotion clips. Measured in
            // DP-W8 while wiring the mouse tap: `idles.busy` stuck true for 64 s
            // with the pose already at lie_belly and the last action reading
            // `trans_sit_belly`, so `npc/cat/hunt` returned true, logged a fire, and
            // left the cat lying on his bed while a frozen mouse waited across the
            // room. That is exactly the "a command must work from every phase, or it
            // lies" defect, arriving through the phase NPC-005 added after NPC-004
            // fixed the other five.
            //
            // ★ AND THE NET HAS TO BE MEASURED IN THE SAME CURRENCY AS THE THING IT NETS,
            // WHICH IT WAS NOT. It counted 2000 ms of WALL CLOCK over a route made of
            // animation clips, and the mixer is advanced by the frame loop's dt — which is
            // CLAMPED to 0.1 s so one slow frame back from a background cannot teleport the
            // camera. Below 10 fps animation time therefore runs slower than the clock: at the
