  <style>
    /* ⚠ #126, loops-docs web §5: iOS's OWN long-press-to-select can beat the shell's
       long-press promotion to `secondary` — the browser starts a selection or shows the
       callout menu and the gesture never reaches the bridge. The doc says to write this
       from a Loop's first commit. Inside the shell the document never receives a native
       touch, so this bites Safari-on-device and any review build rather than the app —
       still the rule. Scoped to html/body: #fbk's textarea re-enables selection itself. */
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    /* …but a field a reviewer types into must still be selectable. WebKit refuses selection
       INSIDE a control that inherits user-select:none — typing still lands, so the failure is
       "I cannot correct what I just wrote" rather than a dead panel. Chromium allows it either
       way, which is exactly why this is written down rather than tested on one engine. */
    input, textarea { -webkit-user-select: text; user-select: text; }

  <script type="module">
    // ⚠ FIRST IMPORT, AND IT MUST STAY FIRST (#121; loops-docs web §6 item 1). ES modules
    // evaluate depth-first in import order, so first-in-list is first-to-run — which is what
    // makes a guarded URL polyfill able to save three's loaders, whose module scope reaches
    // for `new URL(..., import.meta.url)` from r0.185. Imported BY NAME: the Apple TV binding's
    // module loader rejected the bare `import './x.js';` form with a compile-time SyntaxError.
    import { POLYFILLS } from '../../tools/polyfills.js';
    import * as THREE from 'three';
    import { GLTFLoader }   from 'three/addons/loaders/GLTFLoader.js';
    import { KTX2Loader }   from 'three/addons/loaders/KTX2Loader.js';
    import { OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
    import { N8AOPass } from 'n8ao';
    import { createLooks } from '../../tools/looks.js';
    import { createGIVolume } from '../../tools/gi-volume.js';
    import * as PCSS from '../../tools/pcss.js';
    import { VolumetricLightPass } from '../../tools/volumetrics.js';
    import { createConveyor } from '../../tools/conveyor.js';
    import { createCornerDressing } from '../../tools/corner-dressing.js';
    import { createMouse, JAR_LID_Y } from '../../tools/mouse-routes.js';
    import { createCatWalk, measureAuthoredSpeed } from '../../tools/cat-walk.js';
    import { createCatIdles } from '../../tools/cat-idles.js';
    import { createLens } from '../../tools/lens.js';
    import { createDriftCam } from '../../tools/driftcam.js';
    import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
    import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
    import { createFlyTo } from '../../tools/flyto.js';
    import { createPerfTier, detectClass, startLevel } from '../../tools/perf-tier.js';
    import { createPerfWalk } from '../../tools/perf-walk.js';
    import { loadLibrary, loadRunOfShow } from '../../tools/events/library.js';
    import { RunOfShow } from '../../tools/events/runofshow.js';
    import { createRunner } from '../../tools/events/runner.js';
    import { createSceneExecutors } from '../../tools/events/scene-executors.js';
    import { SCREEN_CONTENT_GLSL, createScreenContent, MODE, PAGE } from '../../tools/screen-content.js';
    import { createGLPainter } from '../../tools/gl-page.js';
    import { createChalkboard } from '../../tools/chalkboard.js';
    import { createHotspots } from '../../tools/hotspots.js';
    import { createAudio, createDripScheduler, BUSES as AUDIO_BUSES } from '../../tools/audio.js';
    import { rebaseToCurrentWindow } from '../../tools/events/runofshow.js';
    import { attachCollectivus } from '../../tools/collectivus.js';
    import '../../tools/looper-link.js';   // demo/test only: does nothing without ?schedule=<Looper>
    // ⚠ STATIC, not `await import()` (#119). The Apple TV binding has NO dynamic import() —
    // it resolves the import graph up front — so the dynamic form rejected there, the
    // surrounding try/catch logged "render proxies not built", and the room drew its 277
    // source meshes unmerged: +240 draws, silently, on the lead platform. The module ships
    // either way; only the CALL stays gated on !DEV.
    import { buildRenderProxies, buildDepthProxies } from '../../tools/render-merge.js';
    import { applyPhoneCuts } from '../../tools/phone-cuts.js';

    const q = new URLSearchParams(location.search);

    // The polyfill import is by NAME so this readout exists: on a browser it is an empty
    // array and says nothing; on a pre-TVB1 Apple TV build it names what it installed, which
    // is how a rig tells "the file ran" from "the file was tree-shaken or never imported".
    if (POLYFILLS.length) console.log(`polyfills installed: ${POLYFILLS.join(', ')}`);

    // ★ THE LOOP SHIPS CLEAN, AND DEV CHROME IS OPT-IN (PLT-002). It used to be the
    //   other way round: every visitor got the looks panel, the feedback panel, the
    //   HUD and the fly camera unless the url said ?ui=0, and even then the modules
    //   still LOADED — presentation mode was CSS over a fully-built reviewer tool.
    //   An app entry cannot be a query parameter someone remembers to add, so the
    //   default is now the app's frame and the tools are behind a flag.
    //
    //   ?dev=1     authoring — panels, HUD, fly camera, notes written to the repo
    //   ?review=1  the team on GitHub Pages — same panels, notes copied to clipboard
    //   (neither)  the app entry: no chrome, camera locked to the one declared view
    //
    //   ?ui=0 is kept as an alias of the default so old links and captures still work.
    const DEV = q.get('dev') === '1' || q.get('review') === '1';
    const PRESENT = !DEV;             // camera lock + no chrome — see setCamLock()
    if (!DEV) {
      const s = document.createElement('style');
      // #back is the gallery link — site chrome, and there is no gallery in the app.
      s.textContent = '#hud, #fbk, #back { display: none !important; }';
      document.head.appendChild(s);
    }

    // ── grade ───────────────────────────────────────────────────────────────
    // The target is reference/warehouse_lighting_reference (in chat, 2026-08-18):
    // soft bounce-dominated daylight, ONE bright pool under the skylight, deep
    // contact shadow in corners and roof structure, warm brick against cool
    // shadow, no hard god-rays. Starting values lean that way; the dials finish it.
    // Re-graded 2026-08-19 against the Blender render, on the art director's
    // brief: "push to get our shadows to come to life — the image is very
    // underexposed". The lift is mostly BOUNCE and FILL (gi/skyl/envi), not
    // exposure — three's ACES has no shadow lift, so raising exp alone blows
    // the sun pool before the desk detail arrives. skyl/envi feed the BAKE:
    // re-bake after touching them or the shipped bounce contradicts the rig.
    const EXPOSURE   = parseFloat(q.get('exp')    ?? '2.45');
    const RT_SUN_AZ  = parseFloat(q.get('sunaz')  ?? '143');
    const RT_SUN_EL  = parseFloat(q.get('sunel')  ?? '56');
    // ★ OVERNIGHT IS THE DEFAULT STATE (Gate A §5.1/A3), re-dialled DP-W2.
    //   The day rig (5.31 sun, 0.94 skylights) is no longer the default —
    //   turning it down alone was proven NOT to work in DP-W1 (the room read
    //   flat because the shipped gi_volume.bin was baked at DAYLIGHT values,
    //   so scaling its intensity kept daylight's direction in every probe).
    //   This bake is fresh, taken AT these night values (see the GI section
    //   below), so the same starting numbers Gate A tested now have a bounce
    //   pass that actually agrees with them. Query params still override for
    //   an A/B against the old day look (`?sun=5.3098&skyl=0.9384&envi=0.18`).
    const RT_SUN     = parseFloat(q.get('sun')    ?? '0.62');
    // Apparent size of the source, as a tangent. Unchanged from the day rig —
    // sun angle doesn't need to change for the sun to be dim.
    const RT_SUNANG  = parseFloat(q.get('sunang') ?? '0.0139');
    // Grounding is the SKYLIGHT SHADOW, not the AO (2026-08-19, second try).
    // Screen-space AO can only smudge the surface BEHIND an object — at any
    // radius it detaches and floats. The skyShadow light casts real geometry-
    // anchored soft shadows under every prop, so part of the top light moved
    // from the unshadowed skylights (2.0 -> 1.4) into it (0 -> 0.9), and the
    // AO dropped to a tight supporting role (radii 0.5/0.6, shade 1.1).
    const RT_SKYL    = parseFloat(q.get('skyl')   ?? '0.17');
    const RT_SKYSHADOW = parseFloat(q.get('skyshadow') ?? '1.15');
    const RT_GI      = parseFloat(q.get('gi')     ?? '0.22');
    // Walls take a reduced share of the volume (per-material giGain). Fitted
    // 2026-08-19 against DP_RT_Lighting_Reference.jpg: wall patches read
    // 1.6-2.5x the render's while the floor did not — walls face the open room
    // so every probe agrees with them, and the flat lift read as sheen.
    const RT_GIWALL  = parseFloat(q.get('giwall') ?? '0');
    const RT_GIBIAS  = parseFloat(q.get('gibias') ?? '0.33');
    const RT_GIVIS   = parseFloat(q.get('givis')  ?? '0');
    const RT_GIVALID = parseFloat(q.get('givalid')?? '0.2');
    // Roof glazing is cool moon/skyglow fill only at night (§5.2.4) — no pool,
    // no shafts on the floor. Cut hard from the day rig's 0.18.
    const RT_ENVI    = parseFloat(q.get('envi')   ?? '0.03');
    const RT_BOUNCE  = parseFloat(q.get('bounce') ?? '0.58');
    const RT_AO      = q.get('ao') !== '0';
    // The GTAO param family (aoamt/aothick/aofrad/aofamt) retired with GTAO
    // itself — n8ao reads aorad/aofall directly at its construction below.

    // ★ THE BELT CANNOT SIT AT GATE A'S 2.62 m, AND THE OBSTRUCTION IS MEASURED,
    // NOT JUDGED. `Pipe_Overhead_02002` runs the whole length of the left wall at
    // y 2.64–3.58 — through the very cut-out the belt enters by — and
    // `Pipe_Straight_Long021` sits at y 2.78+ over the exit leg. A jar stands
    // 0.22 m on the belt, so a 2.62 belt puts jar lids through both. 2.32 clears
    // them by 0.12 m, still stands 0.46 m over the array's 1.86 m envelope, and
    // lands at NDC y +0.36 at the ROOM pose — the upper third, which is the
    // framing Gate A asked for. Gate A §4.2 explicitly makes the numbers a
    // starting fit and the RULES the binding part; every rule survives.
    const DEFAULT_BELT_Y = '2.32';
    // ── the TV wall ─────────────────────────────────────────────────────────
    // The screens share one emissive atlas (`Screen_Glow`). The pack's baked
    // multicolour noise read as placeholder, so the atlas is REPLACED at load
    // with procedural antenna static, computed in the screen's fragment shader
    // in the atlas's own pixel space (TV1, 2026-10-06 — it was a 2D canvas, and
    // the Apple TV binding has no Canvas 2D): upscaled white noise (soft, not
    // pixel-crisp), a vertical-hold band rolling down, occasional horizontal
    // tearing, scanlines, tube flicker. Every TV maps its own UV window onto the
    // one atlas space, so each screen shows DIFFERENT static for free.
    // Green comes from the emissive tint (because pickles), and the screens
    // are overdriven DURING THE GI BAKE so the coarse probe grid actually
    // catches the small emitters. Look target: the Blender reference render.
    const TV_GREEN = new THREE.Color(0.25, 1.0, 0.22);
    // "Soft glow, nothing distracting" (art direction 2026-08-19) — 2.5 on
    // screen, 8 for the bake. 5/14 was the first pass and read as neon.
    const TV_GLOW  = parseFloat(q.get('tvglow') ?? '2.5'); // on screen
    // 4, was 8: at 8 the coarse probe grid wrapped the green onto the wall
    // BEHIND the TVs (n025 — "the light should only project forward"). 4 keeps
    // the forward pool on the desk and starves the backwash.
    const TV_GLOW_BAKE = 4;
    const TV_FPS = 24;           // static frame rate under ?tvanim=1 — CRT cadence, not 60
    const screenMats = new Set();
    let tvStaticTex = null, tvTick = null;
    // The static's two inputs, shared by every static-path screen: the atlas size it is
    // computed in (so a noise cell is eight ATLAS pixels, as the canvas drew it) and the
    // frame time — held at 0 for the still frame, stepped at TV_FPS under ?tvanim=1.
    const tvStaticU = { uStaticRes: { value: new THREE.Vector2(1024, 1024) }, uStaticT: { value: 0 } };
    // One shared clock uniform for every screen's interference (DP-W4 signal_interference);
    // written once per frame in the loop, read by all three treatments.
    const scrTime = { value: 0 };

    // n038, then widened (chat 2026-08-19): EVERY screen plays the pickles
    // loop, synced — one <video>, one decode, broadcast-style. ?tvvideo=0
    // falls back to the still static everywhere, ?tvvidmesh=<name> plays it
    // on just that screen again, ?tvvidglow= dials the screens.
    const TV_VIDEO_MESH = q.get('tvvidmesh') ?? 'all';
    const TV_VIDEO      = q.get('tvvideo') !== '0';
    const TV_VIDEO_GLOW = parseFloat(q.get('tvvidglow') ?? String(TV_GLOW));

    // ── SCR-001: the screensaver is the screens' RESTING STATE (DP-W5) ──────
    // Canon §6 baseline: "matching flying-pickle screensavers on all three
    // screens". It is procedural GLSL in tools/screen-content.js, not a canvas
    // and not a video — Gate A §7.2 makes zero-upload screen content an
    // architecture requirement, because a canvas re-uploaded per frame measured
    // p95 34.7 ms with a TV in view against 14.0 ms frozen.
    // With it on, the pickles VIDEO is not decoded at all: the screen materials
    // keep the video path's inverse-ACES grade (so content lands at the colour
    // it was authored) but sample a 1x1 black texture they never read.
    // ?screensaver=0 goes back to the video as the resting state.
    const SCREENSAVER = q.get('screensaver') !== '0';

    // ── SCR-002: the screens are DEVICES, not textures ──────────────────────
    // Canon §9: "rounded CRT corners, scanlines and curvature on L/R, light
    // spill onto nearby surfaces, distinct resolution character per screen.
    // Content must look like it is *displayed by that device*."
    //
    // All three screens carry the SAME video (one decode, broadcast-style), so
    // the only thing that can tell them apart is the treatment. Each profile is
    // a device, and the three are deliberately spread across a resolution
    // ladder — a viewer should be able to say which is the oldest without being
    // told: left is the softest and coarsest, centre is the crispest, right
    // sits between them with a visible pixel structure the other two lack.
    //
    // ★ THE WARP IS IN THE CONTENT, NOT THE GLASS. The screen quad stays flat;
    // barrel-warping the emissive lookup is what reads as a tube face, and it
    // costs nothing. Modelling a bulged pane would need geometry we do not have
    // and would fight the measured display-area match from the array session.
    //
    // ★ AND THE CORNERS ARE A MASK ON EMISSIVE, NOT A CUT IN THE MESH. Taking
    // emissive to zero in the corners leaves the material's own dark base
    // colour showing, which is exactly what a masked tube corner looks like.
    // A geometry change here would mean a Blender round-trip per screen.
    const SCREEN_PROFILES = {
      // Boxy consumer 4:3 CRT TV, the oldest device in the room. Deep tube:
      // the most curvature, the largest corner radius, 240 coarse lines, and a
      // horizontal smear + chroma bleed standing in for composite video — which
      // is what actually makes a TV read as older than a computer monitor.
      Prop_Screen_Left_CRT:   { curve: 0.115, radius: 0.150, scan: 240, scanAmt: 0.34,
                                grille: 0,   grilleAmt: 0,    smear: 1.35, bleed: 0.0022,
                                vignette: 0.32, tint: [1.06, 1.00, 0.94] },
      // Modern 16:9 LCD — flat, crisp, the reference for the other two. No
      // scanlines and no warp at all; only a whisper of subpixel grid and the
      // small radius a modern bezel actually has, so it still reads as a panel
      // rather than as an untreated texture.
      Prop_Screen_Centre_LCD: { curve: 0.0,   radius: 0.022, scan: 0,   scanAmt: 0,
                                grille: 540, grilleAmt: 0.05, smear: 0,    bleed: 0,
                                vignette: 0.06, tint: [1.00, 1.00, 1.00] },
      // Beige 4:3 CRT computer monitor. A shallower tube than the TV and a
      // sharper signal (RGB, not composite): mild warp, fine 400-line pitch,
      // and a real aperture grille — the pixel structure is the point, it is
      // what puts this device between the other two on the ladder.
      Prop_Screen_Right_CRT:  { curve: 0.052, radius: 0.070, scan: 400, scanAmt: 0.21,
                                grille: 320, grilleAmt: 0.17, smear: 0,    bleed: 0.0009,
                                vignette: 0.18, tint: [0.96, 0.99, 1.06] },
    };
    // Anything else with a Screen_Glow (a prop telly that wanders back into the
    // set) gets a mild generic CRT rather than no treatment at all.
    const SCREEN_PROFILE_DEFAULT = { curve: 0.06, radius: 0.09, scan: 300, scanAmt: 0.22,
                                     grille: 0, grilleAmt: 0, smear: 0.6, bleed: 0.0012,
                                     vignette: 0.22, tint: [1.0, 1.0, 1.0] };

    function screenProfileFor(mesh) {
      for (let o = mesh; o; o = o.parent) {
        if (SCREEN_PROFILES[o.name]) return SCREEN_PROFILES[o.name];
      }
      return SCREEN_PROFILE_DEFAULT;
    }

    // ── the face basis (DP-W5) ──────────────────────────────────────────────
    // Solves the mesh's uv-to-picture orientation instead of assuming it. A least-squares plane
    // fit gives the world direction of each normalised uv axis; the picture's own axes are world
    // up projected into that plane, and the right-hand partner about the face normal. The result
    // is the two affine rows the shader needs, plus their inverse.
    //
    // It is a general solve rather than a table of four rotations because a re-export, or the
    // next screen prop, will not have the same convention — and a silently rotated screen is
    // exactly the class of defect that survived DP-W2 unnoticed.
    function screenFaceBasis(mesh, tex, win) {
      const uv = mesh.geometry.getAttribute(tex && tex.channel ? `uv${tex.channel}` : 'uv');
      const pos = mesh.geometry.getAttribute('position');
      mesh.updateWorldMatrix(true, false);
      const P = new THREE.Vector3();
      // least squares for world = A*sx + B*sy + C over the normalised uv window
      let Sxx = 0, Sxy = 0, Syy = 0, Sx = 0, Sy = 0, N = uv.count;
      const Vx = new THREE.Vector3(), Vy = new THREE.Vector3(), Vc = new THREE.Vector3();
      const pts = [];
      for (let i = 0; i < uv.count; i++) {
        const sx = (uv.getX(i) - win.x) * win.z, sy = (uv.getY(i) - win.y) * win.w;
        P.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
        pts.push({ sx, sy, p: P.clone() });
        Sxx += sx * sx; Sxy += sx * sy; Syy += sy * sy; Sx += sx; Sy += sy;
        Vx.addScaledVector(P, sx); Vy.addScaledVector(P, sy); Vc.add(P);
      }
      // normal equations, 3x3 for [A, B, C]
      const m = [[Sxx, Sxy, Sx], [Sxy, Syy, Sy], [Sx, Sy, N]];
      const rhs = [Vx, Vy, Vc];
      // Gaussian elimination on the 3x3 with vector right-hand sides
      for (let c = 0; c < 3; c++) {
        let piv = c;
        for (let r = c + 1; r < 3; r++) if (Math.abs(m[r][c]) > Math.abs(m[piv][c])) piv = r;
        [m[c], m[piv]] = [m[piv], m[c]]; [rhs[c], rhs[piv]] = [rhs[piv], rhs[c]];
        if (Math.abs(m[c][c]) < 1e-12) return null;
        const d = m[c][c];
        for (let k = 0; k < 3; k++) m[c][k] /= d;
        rhs[c].multiplyScalar(1 / d);
        for (let r = 0; r < 3; r++) {
          if (r === c) continue;
          const f = m[r][c];
          for (let k = 0; k < 3; k++) m[r][k] -= f * m[c][k];
          rhs[r].addScaledVector(rhs[c], -f);
        }
      }
      const A = rhs[0], B = rhs[1];
      const nrm = new THREE.Vector3().crossVectors(A, B).normalize();
      // face the viewer: these screens all look back down the camera's forward axis
      if (nrm.dot(new THREE.Vector3(-1, 0, 0)) < 0) nrm.negate();
      const up = new THREE.Vector3(0, 1, 0).addScaledVector(nrm, -nrm.y).normalize();
      const right = new THREE.Vector3().crossVectors(up, nrm).normalize();
      let rMin = Infinity, rMax = -Infinity, uMin = Infinity, uMax = -Infinity;
      for (const pt of pts) {
        const r = pt.p.dot(right), v = pt.p.dot(up);
        rMin = Math.min(rMin, r); rMax = Math.max(rMax, r);
        uMin = Math.min(uMin, v); uMax = Math.max(uMax, v);
      }
      const rs = Math.max(rMax - rMin, 1e-6), us = Math.max(uMax - uMin, 1e-6);
      // face = M * (sx, sy) + t
      const a00 = A.dot(right) / rs, a01 = B.dot(right) / rs, a02 = (rhs[2].dot(right) - rMin) / rs;
      const a10 = A.dot(up) / us,    a11 = B.dot(up) / us,    a12 = (rhs[2].dot(up) - uMin) / us;
      const det = a00 * a11 - a01 * a10;
      if (Math.abs(det) < 1e-9) return null;
      const i00 = a11 / det, i01 = -a01 / det, i10 = -a10 / det, i11 = a00 / det;
      return {
        faceX: new THREE.Vector3(a00, a01, a02),
        faceY: new THREE.Vector3(a10, a11, a12),
        uvX:   new THREE.Vector3(i00, i01, -(i00 * a02 + i01 * a12)),
        uvY:   new THREE.Vector3(i10, i11, -(i10 * a02 + i11 * a12)),
      };
    }

    // The mesh's own window into the shared screen atlas, as
    // vec4(minU, minV, 1/spanU, 1/spanV). The treatment works in SCREEN space
    // (0..1 over this device's face) and maps back to atlas space to sample.
    // ★ For the video material this window is the IDENTITY, because
    // playVideoOnScreen already folds the same remap into the texture
    // transform — and three applies that transform when it builds
    // vEmissiveMapUv. Passing the atlas window again there would remap twice
    // and show a crop of a crop.
    function screenUVWindow(mesh, tex, remapped) {
      if (remapped) return new THREE.Vector4(0, 0, 1, 1);
      const uv = mesh.geometry.getAttribute(tex && tex.channel ? `uv${tex.channel}` : 'uv');
      let u0 = Infinity, v0 = Infinity, u1 = -Infinity, v1 = -Infinity;
      for (let i = 0; i < uv.count; i++) {
        const u = uv.getX(i), v = uv.getY(i);
        u0 = Math.min(u0, u); v0 = Math.min(v0, v);
        u1 = Math.max(u1, u); v1 = Math.max(v1, v);
      }
      return new THREE.Vector4(u0, v0, 1 / Math.max(u1 - u0, 1e-6), 1 / Math.max(v1 - v0, 1e-6));
    }

    // The GLSL. Returns the treated emissive colour for one screen fragment,
    // and writes the face mask (0 outside the tube's rounded face) into `face`.
    // ★ NO BACKTICKS ANYWHERE IN HERE, INCLUDING IN COMMENTS — one closes the
    // template literal and the SyntaxError points at an unrelated GLSL word
    // several lines away. tools/check-shaders.mjs guards this.
    //
    // ★ AND THIS GOES IN AFTER <emissivemap_pars_fragment>, NOT AFTER <common>.
    // GLSL has no forward declarations: emissiveMap is declared by that pars
    // include, so a helper that samples it and sits at <common> fails to
    // compile with "'emissiveMap' : undeclared identifier" — and a screen
    // material whose program does not link renders as a dead rectangle, which
    // looks like the treatment being too strong rather than absent. The whole
    // block carries the same USE_EMISSIVEMAP guard as the declaration it needs.
    const SCREEN_TREAT_GLSL = `
      #ifdef USE_EMISSIVEMAP
      uniform vec4  uScrWin;      // atlas window: minU, minV, 1/spanU, 1/spanV
      uniform float uScrCurve;    // barrel strength (0 = flat panel)
      uniform float uScrRadius;   // rounded-corner radius, fraction of half-face
      uniform float uScrScan;     // scanline count over the face height
      uniform float uScrScanAmt;
      uniform float uScrGrille;   // aperture-grille triads across the width
      uniform float uScrGrilleAmt;
      uniform float uScrSmear;    // horizontal softness, in scanline widths
      uniform float uScrBleed;    // chroma separation, in screen widths
      uniform float uScrVignette;
      uniform vec3  uScrTint;
      uniform float uScrNoise;    // interference amount, 0 = clean signal (DP-W4)
      uniform float uScrTime;
      // ★ THE EMISSIVE UVs ON THESE SCREENS ARE ROTATED 90 DEGREES AGAINST THE PICTURE, AND
      // EVERY SYMMETRIC EFFECT HID IT. Measured on the centre LCD: u runs DOWN the screen
      // (world y 2.053 to 0.987) and v runs LEFT (world z 1.293 to -0.592). The rounded-corner
      // mask and the barrel warp are symmetric, so they looked right; the scanlines, the
      // aperture grille and the composite smear were all running the wrong way round the whole
      // time, and content with any text in it is unreadable. These two affine rows map the
      // material's normalised uv into FACE space (x to the viewer's right, y up) and back, and
      // they are SOLVED per screen from the mesh at load — never typed.
      uniform vec3 uScrFaceX, uScrFaceY;   // uv -> face
      uniform vec3 uScrUVX,   uScrUVY;     // face -> uv

      // value noise from a hash, no texture to ship (Gate A 7.4)
      float scrHash(vec2 v) { return fract(sin(dot(v, vec2(12.9898, 78.233))) * 43758.5453); }

      vec2 scrToFace(vec2 s) { return vec2(dot(uScrFaceX, vec3(s, 1.0)), dot(uScrFaceY, vec3(s, 1.0))); }
      vec2 scrToUVn(vec2 f) { return vec2(dot(uScrUVX, vec3(f, 1.0)), dot(uScrUVY, vec3(f, 1.0))); }
      // face space (0..1 across and up this device's picture) -> atlas space
      vec2 scrToAtlas(vec2 f) {
        return uScrWin.xy + clamp(scrToUVn(f), 0.0, 1.0) / uScrWin.zw;
      }
      #ifdef SCR_PROC_STATIC
      // ── the antenna static, procedural (TV1). Every number below is the 2D canvas's own:
      //    grain at an eighth of the atlas resolution, upscaled with smoothing; grey 80..215;
      //    a 1-in-3 scanline at alpha 0.2; a dark vertical-hold band 16 % of the atlas tall;
      //    a 15 % chance of a torn strip per frame. The canvas composited those over noise that
      //    was itself only half opaque on the still frame (the persistence buffer starts empty),
      //    and the upload un-premultiplied it — so the darkening is solved the same way here,
      //    as black over a layer of alpha a, divided back out. That is what makes the still
      //    frame match the canvas rather than merely resemble it. ---
      uniform vec2  uStaticRes;   // the atlas size, in pixels: the space the canvas drew in
      uniform float uStaticT;     // frame time; 0 = the still frame
      float scrGrain(vec2 cell, float frame) {
        return (80.0 + 135.0 * scrHash(cell + vec2(frame * 17.0, frame * 31.0))) / 255.0;
      }
      float scrGrainAt(vec2 px, float frame) {
        vec2 g = px / 8.0 - 0.5;   // eighth res, sampled at cell centres, bilinear like the upscale
        vec2 i = floor(g), f = g - i;
        float a = scrGrain(i, frame), b = scrGrain(i + vec2(1.0, 0.0), frame);
        float c = scrGrain(i + vec2(0.0, 1.0), frame), d = scrGrain(i + vec2(1.0, 1.0), frame);
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }
      // black at alpha ab over (premultiplied colour, alpha)
      vec2 scrOver(vec2 ca, float ab) { return vec2(ca.x * (1.0 - ab), ca.y + ab * (1.0 - ca.y)); }
      float scrBand(float y, float yy, float bh) {
        float t = (y - yy) / bh;
        if (t < 0.0 || t > 1.0) return 0.0;
        return t < 0.65 ? 0.5 * t / 0.65 : 0.5 * (1.0 - t) / 0.35;
      }
      vec3 scrStatic(vec2 auv) {
        vec2 px = auv * uStaticRes;            // canvas pixels; row 0 is v = 0, as the upload had it
        float W = uStaticRes.x, H = uStaticRes.y;
        float frame = mod(floor(uStaticT * 24.0 + 0.5), 997.0);
        bool live = uStaticT > 0.0;
        // occasional horizontal tearing: a strip shifted sideways, this frame only
        float tr = scrHash(vec2(frame, 7.0));
        if (tr < 0.15) {
          float ty = scrHash(vec2(frame, 11.0)) * H;
          float th = 3.0 + scrHash(vec2(frame, 13.0)) * 14.0;
          if (px.y >= ty && px.y < ty + th) px.x -= (scrHash(vec2(frame, 17.0)) - 0.5) * W * 0.06;
        }
        // phosphor persistence: fresh noise over the previous frames at 50/50, the canvas's
        // accumulator — which on the still frame holds ONE frame at half opacity
        float n = scrGrainAt(px, frame);
        float a = 0.48;
        if (live) {
          n = n * 0.5 + scrGrainAt(px, frame - 1.0) * 0.3 + scrGrainAt(px, frame - 2.0) * 0.2;
          a = 0.96;
        }
        vec2 ca = vec2(n * a, a);
        // vertical-hold roll, drawn twice so the wrap never pops (off the top on the still frame)
        float bh = H * 0.16;
        float y = mod(uStaticT * 0.09, 1.0) * (H + bh) - bh;
        ca = scrOver(ca, scrBand(px.y, y, bh));
        ca = scrOver(ca, scrBand(px.y, y - H - bh, bh));
        // scanlines: one dark row in three; once a screen pixel spans more than a row or two the
        // pattern can only alias, so it eases to its own average (the canvas's mips did that)
        float row = step(2.0, mod(floor(px.y), 3.0));
        float fw = fwidth(px.y);
        float scan = 0.2 * mix(row, 1.0 / 3.0, clamp(fw - 0.75, 0.0, 1.0));
        ca = scrOver(ca, scan);
        float v = ca.x / max(ca.y, 1e-4);
        // the canvas was sRGB-coded, and the atlas it replaced is sampled as sRGB: decode
        vec3 c = vec3(v);
        return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c));
      }
      #endif
      vec3 scrSample(vec2 s) {
        #ifdef SCR_PROC_STATIC
          return scrStatic(scrToAtlas(s));
        #else
          return texture2D(emissiveMap, scrToAtlas(s)).rgb;
        #endif
      }
      // Forward declaration. WHAT a screen shows is tools/screen-content.js
      // (DP-W5); this file owns the DEVICE. Every sampling tap below goes
      // through it, so the smear, the chroma bleed, the scanlines and the
      // grille apply to a generated screensaver exactly as they applied to the
      // video — which is the whole of "content must look like it is displayed
      // by that device". GLSL has no forward declarations for anything but
      // functions, so this prototype is what lets the content block be injected
      // AFTER the block that uses it.
      vec3 scrContent(vec2 w);

      vec3 screenTreat(vec2 suv, out float face) {
        // --- tube geometry: barrel-warp the CONTENT about the face centre ---
        vec2 c = scrToFace(suv) * 2.0 - 1.0;
        c *= 1.0 + uScrCurve * dot(c, c);

        // --- rounded-rect face mask (signed distance, so the corner is a real
        //     radius rather than a chamfer) ---
        vec2 q = abs(c) - (1.0 - uScrRadius);
        float sd = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - uScrRadius;
        face = 1.0 - smoothstep(-0.012, 0.012, sd);

        vec2 w = c * 0.5 + 0.5;

        // --- resolution character: a horizontal smear standing in for a
        //     composite signal's limited bandwidth. Three taps, weighted, and
        //     only when the device asks for it (the LCD and the monitor pass
        //     uScrSmear = 0 and this costs one tap). ---
        vec3 col;
        if (uScrSmear > 0.0) {
          float d = uScrSmear / max(uScrScan, 1.0) * 1.3333;   // 4:3 face
          col = scrContent(w) * 0.5
              + scrContent(w + vec2(d, 0.0)) * 0.25
              + scrContent(w - vec2(d, 0.0)) * 0.25;
        } else {
          col = scrContent(w);
        }

        // --- chroma bleed: red lags and blue leads, the composite artefact ---
        if (uScrBleed > 0.0) {
          col.r = scrContent(w + vec2(uScrBleed, 0.0)).r;
          col.b = scrContent(w - vec2(uScrBleed, 0.0)).b;
        }

        // --- signal interference (DP-W4 signal_interference): snow over the
        //     picture, and some lines torn sideways with a bright edge. Drawn
        //     translucent so the picture reads through it; the envelope that
        //     makes it read as an unstable signal lives in the executor. ---
        if (uScrNoise > 0.0) {
          float frame = floor(uScrTime * 24.0);            // CRT cadence, not 60
          float line = floor(w.y * 180.0);
          float tearRoll = scrHash(vec2(line, frame));
          float tear = step(1.0 - uScrNoise * 0.22, tearRoll);
          float shift = (scrHash(vec2(line * 3.1, frame + 11.0)) - 0.5) * 0.12 * tear;
          vec3 torn = scrContent(w + vec2(shift, 0.0));
          col = mix(col, torn * (1.0 + 0.8 * tear), tear);
          float snow = scrHash(vec2(floor(w.x * 160.0) + frame * 7.0, line + frame * 13.0));
          col = mix(col, vec3(snow * 0.9), uScrNoise * (0.5 + 0.5 * tear));
        }

        // --- scanlines: the gap between lines, not a line drawn on top ---
        if (uScrScanAmt > 0.0) {
          float s = sin(w.y * uScrScan * 3.14159265);
          col *= 1.0 - uScrScanAmt * (1.0 - s * s);
        }

        // --- aperture grille / subpixel triads: each triad lets one channel
        //     through more than the others, so it tints per stripe instead of
        //     just darkening. ---
        if (uScrGrilleAmt > 0.0) {
          float t = fract(w.x * uScrGrille) * 3.0;
          vec3 m = vec3(
            1.0 - uScrGrilleAmt * min(abs(t - 0.5), 1.0),
            1.0 - uScrGrilleAmt * min(abs(t - 1.5), 1.0),
            1.0 - uScrGrilleAmt * min(abs(t - 2.5), 1.0));
          col *= m * (1.0 + uScrGrilleAmt * 0.5);
        }

        // --- tube vignette + phosphor tint ---
        col *= 1.0 - uScrVignette * dot(c, c) * 0.5;
        return col * uScrTint;
      }
      #endif
    `;

    // Chains the per-device uniforms onto a screen material. The caller owns
    // the emissive replacement itself, because the video path has already
    // rewritten <emissivemap_fragment> for its inverse-ACES grade and a second
    // pass would find nothing to replace.
    // A 1x1 black stand-in so uScrPage is never a null sampler before the
    // content controller hands over a real page canvas (and forever, on the
    // screens that only ever passthrough).
    let scrBlankTex = null;
    function blankTexture() {
      if (!scrBlankTex) {
        scrBlankTex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1);
        scrBlankTex.needsUpdate = true;
      }
      return scrBlankTex;
    }

    function screenTreatUniforms(mesh, mat, remapped, mode = 0) {
      const p = screenProfileFor(mesh);
      const win = screenUVWindow(mesh, mat.emissiveMap, remapped);
      // The basis is solved against the NORMALISED window, which is what the shader works in:
      // on the video path the texture transform already did that normalisation, so the window
      // there is the identity and the raw uv is normalised by its own extent instead.
      const rawWin = screenUVWindow(mesh, mat.emissiveMap, false);
      const basis = screenFaceBasis(mesh, mat.emissiveMap, rawWin)
        || { faceX: new THREE.Vector3(1, 0, 0), faceY: new THREE.Vector3(0, 1, 0),
             uvX: new THREE.Vector3(1, 0, 0), uvY: new THREE.Vector3(0, 1, 0) };
      // The basis is solved in NORMALISED window coordinates. On the video path the texture
      // transform hands the shader those coordinates already; on the static path it hands over
      // raw uv, so the normalisation is folded into the two face rows rather than costing the
      // shader another uniform and another branch.
      if (!remapped) {
        for (const row of [basis.faceX, basis.faceY]) {
          const a = row.x * rawWin.z, b = row.y * rawWin.w;
          row.set(a, b, row.z - a * rawWin.x - b * rawWin.y);
        }
      }
      const u = {
        uScrWin:       { value: win },
        uScrFaceX:     { value: basis.faceX },
        uScrFaceY:     { value: basis.faceY },
        uScrUVX:       { value: basis.uvX },
        uScrUVY:       { value: basis.uvY },
        uScrCurve:     { value: p.curve },
        uScrRadius:    { value: p.radius },
        uScrScan:      { value: p.scan },
        uScrScanAmt:   { value: p.scanAmt },
        uScrGrille:    { value: p.grille },
        uScrGrilleAmt: { value: p.grilleAmt },
        uScrSmear:     { value: p.smear },
        uScrBleed:     { value: p.bleed },
        uScrVignette:  { value: p.vignette },
        uScrTint:      { value: new THREE.Vector3(...p.tint) },
        // interference (DP-W4): amount 0..1, driven by the screens executor; time is shared
        uScrNoise:     { value: 0 },
        uScrTime:      scrTime,
        // content (DP-W5): what this device is showing. Written by
        // tools/screen-content.js through mat.__scr; the shader never uploads.
        uScrMode:      { value: mode },
        uScrSeed:      { value: 0 },
        uScrT0:        { value: 0 },
        uScrDim:       { value: 1 },
        uScrPage:      { value: blankTexture() },
        uScrBody:      { value: new THREE.Vector4(0.235, 0.108, 0.055, 0.945) },
        uScrReveal:    { value: -1 },
      };
      // The executor reaches the uniforms through the material — the shader's own uniform
      // objects are these same objects once three assigns them, so a write here is live.
      mat.__scr = u;
      return u;
    }

    // The static path's own <emissivemap_fragment> replacement. It CHAINS onto
    // whatever the material already had (gi/PCSS patch these same materials and
    // last-write-wins here reads as "the GI works but the screens are flat").
    function treatStaticScreen(mesh, mat) {
      if (mat.__scrTreated) return;      // shared Screen_Glow instances
      mat.__scrTreated = true;
      const scrU = screenTreatUniforms(mesh, mat, false);
      const prev = mat.onBeforeCompile;
      mat.onBeforeCompile = (shader, renderer) => {
        if (prev) prev(shader, renderer);
        Object.assign(shader.uniforms, scrU, tvStaticU);
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <emissivemap_pars_fragment>',
                   '#include <emissivemap_pars_fragment>\n#define SCR_PROC_STATIC\n' + SCREEN_TREAT_GLSL + SCREEN_CONTENT_GLSL)
          .replace('#include <emissivemap_fragment>', `
            #ifdef USE_EMISSIVEMAP
              float scrFace;
              totalEmissiveRadiance *= screenTreat( vEmissiveMapUv, scrFace ) * scrFace;
            #endif`);
      };
      const prevKey = mat.customProgramCacheKey;
      mat.customProgramCacheKey = () => (prevKey ? prevKey.call(mat) : '') + '|scr002-static';
    }

    // Click-a-telly: hover wakes the screen, click flies the camera to it,
    // clicking the screen again flies home. ?tvfocus=0 turns it all off.
    const TV_FOCUS = q.get('tvfocus') !== '0';
    let tvUX = null;          // built once the props are in (initTVFocus)
    let clvBridge = null;     // the app bridge, attached at the foot of this module
    /** Tell the shell the view has ARRIVED somewhere. Safe before the bridge exists and
     *  outside the app, where there is no bridge at all. */
    function reportViewToShell(id) { clvBridge?.cameraChanged?.(id); }
    let hotspots = null;      // tools/hotspots.js — the single pointer arbiter (INT-001)
    let screenArrayExclude = null;  // set by the CRT dial: the band of the cabinet it owns
    let homePose = null;      // { pos, tgt } — set where HOME_POS is defined
    let catMixer = null;      // drives the cat's clips
    let catCtl = null;        // the cat's event commands (DP-W4 npc channel)
    let catObj = null;        // the loaded cat scene (DP-W6: he walks now)
    let catWalk = null;       // tools/cat-walk.js — steering + the room's walkability grid
    let catRoaming = false;   // is the grid driving him this frame?
    let catTick = null;       // the rest/roam rhythm, stepped on wall clock
    let catStride = null;     // the walk clip's MEASURED authored speed
    let catWalkRate = null;   // (gait, rate) => crossfade the locomotion clip and set its rate
    let catIdles = null;      // tools/cat-idles.js — the pose graph (NPC-005), loaded after first paint
    let conveyor = null;      // the overhead belt and its jars (DP-W3)
    let chalkboard = null;    // the break-room board (Josh, 2026-09-03)
    let mouse = null;         // tools/mouse-routes.js — Caper on his routes (DP-W6, NPC-003)
    let mouseMixer = null;
    let mouseDrive = null;    // advances the current beat; the SCHEDULE decides the beats (NPC-004)
    let mouseCtl = null;      // the mouse's event commands (npc channel, NPC-004)
    let npcReflex = null;     // the local proximity check that fires mouse_bolt (NPC-004)
    let mouseStride = null;   // {measured, used} — the mouse's authored scurry speed
    let mouseDrivePaused = false;  // scripted checks need to hold one state still
    const BUS_LABELS = { bed: 'Room bed', machine: 'Machinery', npc: 'Animals', screen: 'Screens' };
    let audio = null;         // tools/audio.js — the mix (DP-W7); null if the browser has no Web Audio
    let audioTick = null;     // per-frame: listener, the drip, the beds that follow something
    let onClinkSink = null;   // set once the audio is up; the belt is built long before it is
    let onKnockOffSink = null;// set once the event runner is up; same reason as onClinkSink
    let radioEmitter = null;  // () => where the radio is, for the audio sink
    let audioSink = null;     // the event channel's sink — registered on the runner once built
    let audioFire = null;     // fire one slot by id, from anywhere in the scene (null before the
                              // gesture that unlocks the context — every caller must tolerate it)
    let lastJarTap = null;    // {at, point} — where the last tapped jar actually was
    let events = null;        // the event engine (DP-W4) — scheduler + runner + executors
    const equipmentTargets = new Map();   // name -> Object3D the equipment channel may drive

    // ★ THE STATIC IS A FRAGMENT SHADER (TV1, 2026-10-06), NOT A CANVAS. It was a 2D canvas the
    // size of the atlas, redrawn by script and uploaded; the Apple TV binding has no 2D context
    // at all, so it is now scrStatic() in SCREEN_TREAT_GLSL (behind SCR_PROC_STATIC), evaluated
    // in ATLAS pixel space so every cell size, band height and tear width keeps the canvas's number.
    // What stays a texture is a 1x1 stand-in: USE_EMISSIVEMAP (and the uv channel the screen's
    // window is measured on) has to survive, and the 4 MB canvas does not need to exist.
    function makeTVStatic(orig) {
      tvStaticU.uStaticRes.value.set(orig.image.width, orig.image.height);
      const tex = new THREE.DataTexture(new Uint8Array([160, 160, 160, 255]), 1, 1);
      tex.channel = orig.channel;          // the uv set the screen's window is measured on
      tex.colorSpace = orig.colorSpace;
      tex.needsUpdate = true;
      // ★ THE STATIC IS A STILL FRAME BY DEFAULT (2026-08-19). Every canvas→
      // texture upload mid-frame stalled the GPU pipeline while a TV was in view:
      // measured in the reporting Chrome at 2274x1214, p95 34.7 ms with 15/200
      // frames over 28 ms animating, against p95 14.0 / zero spikes frozen.
      // The shader costs no upload at all, but the still frame stays the default
      // because it is the signed look; ?tvanim=1 steps the shader's clock at the
      // CRT cadence for the A/B. The clock is wrapped so it never grows.
      if (q.get('tvanim') === '1') {
        tvTick = (t) => { tvStaticU.uStaticT.value = (Math.floor(t * TV_FPS) % (TV_FPS * 600)) / TV_FPS; };
      }
      return tex;
    }

    // ── the video screen (n038) ─────────────────────────────────────────────
    // Runs AFTER the mesh's Screen_Glow got its normal static setup, so the
    // clone inherits everything and only the screen content changes. Three
    // things are non-obvious:
    // - The screens share ONE ATLAS and each screen's UVs sample a window of
    //   it, so a raw VideoTexture would show a crop. The texture transform
    //   remaps this mesh's UV window onto the whole frame instead.
    // - The material is CLONED for this one mesh — Screen_Glow is shared, and
    //   swapping its map would put the video on every TV. The clone's emissive
    //   goes WHITE: the shared green tint multiplies the emissiveMap, and it
    //   would repaint the video's grade.
    // - Material.clone() does NOT carry onBeforeCompile, so the clone joins
    //   litMaterials to get its own GI + PCSS patch in the normal pass below.
    // ONE video element feeds every screen — one decode, all screens on the
    // same frame. Each screen still gets its OWN VideoTexture instance,
    // because the atlas-window remap lives in the texture transform and every
    // screen's window is different.
    let tvVid = null;
    // Exposure feeds the screens' inverse-ACES (below) and must FOLLOW the
    // Brightness dial — synced every frame in the loop. One shared uniform.
    const tvVidExposure = { value: EXPOSURE };
    function ensureTVVideo() {
      if (tvVid) return tvVid;
      tvVid = document.createElement('video');
      tvVid.src = '../../assets/dripping-pickle/tv_pickles_sinking.mp4';
      tvVid.loop = true; tvVid.muted = true; tvVid.playsInline = true;
      // muted + playsInline autoplays in every current browser; if a policy
      // still blocks it, the first click starts it (the static shows till then)
      tvVid.play().catch(() => addEventListener('pointerdown', () => tvVid.play(), { once: true }));
      return tvVid;
    }
    function playVideoOnScreen(mesh) {
      const m = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
      const orig = m.emissiveMap;
      // With the screensaver as the resting state there is no video to decode —
      // the material keeps this whole path (the atlas remap, the inverse-ACES
      // grade, the SCR-002 treatment) and samples a texture it never reads.
      const vid = SCREENSAVER ? null : ensureTVVideo();
      // Without a video there is no texture transform, so the shader sees raw uv and the
      // material is NOT remapped — uScrWin carries the mesh's real atlas window instead.
      const remapped = !!vid;
      const vtex = vid ? new THREE.VideoTexture(vid) : blankTexture();
      vtex.colorSpace = THREE.SRGBColorSpace;
      if (orig && vid) {
        vtex.flipY = orig.flipY;
        vtex.wrapS = orig.wrapS; vtex.wrapT = orig.wrapT;
        vtex.channel = orig.channel;
      }
      if (vid) {
        const uv = mesh.geometry.getAttribute(vtex.channel ? `uv${vtex.channel}` : 'uv');
        let u0 = Infinity, v0 = Infinity, u1 = -Infinity, v1 = -Infinity;
        for (let i = 0; i < uv.count; i++) {
          const u = uv.getX(i), v = uv.getY(i);
          u0 = Math.min(u0, u); v0 = Math.min(v0, v);
          u1 = Math.max(u1, u); v1 = Math.max(v1, v);
        }
        vtex.repeat.set(1 / (u1 - u0), 1 / (v1 - v0));
        vtex.offset.set(-u0 / (u1 - u0), -v0 / (v1 - v0));
      }
      const vm = m.clone();
      vm.emissiveMap = vtex;
      vm.emissive.set(1, 1, 1);
      vm.emissiveIntensity = TV_VIDEO_GLOW;
      // ★ SHOW THE VIDEO'S OWN COLOURS THROUGH ACES ("fix the color so it's
      // close to the original"). At glow x exposure the video landed deep in
      // the ACES shoulder — washed out and hue-shifted toward yellow. The fix
      // is looks.js's trick run in reverse at the SOURCE: pre-invert the ACES
      // fit (exact algebraic inverse — a ratio of quadratics is one quadratic
      // solve) and divide by exposure, so OutputPass lands each pixel back on
      // the video's own value. emissiveIntensity still scales ABOUT the base
      // glow, so the hover wake-up and the bake overdrive keep working.
      // Registered BEFORE litMaterials.add so gi/PCSS chain on top of it.
      // SCR-002 rides in the SAME replacement, because the treatment has to
      // sit between the texture fetch and the inverse-ACES grade: it works on
      // the video's own display-referred colours, which is where scanlines and
      // a grille are defined. Doing it after the grade would apply a display
      // effect to linear-HDR values and the mask would darken the wrong curve.
      const scrU = screenTreatUniforms(mesh, vm, remapped, SCREENSAVER ? MODE.SCREENSAVER : MODE.PASSTHROUGH);
      vm.onBeforeCompile = (shader) => {
        shader.uniforms.uVidExposure = tvVidExposure;
        Object.assign(shader.uniforms, scrU);
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>
            uniform float uVidExposure;
            float tvAcesInv1(float y) {
              y = clamp(y, 0.0, 0.999);
              float a = 2.43 * y - 2.51;
              float b = 0.59 * y - 0.03;
              float disc = max(b * b - 4.0 * a * (0.14 * y), 0.0);
              return (-b - sqrt(disc)) / (2.0 * a);
            }
            vec3 tvAcesInv(vec3 y) {
              return vec3(tvAcesInv1(y.r), tvAcesInv1(y.g), tvAcesInv1(y.b));
            }`)
          .replace('#include <emissivemap_pars_fragment>',
                   '#include <emissivemap_pars_fragment>' + SCREEN_TREAT_GLSL + SCREEN_CONTENT_GLSL)
          .replace('#include <emissivemap_fragment>', `
            #ifdef USE_EMISSIVEMAP
              float scrFace;
              vec3 scrCol = screenTreat( vEmissiveMapUv, scrFace );
              // totalEmissiveRadiance arrives as emissive x intensity (white
              // x glow); dividing by the base glow makes it a pure hover/bake
              // multiplier around the exact-colour value.
              totalEmissiveRadiance = ( totalEmissiveRadiance / ${TV_VIDEO_GLOW.toFixed(4)} )
                * tvAcesInv( scrCol ) * scrFace / max( uVidExposure, 1e-4 );
            #endif`);
      };
      // One flat key for all three devices, deliberately. The treatment is
      // entirely uniform-driven, so the three screens emit IDENTICAL GLSL and
      // share one compiled program. That is safe here because three keeps
      // `programs` and `uniforms` on the MATERIAL (WebGLRenderer.getProgram),
      // so onBeforeCompile still runs once per material and each device keeps
      // its own uScr* values — only the compile is shared. Baking the profile
      // into the key instead would cost three compiles for the same source.
      vm.customProgramCacheKey = () => 'tv-video-acesinv-scr002';
      mesh.material = vm;
      litMaterials.add(vm);
      // In screenMats so the GI bake overdrives it with the others. Note the
      // bake's restore sets every screen back to TV_GLOW — a dialled
      // ?tvvidglow= drifts after an in-session re-bake; reload to reassert.
      screenMats.add(vm);
    }

    // ── click-a-telly (hover + fly-to) ──────────────────────────────────────
    // One unit per screen: the screen mesh's PARENT GROUP is the telly (that
    // rule also catches the old computer's monitor — it has a Screen_Glow
    // too, and it being clickable is a feature). Hover indication is the
    // screen WAKING UP (emissive eased toward 1.7x) plus a pointer cursor —
    // cheaper and more in-world than an outline pass, and it reads instantly
    // because the screens are the brightest things in the room.
    function initTVFocus(propsRoot) {
      const units = [];
      const byMesh = new Map();
      propsRoot.traverse((o) => {
        if (!o.isMesh || !o.material) return;
        const list = Array.isArray(o.material) ? o.material : [o.material];
        if (!list.some((m) => m && m.name === 'Screen_Glow')) return;
        const root = o.parent && o.parent !== propsRoot ? o.parent : o;
        if (units.some((u) => u.root === root)) return;
        const meshes = [];
        root.traverse((c) => { if (c.isMesh) meshes.push(c); });
        const unit = { root, screen: o, meshes, mats: [] };
        units.push(unit);
        for (const c of meshes) byMesh.set(c, unit);
      });
      if (!units.length) return null;

      // ★ EACH TELLY GETS ITS OWN SCREEN MATERIAL. The glb shares Screen_Glow
      // instances between some sets, so brightening one screen lit its twins
      // too ("give each tv its own hover"). Split shared instances here —
      // BEFORE the gi/PCSS patch pass runs, because Material.clone() drops
      // onBeforeCompile, so a clone made later would silently lose both.
      {
        const claimed = new Set();
        for (const u of units) {
          for (const c of u.meshes) {
            const ms = Array.isArray(c.material) ? c.material : [c.material];
            ms.forEach((m, i) => {
              if (!m || m.name !== 'Screen_Glow') return;
              if (claimed.has(m)) {
                const treated = m.__scrTreated;
                m = m.clone();
                // clone() drops onBeforeCompile, and on the static path (?tvvideo=0) that patch IS
                // the picture since TV1: the static is a shader now, not a canvas the raw material
                // could still sample. Re-treat the clone so the split screen keeps its static and
                // its device treatment (both were already the intent of treatStaticScreen).
                if (treated) treatStaticScreen(c, m);
                if (Array.isArray(c.material)) c.material[i] = m; else c.material = m;
                litMaterials.add(m);
                screenMats.add(m);
              }
              claimed.add(m);
              u.mats.push(m);
            });
          }
        }
      }

      const allMeshes = [...byMesh.keys()];
      const ray = new THREE.Raycaster();
      const ptr = new THREE.Vector2();
      let hovered = null;

      // ★ THIS BLOCK NO LONGER OWNS THE POINTER (INT-001, DP-W8). It used to run its own
      // pointermove, its own window-capture pointerdown/up and its own 4 px click-not-drag test,
      // beside the jar tap's copy of the same and the feedback panel's copy of the same. Three
      // handlers, three ideas of what a press means, and no way for any of them to know a press
      // landed on nothing — which is exactly the "which control consumed that press?" family
      // loops-docs 00-input.md opens with. `tools/hotspots.js` is the single arbiter now; what
      // stays here is the BEHAVIOUR (the array pose, the lock, the return control), which is
      // Gate A's and has not changed. The array registers as one hotspot below.
      function setHover(unit) {
        if (unit === hovered) return;
        if (hovered) for (const m of hovered.mats) m.__glowT = m.__glowBase;
        hovered = unit;
        if (hovered) for (const m of hovered.mats) {
          if (m.__glowBase === undefined) m.__glowBase = m.emissiveIntensity;
          m.__glowT = m.__glowBase * 1.7;
        }
      }
      /** The aim pulse: every screen at once, for the unaimed-press beat. */
      function glowAll(on) {
        for (const u of units) for (const m of u.mats) {
          if (m.__glowBase === undefined) m.__glowBase = m.emissiveIntensity;
          m.__glowT = on ? m.__glowBase * 1.35 : m.__glowBase;
        }
        if (!on && hovered) for (const m of hovered.mats) m.__glowT = m.__glowBase * 1.7;
      }

      // While zoomed the camera is LOCKED — no orbit, no fly. A drag from the
      // locked pose would fight the framing and leave the toggle pointing at
      // nothing; the screen itself is the way back out.
      // ★ Lock the individual gates, NOT controls.enabled — flyTo() owns that
      // flag and sets it back to true unconditionally when the flight lands
      // (feedback.js), which un-locked the camera the moment the zoom arrived.
      let focused = null;
      let relockT = 0;
      let idleT = 0;
      let promptT = 0;              // 0..1, recomputed from wall clock in tick()
      // ── the view toggle ─────────────────────────────────────────────────
      // ★ IT NEVER LEAVES THE SCREEN NOW (Josh, 2026-09-11: "allow it to toggle between views
      // and remain on screen"). It used to appear 1.2 s after a push-in and fade out again
      // after 45 s idle, which is correct for a way OUT of a transient state and wrong for the
      // only in-world control in the Loop: a viewer who waited lost it, and there was nothing
      // on screen saying the room could be pushed into at all. It fades in once, ~1.2 s after
      // load, then stays — DIMMED after a few seconds of no input so it sits under the picture
      // rather than on top of it, back to full on any press or pointer move.
      let bornAt = performance.now();
      let lastNudge = performance.now();
      const PROMPT_DELAY_MS = 1200; // Gate A 2.3: "fades in ... after ~1.2 s"
      const PROMPT_FADE_MS  = 450;
      const PROMPT_IDLE_MS  = 8000; // no input for this long and it drops back
      const PROMPT_DIM      = 0.35; // ...to here, never to zero
      const PROMPT_DIM_MS   = 900;
      function nudgeToggle() { lastNudge = performance.now(); }
      // ★ In presentation mode the lock is PERMANENT. unfocus() calls this
      // with false when the return flight lands, so the OR is what stops a
      // single telly visit from handing a visitor the orbit and fly controls
      // for the rest of the session.
      function setCamLock(on) {
        const lock = on || PRESENT;
        if (controls) {
          controls.enableRotate = controls.enablePan = controls.enableZoom = !lock;
        }
        if (fly) fly.enabled = !lock;
      }
      // ★ ARRIVING AT A VIEW IS REPORTED TO THE SHELL, INCLUDING A CUT WE MAKE OURSELVES.
      // The two poses are DECLARED CAMERAS since 2026-09-11 (`room`, `screens` — see the
      // block below), and `cameraChanged` is the only way the shell learns where the view
      // actually is. The viewer pressing the in-world toggle is a camera change the shell
      // never asked for; without this it shows the other entry ticked for the rest of the
      // session and remembers the wrong one at re-entry.
      // ⚠ It calls the module-scope reporter DIRECTLY rather than taking a hook the scene
      // installs later. initTVFocus runs inside the props loader's CALLBACK, and the bridge
      // is attached at module top level — so any "wire them together afterwards" line here
      // would run before the bridge existed, print nothing, and leave the shell's camera list
      // silently out of step. That is the same scope trap that has already cost this file the
      // event engine, the cat's grid, the mouse and the hotspot registry.
      function reportView() { reportViewToShell(focused ? 'screens' : 'room'); }
      function unfocus() {
        focused = null;
        clearTimeout(idleT);
        if (homePose) flyer.flyTo(homePose.pos, homePose.tgt, 900);
        // re-enable once the return flight lands — enabling mid-flight lets a
        // drag fight the flyTo (unless another focus grabbed the lock again)
        clearTimeout(relockT);
        relockT = setTimeout(() => { if (!focused) setCamLock(false); }, 950);
        nudgeToggle();
        reportView();
      }

      function pick(x, y) {
        ptr.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
        ray.setFromCamera(ptr, camera);
        const hit = ray.intersectObjects(allMeshes, false)[0];
        return hit ? byMesh.get(hit.object) : null;
      }

      // ── SCREEN state (Gate A 2.1/2.2/2.3) ────────────────────────────────
      // ★ ONE POSE FOR THE WHOLE ARRAY, NOT ONE PER SCREEN. The previous
      // behaviour flew to whichever telly was clicked, measured off that one
      // mesh. Gate A 2.1 specifies a single SCREEN state in which "the camera
      // pushes in until the three-device array fills the frame" — three
      // separate destinations is three framings to art-direct, and it makes
      // the return control ambiguous about what it returns FROM.
      //
      // ★ AND IT IS STILL ONE DECLARED CAMERA (PLAN section 3 / Gate A 2.2):
      // one camera id, one flyTo instance, two poses. Nothing about the
      // platform contract changes — which is exactly why there must not be a
      // second flyTo constructed anywhere; two tweens writing camera.position
      // fight and the loser wins on alternate frames.
      //
      // ★ THE PUSH-IN DISTANCE IS MEASURED, NOT TYPED — Gate A's own number no
      // longer frames the thing it was computed for. Gate A 2.1 signs off the
      // pose (-1.34, 1.42, 0.10), but the array was WIDENED after that table
      // was written (the flanking screens were rebuilt to match by display
      // AREA, which needed a bigger Y-span; Gate A 2.4 explicitly sanctions
      // "the array can use the full front wall"). Measured at that pose, the
      // array projects to NDC x -1.12..+1.299 — it overflows BOTH edges, and
      // asymmetrically. So the eye HEIGHT stays Gate A's 1.42 m, and the
      // distance is solved for the array actually in the room.
      //
      // Solved per focus() rather than once, because it depends on the live
      // fov and aspect: the Focal dial and a window resize both change what
      // "fills the frame" means, and a pose cached at load would be wrong for
      // the rest of the session.
      const SCREEN_EYE_Y = 1.42;      // Gate A 2.1
      const SCREEN_FILL  = 0.92;      // array spans 92% of the frame, both axes

      function arrayPose() {
        const box = new THREE.Box3();
        // the whole DEVICES, not just the glass — a bezel clipped at the frame
        // edge reads as badly framed just as loudly as a clipped picture does
        for (const u of units) box.expandByObject(u.root);
        const tgt = box.getCenter(new THREE.Vector3());
        const corners = [];
        for (const x of [box.min.x, box.max.x])
          for (const y of [box.min.y, box.max.y])
            for (const z of [box.min.z, box.max.z])
              corners.push(new THREE.Vector3(x, y, z));

        // A probe camera, so nothing here can disturb the live one mid-flight.
        const probe = new THREE.PerspectiveCamera(camera.fov, camera.aspect,
                                                  camera.near, camera.far);
        const fits = (eyeX) => {
          probe.position.set(eyeX, SCREEN_EYE_Y, tgt.z);
          probe.lookAt(tgt);
          probe.updateMatrixWorld(true);
          probe.updateProjectionMatrix();
          let m = 0;
          for (const c of corners) {
            const p = c.clone().project(probe);
            m = Math.max(m, Math.abs(p.x), Math.abs(p.y));
          }
          return m;
        };
        // Walk back from Gate A's x until it fits. Bisection rather than a
        // formula because the extreme corner swaps between the near and far
        // faces of the devices as the eye moves — there is no single closed
        // form for "the widest thing in shot".
        // `near` is the end that does NOT fit (too close), `far` is the end
        // that does. Keep that invariant straight — inverting the branches
        // collapses the search back onto the starting x and the pose silently
        // stays exactly the typed number you were trying to replace.
        let near = -1.34, far = -1.34;
        while (fits(far) > SCREEN_FILL && far > -6) far -= 0.25;
        for (let i = 0; i < 24; i++) {
          const mid = (near + far) / 2;
          if (fits(mid) > SCREEN_FILL) near = mid; else far = mid;
        }
        return { pos: new THREE.Vector3(far, SCREEN_EYE_Y, tgt.z), tgt };
      }

      function focus() {
        const pose = arrayPose();
        flyer.flyTo(pose.pos, pose.tgt, 900);
        focused = true;
        clearTimeout(relockT);
        setCamLock(true);
        nudgeToggle();
        reportView();
      }

      /** The shell's camera list, and our own toggle, both land here. Returns false for an
       *  id we do not own so the bridge refuses to confirm it. */
      function setView(id) {
        if (id === 'screens') { if (!focused) focus(); return true; }
        if (id === 'room')    { if (focused) unfocus(); else reportView(); return true; }
        return false;
      }

      // ★ GATE A 2.3'S 45-SECOND AUTO-RETURN IS GONE, AND IT HAD TO GO. It was right while the
      // push-in was a transient state the viewer fell into; as a DECLARED CAMERA the screens are
      // a view the viewer CHOSE — possibly from the shell's own Settings list — and the shell
      // remembers that choice per Loop. A timer that moves them back and reports
      // `cameraChanged('room')` would overwrite the choice they made, in a panel they are not
      // looking at, and hand it back wrong at the next entry. Gate A amendment, recorded on #5.

      function tick(dt) {
        // The return control's fade, ABOVE the bake guard on purpose: the
        // control is UI, and a GI bake has nothing to do with whether the
        // viewer can find their way back out of the SCREEN state. Everything
        // below the guard is screen EMISSIVE, which the bake does own.
        // ★ WALL CLOCK, NOT ACCUMULATED FRAME dt. The delay is a promise to
        // the viewer ("about a second and the way out appears"), and its
        // partner — the 45 s idle return — is a setTimeout, so it is wall
        // clock too. Driving one from dt and the other from a timer makes
        // them disagree the moment frame rate drops, and this Loop targets
        // 30 fps on a phone. Measured under a throttled tab here (2.7 fps,
        // dt accumulating at a fifth of real time) the control took five
        // times as long to appear as it should have, while the auto-return
        // still fired on schedule. dt also carries a 0.1 s clamp, so every
        // hitch permanently loses the fade a little more time.
        const now = performance.now();
        const born = Math.min(1, Math.max(0, (now - bornAt - PROMPT_DELAY_MS) / PROMPT_FADE_MS));
        // Pointer activity counts as a nudge, and on a touchscreen a PRESS is the only activity
        // there is — the arbiter stamps both.
        const active = Math.max(lastNudge, hotspots ? hotspots.lastMoveAt : 0);
        const idle = Math.min(1, Math.max(0, (now - active - PROMPT_IDLE_MS) / PROMPT_DIM_MS));
        // A pointer resting ON the control must not let it dim underneath itself.
        promptT = Math.max(born * (1 - idle * (1 - PROMPT_DIM)), born * lens.promptHot);
        // ★ The words say what pressing it DOES, not where you are. Josh, 2026-09-11: "use
        // 'zoom in' and 'zoom out' for labels on screen". The shell's Cameras list says where
        // you are instead ("The Outpost" / "The Screens") — a list of places, a button of verbs.
        lens.setPromptLabel(focused ? '\u25C4 ZOOM OUT' : 'ZOOM IN \u25BA');
        lens.setPrompt(promptT);
        // the bake overdrives the screens; easing mid-bake would fight it
        if (gi && gi.baking) return;
        for (const u of units) for (const m of u.mats) {
          if (m.__glowT === undefined) continue;
          m.emissiveIntensity += (m.__glowT - m.emissiveIntensity) * Math.min(1, dt * 12);
        }
      }
      // Exposed for the same reason as window.__rt and window.__lens: the
      // SCREEN state's timings (a 1.2 s fade-in, a 45 s idle return) are not
      // things anyone can eyeball, and this is the handle a scripted check
      // reads them through.
      return { tick, focus, unfocus, setView, units, allMeshes, setHover, glowAll, byMesh,
               nudgeToggle,
               get view() { return focused ? 'screens' : 'room'; },
               get focused() { return !!focused; },
               get prompt() { return promptT; } };
    }

    // Consumer dials layered over the calibrated pairs: `shade` scales BOTH AO
    // amounts about their fitted values, `flarex` scales the format's flare/streak
    // pair, `drift` is the slow camera sway. All three are panel dials + URL keys.
    const RT_SHADE  = parseFloat(q.get('shade')  ?? '0.38'); // walls (structure)
    const RT_SHADEF = parseFloat(q.get('shadef') ?? '1');   // up-facing (floor)
    const RT_SHADEP = parseFloat(q.get('shadep') ?? '1');   // props, whole objects
    const RT_FLAREX = parseFloat(q.get('flarex') ?? '1');
    // Drift defaults OFF: even the tamed sway read as "the camera offsets after
    // load" to the art director on a locked shot. It is an opt-in dial now.
    const RT_DRIFT  = parseFloat(q.get('drift')  ?? '0');
    // 1.0 m since 2026-08-19 (was 1.6): the wall-base glow band — GI painting
    // the bottom courses 3.5x brighter than the same wall a metre up — was the
    // GRID, not a leak. Validity and bias sweeps moved nothing (all probes
    // involved are legit indoor ones); the nearest probe to a wall base simply
    // sits in open floor soaking up floor bounce, and a 1.6 m grid smears that
    // across the whole junction. 14x9x14 = 1764 probes, ~35 s bake, ~56 KB.
    const GI_SPACING = parseFloat(q.get('gistep') ?? '1.0');
    const GI_BOUNCES = parseInt(q.get('gibounce') ?? '2', 10);
    const GI_CUBE    = parseInt(q.get('gicube') ?? '16', 10);
    const GI_FORCE   = q.get('gibake') === '1';

    // ── renderer ────────────────────────────────────────────────────────────
    // ★ install() splices the PCSS branch into three's shadow chunk and MUST run
    // before any lit material compiles. It was missing here (n031: "the soften
    // slider doesn't affect the shadows") — patch() happily set USE_PCSS defines
    // for a branch that did not exist, so the whole loop ran plain PCF and both
    // the dial and ?sunang= were dead from birth.
    PCSS.install();

    // ── device tier ─────────────────────────────────────────────────────────
    // ★ THE BRIDGE DOES NOT TELL A WEB LOOP WHAT IT IS RUNNING ON — v1 injects no
    //   platform field and v2 does not add one — so the class is a guess off `navigator`
    //   and it is never load-bearing: it picks where the ladder STARTS, and the measured
    //   frame rate walks the rest (tools/perf-tier.js). ?tier=phone forces a class so the
    //   whole thing can be exercised on the Mac; ?tierlevel=N pins a level and stops the
    //   ladder. The static half of a level has to be decided here, before the renderer and
    //   the AO target exist; the rest is live and sits in the frame loop.
    // ★ THE SHELL SAYS WHAT IT IS RUNNING ON NOW (bridge v3, loops-docs CHANGELOG 2026-09-17),
    //   so the guess off `navigator` is the fallback rather than the answer. Its vocabulary is
    //   phone · tablet · laptop · desktop · ultra · max · tv; this ladder has four classes, so
    //   the desktop-sized names fold into 'desktop' and an unknown name falls back to the guess.
    const SHELL_TIER = (typeof window !== 'undefined' && window.collectivus?.device?.tier) || null;
    const TIER_CLASS = q.get('tier') ||
      ({ phone: 'phone', tablet: 'tablet', laptop: 'desktop', desktop: 'desktop', ultra: 'desktop',
         max: 'desktop', tv: 'tv' })[SHELL_TIER] || detectClass();
    // ★ THE WALK PINS THE TIER, AND THE FIRST DEVICE RUN PROVED WHY IT HAS TO DO IT FROM IN
    //   HERE. The ladder and the walk cannot both own the frame: a step-down mid-window changes
    //   the content under a measurement. The walk warned about this from day one — and the
    //   warning fired on the phone, because a PAYLOAD HAS NO QUERY STRING and `?tierlevel=0`
    //   was the only remedy offered. Measured cost of that: the whole resolution curve of the
    //   2026-09-13 window-1 run, taken while the ladder stepped 2 -> 3 -> 4 underneath it.
    //   A guard whose only remedy is unavailable where the guard fires is not a guard.
    const WALK_ON = ['1', '2', '3', '4', '5', '6'].includes(q.get('perfwalk')) ||
                    (typeof window !== 'undefined' && !!window.__CLV_PERF_WALK);
    const TIER_PIN = q.has('tierlevel') ? parseInt(q.get('tierlevel'), 10) : (WALK_ON ? 0 : NaN);
    // An A14-class phone starts at the floor it always ends on (tools/perf-tier.js startLevel).
    const TIER_START = Number.isFinite(TIER_PIN) ? TIER_PIN
                     : startLevel(TIER_CLASS, window.collectivus?.device?.gpuFamily);
    // 4x MSAA and a 2048 sun map are the values factory-rt measured on a desktop GPU. On a
    // phone both are bandwidth the frame cannot afford, and PCSS scatters 40 taps across
    // that map per pixel, so halving its edge quarters the footprint it thrashes.
    // ★ THESE FOLLOW THE DEVICE CLASS, NOT THE PINNED LEVEL. They are allocation-time choices
    //   — a render target's sample count and a shadow map's size cannot change per rung — so
    //   deriving them from TIER_START meant that PINNING a phone to level 0, which is exactly
    //   what a measurement run does, silently gave it a DESKTOP frame to measure. Every
    //   number would then describe a build no phone ever runs. Class, not level.
    const TIER_HEAVY = TIER_CLASS === 'desktop' || TIER_CLASS === 'tablet';
    const TIER_BEAUTY_SAMPLES = TIER_HEAVY ? 4 : 2;
    const TIER_SHADOW_MAP = TIER_HEAVY ? 2048 : 1024;

    const renderer = new THREE.WebGLRenderer(); // AA is the composer's MSAA target
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping; // applied by looks' OutputPass
    renderer.toneMappingExposure = EXPOSURE;
    renderer.shadowMap.enabled = true;
    // PCSS reads packed DEPTH out of the map — PCF, never VSM (moments read as garbage).
    renderer.shadowMap.type = THREE.PCFShadowMap;
    // ★ A FRAME RENDERS THE SCENE MORE THAN ONCE, AND EVERY renderer.render() REBUILDS
    //   EVERY SHADOW MAP UNLESS YOU STOP IT. Measured at the room pose, 1280x720,
    //   whole-frame: the two shadow-casting lights are 708 draws, and they were being
    //   drawn TWICE — once for the beauty render and once for the shafts' depth prepass
    //   — which is 1,416 of the frame's 2,189 calls for an answer that cannot have
    //   changed in between. autoUpdate off + needsUpdate once at the top of renderFrame
    //   is one shadow pass per frame, and the movers still get a fresh one every frame.
    //   (The props-depth pass never paid it: camera.layers.set(1) leaves the lights out
    //   of the render list, so three's shadow pass returns early on `lights.length === 0`.)
    renderer.shadowMap.autoUpdate = false;
    document.body.appendChild(renderer.domElement);
    const MAX_ANISOTROPY = renderer.capabilities.getMaxAnisotropy();

    // Depth prepass target for the raymarched shafts — the march stops at real geometry.
    // Built only on the ?ao=0 path: with the AO on, the beauty target's own DepthTexture
    // is the same buffer and the prepass is dead weight (see the shafts block below), so
    // allocating this unconditionally spent ~7 MB of GPU memory on a target nothing read.
    const dpr0 = renderer.getPixelRatio();
    let depthRT = null;
    function makeDepthRT() {
      const rt = new THREE.WebGLRenderTarget(innerWidth * dpr0, innerHeight * dpr0);
      rt.depthTexture = new THREE.DepthTexture(innerWidth * dpr0, innerHeight * dpr0);
      rt.depthTexture.type = THREE.UnsignedIntType;
      rt.texture.minFilter = THREE.NearestFilter;
      rt.texture.magFilter = THREE.NearestFilter;
      return rt;
    }

    // Props-only depth, for the AO's third channel: prop meshes also live on
    // camera layer 1, and each frame this target gets a depth render of layer 1
    // alone. A pixel whose scene depth matches this depth IS a prop, which is
    // how the composite tells "prop standing in the room" from "the wall behind
    // it" — screen-space AO has no other way to know what an object is.
    const propsDepthRT = new THREE.WebGLRenderTarget(innerWidth * dpr0, innerHeight * dpr0);
    propsDepthRT.depthTexture = new THREE.DepthTexture(innerWidth * dpr0, innerHeight * dpr0);
    propsDepthRT.depthTexture.type = THREE.UnsignedIntType;
    propsDepthRT.texture.minFilter = THREE.NearestFilter;
    propsDepthRT.texture.magFilter = THREE.NearestFilter;

    // ── sky ─────────────────────────────────────────────────────────────────
    // Not decoration: the GI probes render the scene from inside the room, so this dome
    // is the source of all the daylight the bounce carries. Cooler and dimmer than the
    // factory's — the reference reads overcast-soft, not blue-sky-hard.
    const SKY_ZENITH  = 0x5d99d6;
    const SKY_HORIZON = 0xd6e6f5;
    const SKY_GROUND  = 0x6b6459;
    const SKY_GAIN    = parseFloat(q.get('sky') ?? '0.55');

    const scene = new THREE.Scene();
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        uZenith:  { value: new THREE.Color(SKY_ZENITH) },
        uHorizon: { value: new THREE.Color(SKY_HORIZON) },
        uGround:  { value: new THREE.Color(SKY_GROUND) },
        uGain:    { value: SKY_GAIN },
      },
      vertexShader: `
        varying vec3 vDir;
        void main() {
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform vec3 uZenith, uHorizon, uGround;
        uniform float uGain;
        varying vec3 vDir;
        void main() {
          float h = vDir.y;
          vec3 up   = mix(uHorizon, uZenith, pow(clamp(h, 0.0, 1.0), 0.45));
          vec3 down = mix(uHorizon, uGround, pow(clamp(-h, 0.0, 1.0), 0.5));
          gl_FragColor = vec4((h > 0.0 ? up : down) * uGain, 1.0);
        }`,
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 24), skyMat);
    sky.renderOrder = -1;
    sky.frustumCulled = false;
    scene.add(sky);

    // ── the rig ─────────────────────────────────────────────────────────────
    RectAreaLightUniformsLib.init();
    const rig = new THREE.Group();
    rig.name = 'RealtimeRig';
    scene.add(rig);

    const sun = new THREE.DirectionalLight(0xb9cdec, RT_SUN);
    sun.castShadow = true;
    // ★ 2048, NOT 4096 — the 4096 map was the frame-pacing bug at large windows
    // (2026-08-19). PCSS scatters 40 taps per pixel across the map, and at 4096
    // those reads thrash the texture cache: measured at 2560x1340, mean 17 ms
    // with a THIRD of frames spiking past 28 ms (p50 7 / p95 42 — pure jitter),
    // against a flat 7.0 ms / p95 7.1 / zero spikes at 2048. 1024 buys nothing
    // further (6.94). The penumbra is far wider than a 2048 texel (~1.7 cm
    // here), so the blur hides the resolution — that is what PCSS is for.
    // A phone gets 1024 by tier: those desktop numbers were measured on a desktop GPU, and
    // the same cache thrash that made 4096 unaffordable at 2560-wide makes 2048 unaffordable
    // there. The penumbra argument holds at both sizes.
    sun.shadow.mapSize.set(
      parseInt(q.get('sunmap') ?? String(TIER_SHADOW_MAP), 10),
      parseInt(q.get('sunmap') ?? String(TIER_SHADOW_MAP), 10));
    // ★ bias lives in METRES and is converted where the depth range is known (aimSun) —
    // shadow.bias is normalised depth, so refitting the box silently rescales a raw number.
    const SHADOW_BIAS_M = parseFloat(q.get('shadowbias') ?? '0.0012');
    sun.shadow.normalBias = parseFloat(q.get('shadownormal') ?? '0.004');
    rig.add(sun, sun.target);

    // Rect lights fill the real roof apertures (measured from the glb, never typed).
    const MAX_SKYLIGHTS = 6;
    const skylights = [];
    for (let i = 0; i < MAX_SKYLIGHTS; i++) {
      const l = new THREE.RectAreaLight(0xcfe0f2, 0, 1, 1);
